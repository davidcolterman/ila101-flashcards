 premium roll-forward or in-kind asset transfer","source":"Pension Risk Transfer in Canada and the US","reading":"Pension Risk Transfer in Canada and the US","chapter":null,"section":"A"},{"q":"Describe group annuity policy differences from individual annuity.","a":"\u2022 Group contract = insurer + plan sponsor\n  \u25e6 Buy-outs only: annuitants receive certificate of benefit entitlement\n\u2022 Buy-out annuities mirror pension plan benefits\n  \u25e6 Benefits may be CPI-linked or integrated with government benefits\n\u2022 Buy-in annuities may pay level benefit, sponsor covers inflation increases","source":"Pension Risk Transfer in Canada and the US","reading":"Pension Risk Transfer in Canada and the US","chapter":null,"section":"A"},{"q":"Outline policy requirements for deferred annuitants.","a":"\u2022 Commutation options\n\u2022 Retirement options:\n  \u25e6 Allowed retirement date\n  \u25e6 Penalties for early retirement\n  \u25e6 Pension forms available\n\u2022 Buy-ins allow cashouts in specific circumstances per regulations","source":"Pension Risk Transfer in Canada and the US","reading":"Pension Risk Transfer in Canada and the US","chapter":null,"section":"A"},{"q":"List main assumptions for group annuity pricing.","a":"1. Expected asset return\n2. Expected asset defaults\n3. Longevity base table and improvement scale\n4. Acquisition and maintenance expenses\n5. Annuitant behavior\n6. Provisions for adverse deviation\n7. Profitability level","source":"Pension Risk Transfer in Canada and the US","reading":"Pension Risk Transfer in Canada and the US","chapter":null,"section":"A"},{"q":"Outline pricing considerations for group annuities.","a":"1. Asset mix \u2013 heavily influences pricing, can change daily\n  \u25e6 Group annuity CFs mostly illiquid \u2192allows investment in illiquid assets\n  \u25e6 Commutation options \u2191liquidity needs\n2. Longevity \u2013 assumptions vary widely by insurer\n  \u25e6 Pricing depends on date longevity risk transfers from sponsor to insurer\n  \u25e6 Assumptions based on: zip code, job type, experience data\n  \u25e6 Data consistency allows more aggressive pricing\n  \u25e6 Mortality improvement usually based on industry tables\n3. Liquidity \u2013 relevant if deferred annuitants allowed to commute\n  \u25e6 Requires assumption: % expected to choose commutation\n4. Market risk margins \u2013 for adverse market movements after quote\n  \u25e6 Reduced by premium roll-forward or in-kind asset transfer\n5. Data risk margins \u2013 based on insurer\u2019s ability to adjust/reprice\n6. Annuitant behavior \u2013 relevant if deferred annuitants have options\n  \u25e6 Subsidized options require assumptions for retirement date and pension form\n7. Consultant commissions \u2013 usually paid by sponsor or pension fund\n8. Reinsurance or offshore structures used by insurer","source":"Pension Risk Transfer in Canada and the US","reading":"Pension Risk Transfer in Canada and the US","chapter":null,"section":"A"},{"q":"Outline risk mitigation approaches for group annuities.","a":"\u2022 Investment risk:\n  \u25e6 Careful credit UW\n  \u25e6 Invest in higher quality fixed income assets\n  \u25e6 Limit non-fixed income investments\n\u2022 Interest rate risk:\n  \u25e6 Closely match A/L duration at key rates\n\u2022 Longevity risk: challenging (lifestyle, environment, medicine, pandemics)\n  \u25e6 Limit # deferred annuitants\n  \u25e6 Use conservative assumptions if data points misaligned\n  \u25e6 Issue life business for natural hedge\n  \u25e6 Reinsure longevity risk\n\u2022 Annuitant behavior risk:\n  \u25e6 Use conservative assumptions for retirement date and pension form\n\u2022 Operational risk \u2013 incorrect payments, paying deceased annuitants\n  \u25e6 Mitigate by regularly verifying annuitants alive","source":"Pension Risk Transfer in Canada and the US","reading":"Pension Risk Transfer in Canada and the US","chapter":null,"section":"A"},{"q":"List the 6 steps to establish experience assumptions.","a":"\u201cI DARDM\u201d to establish experience assumptions!\n1. Identify assumptions needed\n2. Determine structure of each assumption\n3. Analyze experience and trends\n4. Review assumptions for reasonableness, consistency\n5. Document assumptions\n6. Monitor experience and update assumptions","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"List primary types of assumptions for experience studies.","a":"1. Obligation (liability) assumptions\n  \u25e6 Mortality, lapse, expense, etc.\n2. Asset assumptions\n  \u25e6 Investment income rate, capital gains rate, defaults, etc.\n3. Scenario assumptions\n  \u25e6 Determinstic vs. stochastic interest rates\n  \u25e6 Sensitivity testing","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to determine assumption structure?","a":"Determine experience classes\n\u2022 Groups of policies with same assumption\n\u2022 Similar type, structure, marketing objectives\nKey principles when deciding complexity\n\u2022 Reflect differences in actual experience\n\u2022 Use objective definitions\n\u2022 Be practical and cost effective","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"List considerations when analyzing experience and trends.","a":"1. Evaluate credibility\n  \u25e6 Quantity of data, homogeneity, reasonableness\n2. Evaluate data quality\n  \u25e6 Alternative sources?\n  \u25e6 Appropriate? Comprehensive enough?\n3. Actual vs. similar experience\n  \u25e6 Use actual if available and credible\n4. Reflect trends\n  \u25e6 Example: mortality improvement\n5. Reflect company and external factors\n  \u25e6 UW, investment policy, other business practices\n6. Sensitivity test assumptions","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"List checks for reviewing assumptions for reasonableness and consistency.","a":"Consistency Checks\n\u2022 Inflation consistent with investment earnings?\n\u2022 Mortality anti-selection and lapses\nValidation Checks\n\u2022 Static (starting reserves)\n\u2022 Dynamic (projected reserves)","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to document assumptions?","a":"\u2022 Actual assumptions\n  \u25e6 Value, applicable class\n\u2022 Data used\n  \u25e6 Source, values, concerns, adjustments, reliance on others\n\u2022 Methods used to develop assumptions\n  \u25e6 E.g. credibility method\n\u2022 How to use assumption\n  \u25e6 Pricing vs. CFT\n  \u25e6 Sensitivity testing\n  \u25e6 Regulatory requirements","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"List key steps to determine mortality assumption.","a":"1. Determine Structure\n  \u25e6 Example: S&U ALB table varying by M/F, SM/NS\n2. Analyze experience\n  \u25e6 Do mortality study (e.g. 5-year CY study)\n  \u25e6 Develop expected mortality rates from study\n  \u25e6 Assess credibility of expected assumption\n  \u25e6 Adjust mortality rates\n  \u25e6 Trends (improvement, etc.)\n  \u25e6 Anti-selection \u2013 conservation of deaths\n  \u25e6 Blend with similar/industry experience if credibility low\n  \u25e6 Adjust for differences in UW, distribution, market, etc.\n  \u25e6 Blend M/F rates into aggregate rates (if needed)\n3. Monitor experience (A/E ratios)\nMore detail on these steps in other flash cards","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"What is the structure of a mortality assumption?","a":"\u2022 Select and ultimate common\n\u2022 Possible variations\n  \u25e6 Risk class\n  \u25e6 Selection process (type of UW)\n  \u25e6 Size of policy (bigger face \u2192lower mortality)\n  \u25e6 Market method (direct, agent, etc.)\n\u2022 Mortality improvement\n\u2022 Age last birthday (ALB) vs. age nearest birthday (ANB)\nqALBpxq \u201c 0.5 \u02c6\n\u201c\nqANBpxq ` qANBpx ` 1q\n\u2030\nqANBpxq \u201c 0.5 \u02c6\n\u201c\nqALBpxq ` qALBpx \u00b4 1q\n\u2030","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to analyze mortality experience using confidence intervals?","a":"Mean and variance for expected claims E:\nE \u201c nq\nVarpEq \u201c npq\nConfidence interval for expected claims and the expected mortality rate q\n95% C.I. For E :\nE \u02d8 1.96\na\nVarpEq\n95% C.I. For q :\n95% C.I. For E\nn","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"What are the 2 main types of mortality studies, and how are different risk classes\nhandled?","a":"Typically done on standard issues, with separate studies for:\n1. Non-routine UW\n2. Conversions \u2192usually higher mortality\n3. Sub-standards\n4. Non-forfeiture provisions (ETI, RPU)\n5. Multiple-life policies\nTwo types of studies:\n1. Calendar year\n  \u25e6 Look at activity for a single calendar year\n  \u25e6 Must account for new policies, withdrawals, and deaths\n2. Anniversary-to-anniversary\n  \u25e6 Simpler because study year coincides with policy year\n  \u25e6 Done on an issue year / duration basis","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to determine calendar year mortality exposure?","a":"A ` N \u201c W ` D ` B\nSituation\nExposure\n(A, W)\ns\nExisting policy withdraws at age x ` s\n(A, D)\n1\nExisting policy dies in calendar year\n(A, B)\n1\nExisting policy survives entire calendar year\n(N, W)\ns \u00b4 r\nNew policy enters at age x ` r, then withdraws at age x ` s\n(N, D)\n1 \u00b4 r\nNew policy enters at age x ` r, then dies in calendar year\n(N, B)\n1 \u00b4 r\nNew policy enters at age x ` r and survives entire calendar year","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to determine mortality rate from a mortality study?","a":"Balducci assumption:\nqpxq \u201c\nDeaths\nTotal Exposure \u201c\nD\nA ` p1 \u00b4 rqN \u00b4 p1 \u00b4 sqW\nCan be done at policy level or in aggregate\n\u2022 Policy level data\n  \u25e6 Sum up individual exposures\n\u2022 Aggregate data (i.e. you just have the totals)\n  \u25e6 Assume new issues and withdrawals occur mid-year (s \u201c r \u201c 0.5)\nqpxq \u201c\n\u0159 D\n\u0159 A ` 0.5 \u0159 N \u00b4 0.5 \u0159 W","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to enhance credibility of mortality studies and develop confidence intervals for A/E\nratios?","a":"Credibility Considerations\n1. Multi-year studies have higher credibility\n  \u25e6 Problem: Too many years may hide trends (5 years is good)\n2. Credibility usually lower for amount-based studies\n3. A/E ratios useful for assessing credibility and tracking trends\nActual-to-Expected (A/E) Ratios\nBy Count\nBy Amount\nE\n\u0159 qpiq\n\u0159 Apiqqpiq\nVar\n\u0159 qpiqr1 \u00b4 qpiqs\n\u0159rApiqs2qpiqr1 \u00b4 qpiqs\n95% C.I. for Claims (CIC):\nE \u02d8 1.96\na\nVarpEq\n95% C.I. for A/E Ratio:\nCIC\nE","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"What is the conservation of deaths principle?","a":"qrxs`t \u201c wASqrx`rs`t\u00b4r ` p1 \u00b4 wASqqAS\nrxs`t\nTotal mortality = weighted average of:\n1. Mortality of the \u201cselect\u201d lives that lapse in duration r\n2. Mortality of the lives that stay with the original policy\nKey pricing concept: If you don\u2019t account for selective lapsation, you will under-price\nthe product","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"List at least 4 variations in lapse assumption structure.","a":"1. Product design\n  \u25e6 Term: High (shock) lapses when ART period\nbegins\n  \u25e6 Annuities: High (shock) lapses after SC period\n  \u25e6 Permanent insurance: High 1st-year lapses\n2. Distribution channel\n  \u25e6 Brokerage: Higher lapses\n  \u25e6 Agency: Higher lapses if agent quality is poor\n3. Policy size\n  \u25e6 Small policies: high early lapses\n  \u25e6 Large policies: high later lapses\n4. Premium mode\n  \u25e6 Lapses generally occur on premium due dates\n  \u25e6 Flexible premium: assume uniform monthly\n5. Product type\n  \u25e6 Deferred annuities: more sensitive to lapse\nrates than life insurance\n6. Conservation program effectiveness","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to determine exposure for lapse study and credibility of lapse assumption?","a":"Lapse Experience Credibility (Confidence Interval)\nE \u02d8 1.96\na\nVarpEq\nLapse Studies\nwpxq \u201c\nW\nA ` p1 \u00b4 rqN \u00b4 p1 \u00b4 sqD\n\u2022 Mechanically the same as a mortality study \u2013 death and lapse trade places\n\u2022 Lapses get a full year of exposure","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"List specific types of lapses.","a":"1. Termination on:\n  \u25e6 Failure to pay premium (term)\n  \u25e6 Full cash surrender\n  \u25e6 Partial cash surrender\n  \u25e6 Policy loan \u0105 CSV\n2. Nonforfeiture transfers \u2013 ETI, RPU\n3. Term conversions\n4. Premium persistency \u2013 actual premium as % of target premium (UL)","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"Describe interest rate assumption structure: Deterministic vs. Stochastic and Policy\nLoans.","a":"Investment Assets\n\u2022 Deterministic\n1. Portfolio average\n2. Investment generation\n\u2022 Stochastic\n  \u25e6 Useful for more important risks\n  \u25e6 Rates can vary with time, asset class, quality, and credit risk\nPolicy Loans\n\u2022 Can be modeled as assets or negative liabilities\n\u2022 Net of policy loan expenses\n\u2022 Utilization rate","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"Write formulas for interest rates on book value vs. market value basis.","a":"Book Value Basis:\nI \u201c Ai ` pB \u00b4 A \u00b4 Iq\n\u02c6 i\n2\n\u02d9\n\u00f1\ni \u201c\n2I\nA ` B \u00b4 I\nMarket Value Basis:\nr \u201c B \u00b4 A \u00b4 C\nA ` C\n2","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"Write formulas for time-weighted vs. dollar-weighted rates.","a":"Time-weighted return\nr \u201c\n\u201c\np1 ` r1qp1 ` r2q \u00a8 \u00a8 \u00a8 p1 ` rnq\n\u2030p1{nq \u00b4 1\nDollar-weighted return\nValuet \u201c CFt\u00b41p1 ` rq ` CFt\u00b42p1 ` rq2 ` \u00a8 \u00a8 \u00a8 ` CFt\u00b4np1 ` rqn","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"Distinguish between direct and indirect expenses.","a":"Direct\nIndirect\n\u2022 Commissions\n\u2022 Premium taxes\n\u2022 Underwriting\nOverhead\nExpenses\n\u2022 Maintenance\n\u2022 Aquisition\n\u2022 New LOB\nExpress as:\n\u2022 Per policy\n\u2022 % premium\n\u2022 Per unit\nVary with sales","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"How to determine exposure in an expense study?","a":"Key Concepts\n1. Goal: Develop policy count base for per policy expenses\n2. How: Count the number of policy years that start in the study\u2019s calendar year\n  \u25e6 BOYs \u201ccrossed\u201d in CY = A ` N \u00b4 W{2\n  \u25e6 Mid-years \u201ccrossed\u201d in CY = A ` N{2 \u00b4 W{2\nExposure Count \u201c\n$\n\u2019\n\u2019\n\u2019\n&\n\u2019\n\u2019\n\u2019\n%\nA ` B ` N\n2\nfor BOY expenses\nA ` B\n2\nfor mid-year expenses\nAssumes withdrawals and new issues occur mid-year","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"List methods for allocating expenses.","a":"1. Transaction count (e.g. number of premium payments)\n2. Transfer costs (employee benefit cost per employee)\n3. Employee time spent on activities\n4. Index-based allocation (policy count or premium)","source":"ILA101-106: Experience Assumptions","reading":"ILA101-106: Experience Assumptions","chapter":null,"section":"B"},{"q":"Define:\n\u2022 Study period\n\u2022 Study population\n\u2022 Cell\n\u2022 Experience rates\n\u2022 Rate types: Decrement rates, Utilization rates","a":"\u2022 Study period \u2013 period of time covered\n\u2022 Study population \u2013 insureds, employees, etc.\n\u2022 Cell \u2013 combinations of data dimensioned by issue age, sex, smoker/nonsmoker,\npolicy year, etc.\n\u2022 Experience rates \u2013 mortality rates, lapse rates, etc. for each cell\n\u2022 Rate type\n  \u25e6 Decrement rates = probabilities from 0 to 1\n  \u25e6 Mortality, morbidity, lapse, etc.\n  \u25e6 Utilization rates \u2030 probabilities (can exceed 1)\n  \u25e6 Withdrawal rates, option election rates, etc.","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Calculate EX reflecting withdrawal rates using Balducci Hypothesis:\n\u2022 For individual calculations\n\u2022 For grouped calculations","a":"Ex \u201c\n#\n\u2113x \u00b4 \u0159wx\ni\u201c1p1 \u00b4 tiq \u201c p\u2113x \u00b4 wxq ` \u0159wx\ni\u201c1 ti\nfor individual calculations\n\u2113x \u00b4 1\n2wx\nfor grouped calculations","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Formula for exposure-weighted average mortality rate over an N-year period starting at\nage x","a":"q \u201c\n\u0159N\nt\u201c0 Ex`tqx`t\n\u0159N\nt\u201c0 Ex`t\n\u201c\n\u0159N\nt\u201c0 dx`t\n\u0159N\nt\u201c0 Ex`t","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Amount-weighted studies: individual amount weights","a":"Individual amount weights\n\u2022 Multiply each life year exposure by policy\u2019s DB\n\u2022 Sum amount exposures and calculate qx\u2019s in the usual way","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Amount-weighted studies: grouped amount weights","a":"Grouped amount weights\n\u2022 The \u2113x terms \u2192\u2113x \u02c6 Average DB In Force\n\u2022 The dx terms \u2192dx \u02c6 Average DB Paid on Death\n\u2022 The wx terms \u2192wx \u02c6 Average DB on Withdrawn Policies\n\u2022 Sum amount exposures and calculate qx\u2019s in the usual way","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Relationship between amounted-weighted q and life-weighted q?","a":"Amounted-weighted q will be \u0105 life-weighted q if average DB paid on death \u0105 average\nDB in force","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"A/E ratio at individual level?","a":"The A/E ratio at each age x is:\npA{Eqx \u201c dx\ndex\n\u201c qxEx\nqex Ex\n\u201c qx\nqex\nwhere e denotes expected values, and the others are actuals","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"A/E ratio at aggregate level?","a":"The A/E ratio at an aggregate level is:\nqe \u201c\n\u0159 Exqe\nx\n\u0159 Ex\n\u201c\n\u0159 de\nx\n\u0159 Ex\npA{Eq \u201c d\nde \u201c\n\u0159 dx\n\u0159 dex\n\u201c q\nqe","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List uses of A/E analysis.","a":"\u2022 Compare actual mortality or lapse experience to expected amounts\n\u2022 Develop best estimate assumptions as multiple of expected amounts\nBest Estimate Rate for Age x \u201c pA{Eq \u02c6 qe\nx\n\u2022 Can be used for valuation, risk management, financial planning, etc.","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Formulas for frequency and severity?","a":"fx \u201c nx\nEx\n\u201c average claim frequency\nsx \u201c Cx\nnx\n\u201c average claim amount\n\u2022 nx = number of claims incurred at age x\n\u2022 Cx = total claim amount incurred at age x\n\u2022 Ex = central exposure (or initial)","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Loss ratio formula?","a":"Loss ratio = cost of claims as % of premiums paid (Px)\nLRx \u201c Cx\nPx","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Assume: Mx = max w/d allowed \u2014 Wx = total actual w/d amount \u2014 nx = # of contracts\nwho took w/d\nDefine formulas for:\n\u2022 Count-based exposure (excludes deaths and lapses)\n\u2022 Withdrawal frequency\n\u2022 Average size (severity) of w/d taken\n\u2022 Average w/d taken as % of max w/d","a":"Ex \u201c \u2113x \u00b4 dx \u00b4 wx \u201c count-based exposure (excludes deaths and lapses)\nfx \u201c nx\nEx\n\u201c withdrawal frequency\nsx \u201c Wx\nnx\n\u201c average size (severity) of withdrawals taken\nux \u201c sx\nMx\n\u201c average withdrawal taken as % of the max withdrawal\nNote: little w is still a lapse rate here; big W is what we\u2019re studying!","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List distortions caused by amount-weighted calculations.","a":"1. One or few large amounts can distort numerator\n  \u25e6 Not easy to fix after the fact (cap max amount allowed in study)\n2. Risks or behaviors can differ significantly by amount\n  \u25e6 Small policies may have less commitment\n  \u25e6 Large policies may be used to defraud\n  \u25e6 Solution: add size band to cells","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List advantages of multi-year studies.","a":"\u2022 Higher credibility\n\u2022 Less distortion caused by reporting lags\n\u2022 Can populate many more cells\n\u2022 Allows study of trends if study-year or CY variable is included","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List 4 examples of reporting lags.","a":"\u2022 Death claims often not reported for months after death\n\u2022 LTCI claims not reported until after elimination period\n\u2022 \u201cShoe boxing\u201d \u2013 lag between direct insurers and reinsurers\n\u2022 Life annuities sometimes continue paying after death","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List 2 solutions for reporting lags.","a":"\u2022 Wait a few months after study period before gathering data\n\u2022 Develop IBNR claims estimates from previous studies","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List 3 examples of non-uniform events.","a":"\u2022 Lapses often vary by month (e.g. PLT period)\n\u2022 Prorated mortality rates tend to underestimate deaths early in the year at old ages\n\u2022 LTCI claims immediately following claim","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List 3 ways to compensate for non-uniform distributions.","a":"1. Use shorter interval of time\n2. Apply adjustment factors\n3. Use constant force mortality assumption for old ages","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List considerations for inclusion of partial policy years in decrement studies.","a":"\u2022 OK when event is evenly distributed over the year\n  \u25e6 Common for biologically-driven rates (mortality, morbidity, etc.)\n  \u25e6 Allocating PYs between CYs is also common\n\u2022 Otherwise, partial policy years will distort results\n  \u25e6 Behavioral rates usually not evenly distributed\n  \u25e6 Lapse, withdrawal, option election, etc.\n  \u25e6 Do not allocate PYs between CYs","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"What is the annual exposure method?","a":"Annual exposure method \u2013 consistent with Balducci Hypothesis\n\u2022 Exposes decrements to end of next anniversary (even if beyond study period)\n\u2022 Disadvantage: overstates rates in first partial year; understates rates in final\npartial\n\u2022 Why exposure is extended beyond study period:\n  \u25e6 Rate is based on probability\n  \u25e6 Captures exposure missed by initial partial year\n  \u25e6 Also true of distributed exposure method","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"What is the distributed exposure method?","a":"Distributed exposure method \u2013 assumes decrement is uniformly distributed\n\u2022 Allocates exposure and decrements by both PY and CY\n\u2022 More accurate when underlying rates are increasing; otherwise less accurate\n\u2022 Produces same total PY exposure as annual method, but CY allocation differs","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Algorithm for calculating distributed exposure?","a":"1. Calculate annual exposure in usual way\n2. First-half exposure = PY t exposure in CY:\n  \u25e6 Expose deaths and surviving policies from policy anniversary to end of CY\n  \u25e6 Expose other decrements (lapse, etc.) from policy anniversary to decrement date\n3. Second-half exposure = Total Annual Exposure \u00b4 First-Half Exposure\n  \u25e6 This will be allocated to next CY\nIn plain English: switch the partial year formulas in the annual exposure method\n\u2022 Move final partial year deaths to next study period\u2019s first partial year","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List product-related considerations that may affect experience study calculations.","a":"\u2022 Deaths in premium grace period (30\u201360 days)\n  \u25e6 Actual DB paid is net of overdue premiums, but use full DB in mortality study\n  \u25e6 Expose lapses to beginning of grace period\n\u2022 Compromised and denied claims \u2013 don\u2019t count as death claims in mortality\nstudy\n\u2022 Study variables changing over time (admin system changes)\n  \u25e6 Admin systems may change plan codes or billing frequencies (distorts exposure)\n\u2022 Reinsured amounts \u2013 can study amounts net of reinsurance if material enough\n\u2022 Substandard and uninsurable lives \u2013 typically excluded","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List at least 4 claim characteristics shared by LTCI and DI products.","a":"1. Involve multiple payments that can last for months or years\n2. Usually paid monthly\n3. Subject to elimination period before claim payments start (up to 1 year)\n4. Usually limited in some way (e.g. max age for DI, max total benefits, etc.)\n5. Paid when insured meets certain conditions\n6. Claims stop when insured recovers but can start again","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List types of morbidity studies for LTCI and DI:\n\u2022 Claim incidence studies\n\u2022 Claim severity studies\n\u2022 Claim termination studies\n\u2022 Benefit utilization rate studies","a":"1. Claim incidence studies\n  \u25e6 Claim incidence rates = annual probabilities\n  \u25e6 Usually done on \u201call claims\u201d\n  \u25e6 Usually based on annual exposure method\n2. Claim severity studies\nAverage length of claim \u201c Total Months of Claims\nNumber of Claims\nAverage cost per claim \u201c Total Claims Paid\nNumber of Claims\n3. Claim termination studies \u2013 perform separate studies for recovery and death\n  \u25e6 DI claims terminate when proof of disability not submitted\n  \u25e6 LTC claims terminate when requests for reimbursement stops\n  \u25e6 Termination rates are highest and most volatile for new claims\n4. Benefit utilization rate studies (LTCI only)\nBenefit Utilization Rate \u201c Actual Benefits\nMax Benefits","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List 4 DI-specific considerations for experience studies.","a":"\u2022 Elimination periods \u2013 claims usually reported after elimination period\n\u2022 Partial disability benefits \u2013 reduces average cost per claim\n\u2022 Recovery followed by relapse within 6 months\n\u2022 Claim settlements \u2013 lump sum paid in lieu of future monthly payments","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List 5 LTCI-specific considerations for experience studies.","a":"1. Elimination period \u2013 typically 30, 60, 90, 180 and 365 days and can also vary by\nLTC claim type\n2. Some LTCI benefits indexed to inflation\n3. Mortality rates do not follow any established table\n4. Claim data must capture diagnosis (very important since it drives claim length)\n5. Claim data not always organized ideally and requires work","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Experience study considerations for deferred annuities?","a":"\u2022 Deferred annuity utilization rates\n  \u25e6 GMxBs: compare benefit paid to amount payable in absence of GMxB\n\u2022 Contract year data challenges\n  \u25e6 Data usually monthly\n  \u25e6 Common approach: convert account balances to contract year basis using 13-month\naverage","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"Experience study considerations for payout annuities?","a":"\u2022 Immediate annuities\n  \u25e6 Self-selection \u2013 people buy IAs when they think they\u2019re healthier than average\n  \u25e6 Choice of IA may indicate health\n  \u25e6 Larger IAs tend to have lower mortality\n  \u25e6 Amount exposure should be based on monthly payment, not reserves\n  \u25e6 Mortality improvement is key consideration\n\u2022 Structured settlements \u2013 arise from injury lawsuits\n  \u25e6 Usually involves one or more lump sums (not lifetime payouts)\n  \u25e6 Mortality is higher than IAs\n  \u25e6 Amount exposure should be based on reserves or premium paid","source":"Experience Study Calculations","reading":"Experience Study Calculations","chapter":null,"section":"B"},{"q":"List the 6 major steps in table development.","a":"1. Develop data\n2. Identify table dimensions through exploration techniques\n3. Populate table through graduation/interpolation or modeling\n4. Extend and project rates as needed\n5. Review and adjust rates after assessing financial impact\n6. Finalize table","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the 4 preliminary activities of data development and analysis.","a":"1. Review previous studies (if they exist)\n2. Clarify purpose of table and goals\n3. Ensure confidentiality of each contributor\u2019s data\n4. Review available data (homogeneity, credibility, etc.)","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"What is the data call process?","a":"A data call is a formal request for data from contributors\n\u2022 Simpler data calls are more successful\n\u2022 Document what is needed for each data item (\u201ccolumns\u201d)\n\u2022 Define data structure (e.g. relational database)\n\u2022 Create detail records (\u201crows\u201d) combinations of life, age, etc.\n\u2022 Document all table relationships within relational databases","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List 6 common data challenges.","a":"1. Incomplete data\n2. Terminology may vary by contributor\n3. Data may not arrive on time\n4. Wrong or improperly formated data\n5. Time lags in reporting of events like death\n6. Lack of resources to transform data into requested layout","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the 6 components in an experience study calculation.","a":"1. Study anniversary date \u2013 birthday, policy anniversary, etc.\n2. Age basis (ALB, ANB, etc.)\n3. Experience study summary records\n4. Count-based and amount-based rates (qx\u2019s, etc.)\n5. Expected results (A/E ratios, etc.)\n6. Summary results for each detail record (event counts and amounts)","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List 3 ways to address distortion from having a mix of age bases in experience data.","a":"1. Assume all ages based on most common method\n2. Recalculate on common basis for each record\n3. Use weighted-average age","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the 8 steps in the data analysis process.","a":"1. Acquire data\n2. Data validation, preliminary exploration, and outlier analysis\n3. Data visualization and preparation\n4. Determine analytical approach: exploratory vs. advanced analytics\n5. Model creation and assessment for advanced analytics\n  \u25e6 Select model(s) with explanatory ability, predictive power, and implementation ease\n6. Select final model(s)\n7. Minimize table dimensions\n8. Replace grids with factors if possible","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the 3 steps in the modeling process.","a":"The modeling process:\n1. Model fitting: select variables with lowest p-value\n2. Avoid confounding\n3. Create transformed variables, functions, interaction terms, or stratification","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"What is the purpose of graduation?","a":"Graduation is a mathematical process that smooths an array of rates\n\u2022 Assumes that the \u201ctrue\u201d rates follow a continuous curve\n\u2022 Required when rates do not come from models\n\u2022 Can also be used on modeled rates\n\u2022 Goal: balance fit and smoothness","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the properties of a preferred graduation method.","a":"1. Produces same total events as ungraduated rates\n2. Parameters control amount of smoothness applied\n  \u25e6 Input fit, table fit, smoothness","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"Credibility and data grouping considerations when graduating rates?","a":"Non-credible (\u201cincredible\u201d) rates distort graduated rates\n\u2022 Smoothness calculation weights credible and non-credible rates equally\n  \u25e6 Biggest problem: very young and very old ages\n\u2022 \u2191credibility usually comes at cost of graduation\n  \u25e6 Grouping rates by age (e.g. quinquennial)\n  \u25e6 Grouping data by calendar or policy years\n\u2022 Possible solution: use exposure-weighted averages for graduation","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the 4 steps of the graduation process.","a":"1. Collect and populate graduation input\n2. Review and adjust input as needed\n3. Run graduation process for 3 parameters: input fit, table fit, smoothness\n  \u25e6 Set parameter value and run graduation algorithm\n  \u25e6 Review/graph/evaluate results\n  \u25e6 Repeat until satisfied with parameter\n4. Run final graduation using best fit and smoothness parameters","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"Formula for total variance for all lives (assuming individual data available)?","a":"Total variance for all lives:\nVariancer \u201c qrp1 \u00b4 qrq\n\u00ff\nAmount2\nx \u02c6 ExposedCountx","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"Ways to approximate total variance for all lives?","a":"Approximations for variance (from least refined to most):\n1. Use overall average size:\nVariancer \u00ab AvgSize2\nOA \u02c6 qrp1 \u00b4 qrq\n\u00ff\nExposedCountx\n2. Use average size for lives contributing to qr:\nVariancer \u00ab AvgSize2\nr \u02c6 qrp1 \u00b4 qrq\n\u00ff\nExposedCountx\n3. Allocate average size between the 2 most common sizes in size groups\n  \u25e6 Can also be used to develop factors to apply to method 1 or 2","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List common interpolation methods for table development.","a":"\u2022 1-dimensional methods\n  \u25e6 Linear (simplest method)\n  \u25e6 Cubic spline\n  \u25e6 Log-Linear or Log-Cubic \u2013 useful for mortality rates (\u2191at constant rate)\n\u2022 2-dimensional methods\n  \u25e6 Bilinear\n  \u25e6 Bicubic (smoothest)","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List 3 methods for extending rates in a table.","a":"Often necessary for very young or old ages where credibility is low\n1. Using rates from existing credible table\n  \u25e6 Use slope as guide\n  \u25e6 Grade from study\u2019s rates to existing table rates\n2. Other data sources\n  \u25e6 SSA for old ages\n3. Formulas\n  \u25e6 Should reproduce rates for nearby credible ages","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List 5 reasons why initial rates developed for a table may be deficient.","a":"1. Nonsensical rates (e.g. mortality rate \u00bf 1)\n2. Data had poor credibility\n3. Nonsensical patterns of rates\n4. Suspicious differences in arrays of rates\n5. Very wide confidence intervals","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the 5 components of enforcement reviews.","a":"1. Define relationships to be enforced (agree on when project starts)\n2. Define when relationships will be checked\n3. Create spreadsheets to check relationships (automation)\n4. Check S&U mortality rates\n5. Adjust rates to enforce relationships","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List 4 considerations for projecting future rates.","a":"\u2022 Use historical data based on consistent population over time\n\u2022 Mortality trends are difficult to estimate\n\u2022 Connect cause and effect\n\u2022 3 types of projections\n1. Projecting from mid-point of experience data to final table effective date\n2. Projecting beyond effective date at single rate of improvement\n3. Projecting beyond effective date at varying rate of improvement","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"Items to consider when assessing financial impact of a table?","a":"\u2022 Reserves and nonforfeiture values\n  \u25e6 Prescribed industry tables affect prescribed stat reserves and nonforfeiture values\n  \u25e6 PBR can be impacted by internally developed tables\n  \u25e6 Impact can vary significantly from company to company\n\u2022 Premiums and policyholder dividends\n  \u25e6 Could be impacted by new industry or internally-developed tables","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List 5 ways to create additional tables from final table rates.","a":"Additional tables can be created for other combinations:\n1. With or without projected trend factors\n2. With or without valuation loading factors\n3. Multiple age definitions (ANB, ALB, etc.)\n4. Unisex\n5. Relative risk versions for UW purposes","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"List the 4 major steps in the valuation loading process for the commissions\u2019 valuation\ntable (CVT).","a":"1. Develop experience table based solely on experience data\n2. Develop the valuation basic table (VBT)\n3. Apply loading factors to experience table \u2192loaded experience table\n4. Create the Commissioners\u2019 Valuation Table (will be used for stat reserves)","source":"Table Development","reading":"Table Development","chapter":null,"section":"B"},{"q":"Define credibility and its relationship to data volume.","a":"Credibility in actuarial context = statistical credibility\n\u2022 Arose more than a century ago in P&C industry\n\u2022 Low credibility does not mean \u201cnot believable\u201d\n  \u25e6 It means \u201cshould have less weight\u201d\n\u2022 Credibility \u2191as data volume \u2191(\u03c3 \u2193)\n\u2022 Full credibility occurs when addition of more data would be immaterial\n  \u25e6 Any remaining error is inconsequential","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"List the 3 major families of credibility methods.","a":"1. Limited Fluctuation Method (aka Classical Credibility)\n  \u25e6 Intended to limit effect of random experience fluctuations on estimate\n  \u25e6 Simple and widely used, but has theoretical shortcomings\n2. Greatest Accuracy Method (aka B\u00a8uhlmann Credibility)\n  \u25e6 Appeared in the 1960s\n  \u25e6 Intended to make estimation errors as small as possible\n  \u25e6 More complex and less popular, but more theoretically grounded\n3. Bayesian Method\n  \u25e6 Combines prior distribution with likelihood function based on observed data\n  \u25e6 Also the foundation of GAM\n  \u25e6 Has not been used much, but usage may \u2191in the future","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"General formula for determining credibility-weighted rate?","a":"Credibility-Weighted Rate \u201c\n#\nZ \u02c6 Observed Rate ` p1 \u00b4 Zq \u02c6 Prior Rate\n(LFM)\nZ \u02c6 Observed Rate ` p1 \u00b4 Zq \u02c6 Portfolio Rate\n(GAM)\nObserved Rate = best estimate or result from recent experience study\nZ = weight assigned to Observed Rate\n\u2022 Ranges from 100% (fully credible) to 0% (no credibility)\n1 \u00b4 Z = remaining weight assigned to:\n\u2022 Prior Rate (LFM) \u2013 prior rate based on much larger experience study\n  \u25e6 Assumed to be fully credible\n  \u25e6 Often based on large industry table (e.g. 2001 VBT)\n\u2022 Portfolio Rate (GAM) \u2013 overall rate for a set of related risk groups","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"Prior rate used for Limited Fluctuation Credibility?","a":"Prior rate = most appropriate estimate absent any experience data\n\u2022 Should be consistent with the business in scope\n\u2022 Potential problems:\n  \u25e6 May be based on different target market, UW, and/or distribution system\n  \u25e6 Requires adjustments or else will introduce error\n  \u25e6 May not be fully credible","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"Credibility weight formula under Limited Fluctuation Credibility?","a":"Z \u201c min\n\u00ab\n1,\nd\nNAC\nNFC\nff\n\u2022 NAC = number of actual observations (claims, policies, etc.)\n\u2022 NFC = number of observations required for full credibility\n\u2022 PFC = probability threshold for full credibility\n\u2022 RFC = error tolerance for full credibility\nMost common assumption: PFC \u201c 90%, RFC \u201c 5%\n\u2022 We want our rate to be within \u02d85% of true rate at least 90% of the time\n\u2022 NFC \u201c 1082 for normally distributed claims (P&C, health)\n\u2022 NFC \u201c 1082p \u201c 1082p1 \u00b4 q) for binomially distributed claims (mortality, lapse)","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"Relationship between observed rate and full credibility?","a":"\u2022 As q \u2191, NFC \u2193\n\u2022 Credibility is based on relative error: as q \u2191, error threshold \u2191\n\u2022 Small decrement studies require more exposed lives (n)","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"Asymptotic formula for credibility?","a":"Developed by Albert W. Whitney (1918):\nZ \u201c\nN\nN ` K\nwhere N = exposure (e.g. claim count) and K = \u201ca constant\u201d\n\u2022 Z \u201c 0 for no experience data and Z \u00d1 1 as N \u00d1 8\n\u2022 K can be determined by actuarial judgment or based on experience\n\u2022 Higher values of K result in:\n  \u25e6 Lower credibility weights\n  \u25e6 Slower convergence as N \u00d1 8","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"How to calculate credibility weights based on confidence intervals?","a":"Z = probability that observed rate is within \u201ctight confidence interval\u201d\nZ \u201c Pr\n\u201c\n\u00b5Tp1 \u00b4 rq \u010f \u00b5 \u010f \u00b5Tp1 ` rq\n\u2030\n\u2022 \u00b5T, \u03c3T = true (unknown) values of mean and standard deviation\n\u2022 \u00b5, \u03c3 = observed values\n\u2022 r = ratio that specifies the tight C.I. (analogous to RFC)\nAssuming standard normal distribution and \u00b5{\u03c3 \u00ab \u00b5T{\u03c3T:\nZ \u201c Pr\n\u00ab\n\u00b4r \u00b5\n\u03c3 \u010f\n`\n\u00b5 \u00b4 \u00b5T\u02d8\n\u03c3T\n\u010f r \u00b5\n\u03c3\nff\nCredibility increases when \u00b5{\u03c3 \u2191and/or r \u2191(wider C.I.)\nNormal distribution appropriate for large N; binomial is best for mortality/lapse","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"How to calculate number of deaths required for full credibility in mortality study?","a":"1. Calculate observed mortality rates by band and in aggregate\nqcnt \u201c Count of Deaths\nCount Exposed\nqamt \u201c Amount of Deaths\nAmount Exposed\n2. Calculate variance (\u03c32) and standard deviation (\u03c3)\n\u03c32\ncnt \u201c pCount Exposedqpqcntqp1 \u00b4 qcntq\n\u03c32\namt \u201c pCount ExposedqpPolicy Sizeq2pqamtqp1 \u00b4 qamtq\n3. Calculate standard deviation as % of deaths observed\nStd Dev as % of Deaths \u201c\n\u03c3\nCount of Deaths\nFull Cred Std Dev as % of Deaths \u201c\n0.05\n1.64485 \u201c 3.04%\n4. Calculate deaths required for full credibility (count and amount)\nStudy to Full Cred Ratio \u201c\nStd Dev as % of Deaths\nFull Cred Std Dev as % of Deaths\nFull Cred Deaths \u201c pStudy to Full Cred Ratioq2 \u02c6 Observed Deaths\n\u201c 1082p for count-based","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"How does credibility differ on count vs. amount basis?","a":"\u2022 Effect of policy count distribution by face amount size:\n  \u25e6 Smaller policies usually outnumber larger policies\n  \u25e6 Therefore count-based exposure is higher at lower face amounts\n  \u25e6 Count-based \u03c32 \u2193as policy size \u2191(opposite for amount-based)\n  \u25e6 Count-based variance is directly proportional to sample size: npq\n  \u25e6 Amount-based variance = npq \u02c6 Size2\n  \u25e6 Takeaway: count-based Z may overstate credibility on larger policies\n\u2022 Amount-based credibility weights tend to be lower than count-based\n  \u25e6 Main reason: credibility \u2193as variance \u2191\n  \u25e6 Amount-based variance is usually higher than count-based","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"Goal and assumptions underlying Greatest Accuracy Credibility?","a":"Goal: minimize expected value of square of differences between:\n1. B\u00a8uhlmann-weighted estimate\n2. Bayesian predictive mean\nGAM makes 2 assumptions:\n1. Each risk group in portfolio follows its own unknown distribution\n2. The distributions of the groups follow an unknown distribution","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"Greatest Accuracy credibility weight formula?","a":"Z \u201c\nN\nN ` K \u201c\nN\nN ` v{a\nN \u201c claim count exposure\nPortfolio = collection of related risk groups\n\u2022 Groups of similar risks from different geographical areas or occupations\n\u2022 Collection of insurance companies\nv = expected value of process variance = E[Var[X]]\n\u2022 As v \u2193, credibility \u2191\n\u2022 v \u2193when risk group has large exposure or claim counts\na = variance of hypothetical means = Var[E[X]]\n\u2022 As a \u2191, credibility \u2191\n\u2022 a \u2191when there is more variation in means\n\u2022 Extreme case: if a \u201c 0, Z \u201c 0 (nothing unique about each group)","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"List strengths and weaknesses of Limited Fluctuation Credibility.","a":"Strengths of LFM:\n\u2022 Simple and easy: only requires number of claims\n\u2022 Useful for experience rating when prior rate is appropriate\n\u2022 Only requires data for risks being assessed and prior rate\n\u2022 Could be improved by using \u03c3 as % of claims to calculate Z under C.I. method\nWeaknesses of LFM:\n\u2022 Formulas and inputs are arbitrary\n\u2022 Prior rate gets same weight, 1 \u00b4 Z, regardless of its accuracy\n\u2022 May significantly overstate count-based Z\u2019s if rates are based on amount\n\u2022 Results distorted if there is no prior rate (e.g. new product)\n\u2022 Variance may be worse measure of \u201cquality\u201d than MSE used by GAM\n\u2022 Z reaches 1.0 prematurely compared with asymptotic formula","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"List strengths and weaknesses of Greatest Accuracy Credibility.","a":"Strengths of GAM\n\u2022 Spells out all aspects and clearly states all assumptions\n\u2022 Produces exact answer by applying basic probability principles\n\u2022 Has clear objective function: minimize mean-square error\n\u2022 No arbitrary choices unrelated to observed random variables\nWeaknesses of GAM\n\u2022 Requires portfolio of data from comparable risk groups\n\u2022 Portfolio rate will be distorted if risk groups not sufficiently similar\n  \u25e6 Analogous to prior rate not being appropriate under LFM\n\u2022 May be inaccurate when random variable has heavy tail\n\u2022 Empirical Bayesian estimates of \u03c32 can be negative, \u201cwhich is nonsensical\u201d","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"Compare Greatest Accuracy Credibility with Bayesian Credibility.","a":"Bayesian credibility was starting point for B\u00a8uhlmann credibility (GAM)\n\u2022 GAM credibility-weighted rate falls between observed rate and portfolio rate\n\u2022 Bayesian: not necessarily\nGAM has the following advantages over Bayesian:\n\u2022 Requires less mathematical skill\n\u2022 Computationally easier\n\u2022 Does not require prior distribution\n  \u25e6 GAM uses experience data instead","source":"Credibility Methods Applied","reading":"Credibility Methods Applied","chapter":null,"section":"B"},{"q":"List at least 4 characteristics of lapse-supported insurance.","a":"1. PV profits assuming zero lapses \u00a1 PV profits with planned assumption\n  \u25e6 ASOP 24: can\u2019t show illustrations if policy fails self support test\n2. Common features: guaranteed level premiums, low/zero CSV, high late benefits\n3. Premiums too low \u2192insufficient reserves\n  \u25e6 Warning sign: higher-than-expected early profits\n4. Risk is in ultimate lapses, not early lapses\n  \u25e6 Lower-than-expected early lapses \u2191profit\n  \u25e6 Lower-than-expected ultimate lapses \u2191benefit costs\n5. High income market is highest risk\n  \u25e6 Competitive/marketing pressures keep premiums low\n  \u25e6 Policyholders least likely to lapse\n  \u25e6 Agent persistency data may be illusion due to past replacement activity","source":"ILA101-107: Lapse Supported Insurance","reading":"ILA101-107: Lapse Supported Insurance","chapter":null,"section":"B"},{"q":"How return-of-premium riders affect lapse risk?","a":"\u2022 ROP riders create tontine \u2013 everyone pays in, but only \u201csurvivors\u201d collect ROP\n  \u25e6 Bad investment for policyholder on lapse-adjusted basis\n\u2022 ROP cash value not enough to lower risk of low lapses\n\u2022 ROP can convert limited-pay products to lapse-supported\n\u2022 Benefits of ROP:\n  \u25e6 Less risky if lapses driven by independent events (e.g. employee turnover)\n  \u25e6 Help blocks/companies with poor persistency\n  \u25e6 \u2191profitability in low income markets","source":"ILA101-107: Lapse Supported Insurance","reading":"ILA101-107: Lapse Supported Insurance","chapter":null,"section":"B"},{"q":"List key findings from SOA study on flexible premium UL premium persistency.","a":"\u2022 Many companies simply assume 100% premium persistency\n  \u25e6 Aggregate premium falls with duration due to limited pay business\n  \u25e6 Companies often vary persistency by duration\n\u2022 Pricing assumptions vs. CFT and GAAP/IFRS\n  \u25e6 Pricing assumes more patterns in general\n  \u25e6 Some companies use weighted average persistency assumption\n  \u25e6 Companies adjust ULSG pricing persistency to prevent lapses\n\u2022 Areas for improvement (few companies currently doing):\n  \u25e6 Dynamic premium persistency assumptions\n  \u25e6 Sensitivity testing","source":"Premium Persistency \u2013 Flexible Premium UL","reading":"Premium Persistency \u2013 Flexible Premium UL","chapter":null,"section":"B"},{"q":"List types of post-level premium structures in North America.","a":"Post-level premium structures in the US:\n1. Jump to ART \u2013 premium jumps from level to much higher ART premiums\n2. Grade to ART \u2013 premium gradually \u2191from level to ART\n3. Jump to new level period\n4. Jump to other \u2013 combination of 2 and 3\nIn Canada, most products are \u201cjump to new level\u201d","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"Selective Lapsation Provisions from CIA Education Note \u201cExpected Mortality\u201d","a":"\u2022 Selective lapses \u2013 have same mortality as newly selected lives (qrx`ts)\n\u2022 Lapse rates \u2191temporarily when premium rates \u2191at renewal date\n\u2022 Healthy lives more likely to lapse at renewal than unhealthy lives\n\u2022 Factors that drive level of selective lapsation:\n  \u25e6 Size of premium rate increase\n  \u25e6 Period between premium increases\n  \u25e6 Duration\n  \u25e6 Policy size\n  \u25e6 Distribution systems\n\u2022 Selective lapses may occur at times other than at renewal\n\u2022 PL mortality experience may not reflect selective lapses (adjust as needed)","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"SOA Survey on Post-Level Assumptions","a":"\u2022 Most insurers assumed \u00a1100% lapse rate at end of level period\n\u2022 Assumed shock lapse \u2191as level period \u2191\n  \u25e6 100% more common for 20-30-yr term than 10- and 15-yr\n  \u25e6 Median shock lapse: \u201e80% for 10-yr to \u201e95% for 30-yr\n\u2022 Median PL mortality = 230%\u2013300% of level period\n\u2022 Mortality deterioration assumptions generally grade down over 3 years\n\u2022 Assumed lapses and mortality deterioration had strong correlation\n\u2022 Median premium jump = 3x\u201325x\n  \u25e6 Varied by issue age, gender, term period, and risk class","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"SOA Report on Post-Level Experience: Lapse","a":"Lapse dates set equal to beginning of grace period if they occurred during grace period\n\u2022 Grace period = time after missed insurance premium is due\nKey lapse findings:\n\u2022 Shock lapses \u2191with premium jump ratio (PJR)\n\u2022 Lapse trends by PJR are similar across companies:\n  \u25e6 \u2191very quickly at lowest PJRs\n  \u25e6 \u2191at decreasing rate with PJR\n  \u25e6 Level off at highest PJRs\n\u2022 Within each PJR band, lapses \u2191with issue age and face amount\n\u2022 Lapses heavily skewed to end of final level year and beginning of first PL year","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"SOA Report on Post-Level Experience: Mortality","a":"\u2022 Mortality rates \u2191significantly with PJR\n\u2022 Higher lapses \u2191effect of excess mortality in grace period\n  \u25e6 Provides \u201cfree\u201d life insurance to policies that have lapsed\n\u2022 Mortality \u2191at increasing rate as lapse rates \u2191","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"Describe the subpopulations within a cohort of lives at beginning of the post-level\nperiod.","a":"T \u201c U ` A ` S ` P \u201c 100% = total cohort\n\u2022 S = excess lapsers who have select mortality (healthy lives)\n  \u25e6 Often unknown (requires estimation and sensitivity testing)\n  \u25e6 S \u201c Selective% \u02c6 pTotal Lapse Rate \u00b4 Base Lapse Rateq\n\u2022 A = excess lapsers with average mortality\n  \u25e6 Extra lapses that occur for reasons other than health\n  \u25e6 A \u201c p1 \u00b4 Selective%q \u02c6 pTotal Lapse Rate \u00b4 Base Lapse Rateq\n\u2022 U = lapsers with same mortality as underlying (base) mortality\n  \u25e6 Normal, base lapses (not lapsing for health reasons)\n\u2022 P = persisting cohort (policyholders that don\u2019t lapse)\n  \u25e6 Generally unhealthy lives willing to pay high premiums to keep policy inforce\n  \u25e6 We can solve for P \u201c 1 \u00b4 S \u00b4 A \u00b4 U\n  \u25e6 Since only P remains inforce, total lapse rate = S ` A ` U","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"Describe 3 primary methods for estimating post-level mortality.","a":"1. Dukes-MacDonald\n  \u25e6 Originally assumed all excess lapses are select\n  \u25e6 Later variations (DM1, DM2) assume some excess lapses are non-select\n2. Becker-Kitsos\n  \u25e6 Refines DM by adding effectiveness factor\n  \u25e6 Assumes additional lapses are fully select plus extra amount of mortality\n  \u25e6 Extra mortality grades off over select period\n3. VTP2: published by CIA in 1986 Valuation Technique Paper\n  \u25e6 Similar to DM1, but with following differences:\n  \u25e6 A and S lapse rates apply just prior to anniversary\n  \u25e6 Underlying (U) lapse and mortality rate apply continuously\n  \u25e6 DM1 assumes U lapses occur immediately prior to S lapses","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"Formula for persister mortality under Becker-Kitsos, Dukes-MacDonald (DM1 and\nDM2), and VTP2?","a":"q 1\nrxs`t \u201c\n$\n\u2019\n\u2019\n\u2019\n\u2019\n\u2019\n&\n\u2019\n\u2019\n\u2019\n\u2019\n\u2019\n%\nS \u02c6\n\u00b4\nqrx`ts ` qextra\nrx`ts\n\u00af\n` U \u02c6 q 1\nrxs`t ` p1 \u00b4 S \u00b4 Uq \u02c6 q 2\nrxs`t\nfor BK\nS \u02c6 qrx`ts ` A \u02c6 qrxs`t ` U \u02c6 q 1\nrxs`t ` p1 \u00b4 S \u00b4 A \u00b4 Uq \u02c6 q 2\nrxs`t\nfor DM1\nS \u02c6 qrx`ts ` U \u02c6 q 1\nrxs`t ` p1 \u00b4 S \u00b4 Uq \u02c6 q 2\nrxs`t\nfor DM2\nS \u02c6 qrx`ts ` A \u02c6 qrxs`t ` p1 \u00b4 S \u00b4 Aq \u02c6 q 2\nrxs`t\nfor VTP2\nUnder BK:\n\u2022 qextra\nrx`ts \u201c R \u02c6 Gptq \u02c6\n`\nqrxs`t \u00b4 qrx`ts\n\u02d8\n\u2022 Recommend assuming G \u201c 1","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"Describe common problems/issues for all persister mortality methods.","a":"\u2022 Skewness: all methods assume excess lapses occur EOY\n  \u25e6 Reality: \u201e90% of lapses occur BOY right after renewal\n  \u25e6 Underestimates mortality deterioration\n\u2022 Shape of underlying mortality table\n  \u25e6 If industry table multiples too low, excess mortality \u00a1 0\n  \u25e6 Excess mortality = q 2 \u00b4 q 1\n  \u25e6 Ideally, excess mortality should grade to zero over time\n\u2022 Accounting for grace period deaths\n  \u25e6 More important when lapse rates are high\n  \u25e6 DM1 mortality for persisters who die in grace period:\n\u201d\nS \u02c6 qrx`ts ` pA ` Uq \u02c6 q 1\nrxs`t\n\u0131\n\u02c6 Grace Period\n365 \u02c6 p1 \u00b4 Tq\n  \u25e6 T \u201c S ` A ` U = total lapse rate occurring at renewal date\n  \u25e6 Add this extra mortality to PL persister mortality\n  \u25e6 Under VTP2, formula is same with U \u201c 0%","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"How appropriate are the main persister mortality methods for US and Canadian\nexperience?","a":"Key conclusions were similar based on US and Canadian experience:\n\u2022 VTP2 doesn\u2019t replicate actual post-renewal mortality unless you use very high S\n\u2022 DM1 comes closer to matching actual mortality experience\n\u2022 Caveats:\n  \u25e6 Credibility is low, so use caution with results\n  \u25e6 No Canadian data reflects both mortality and lapse","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"How can VTP2 be revised to be more accurate?","a":"Original VTP2 calculated selective and average lapse rates incorrectly\nS \u201c pwtotal \u00b4 Uq \u02c6 Selective%\nA \u201c pwtotal \u00b4 Uq \u02c6 p1 \u00b4 Selective%q\nThe correct calculation reflects that excess lapse rates occur after underlying lapses:\nS \u201c pwtotal \u00b4 Uq \u02c6 Selective%\n1 \u00b4 U\nA \u201c pwtotal \u00b4 Uq \u02c6 p1 \u00b4 Selective%q\n1 \u00b4 U\n\u201cVTP2-revised\u201d results in higher select and average lapse rates\n\u2022 And therefore higher persister mortality since q 2 \u2191as P \u2193\n\u2022 q 2 was as much as 22% higher after correcting lapse rates","source":"Selective Lapsation for Renewable Term","reading":"Selective Lapsation for Renewable Term","chapter":null,"section":"B"},{"q":"List 3 philosophies for covering cost of conversions.","a":"1. Reflect conversion cost in term pricing (most common)\n  \u25e6 This is what the author advocates\n  \u25e6 Allows reserves to build for conversions\n  \u25e6 Aligns revenue with source of risk (term \u201cswaption\u201d)\n2. Develop separate permanent premiums for conversions\n  \u25e6 Avoids cross-subsidization but is administratively challenging\n  \u25e6 Alternatively, could reinsure conversions using YRT PISM rates\n3. Reflect extra conversion mortality in permanent policy pricing\n  \u25e6 Might be appealing if insurer has mature experience\n  \u25e6 Can make permanent mortality artificially high","source":"Term Conversions: Pricing and Reserves","reading":"Term Conversions: Pricing and Reserves","chapter":null,"section":"B"},{"q":"Two stage model for pricing term conversions?","a":"1. At issue, determine expected extra mortality cost for term conversions\n  \u25e6 For each year when conversion is possible calculate:\nExtra NSP for Conversions \u201c Kx,r \u201c PVFBConverted \u00b4 PVFBStandard WL\n\u201c reserve for conversions at duration r\n2. Calculate charge for term policyholders\nAx,r \u201c rpx \u02c6 ex,r \u02c6 Kx,r \u02c6 vr\nTotal PV of Expected Excess Mortality \u201c\n\u00ff\nr\nAx,r\nLevel Conversion Charge \u201c Total PVFB of Excess Mortality\n:ax:n","source":"Term Conversions: Pricing and Reserves","reading":"Term Conversions: Pricing and Reserves","chapter":null,"section":"B"},{"q":"Factors that cause cost of conversions to vary?","a":"Conversion cost \u2191when base mortality \u2191\n\u2022 Higher issue ages\n\u2022 Males (compared to females)\n\u2022 Smokers (compared to non-smokers)\n\u2022 Non-preferred (compared to preferred classes)","source":"Term Conversions: Pricing and Reserves","reading":"Term Conversions: Pricing and Reserves","chapter":null,"section":"B"},{"q":"Relationship between conversion period length and conversion cost?","a":"Restricting conversion period reduces cost of conversion\n\u2022 Disallowing conversions after year 10, reduces cost roughly 30%\n\u2022 Caveat: policyholders will accelerate conversions in response","source":"Term Conversions: Pricing and Reserves","reading":"Term Conversions: Pricing and Reserves","chapter":null,"section":"B"},{"q":"Compare newer statistical approaches with traditional experience studies.","a":"Advantages of statistical approaches over traditional experience studies:\n\u2022 Consider all variables simultaneously (eliminates bias in correlated variables)\n\u2022 Handles data more efficiently\n\u2022 Generates smoother curves without manual adjustments\n\u2022 Provides distribution of outcomes rather than only mean\n\u2022 Cross-term variables can capture interrelationships and improve model fit\nKey disadvantage of statistical models: can become complex\n\u2022 Simpler models easier to interpret and implement in practice\n\u2022 Actuary must balance complexity/accuracy with simplicity","source":"Predictive Models on Conversion Studies","reading":"Predictive Models on Conversion Studies","chapter":null,"section":"B"},{"q":"List key factors that cause conversion rates to vary.","a":"\u2022 Late converters have highest conversion rates\n  \u25e6 Year 10 conversion rate \u00ab 7% compared to \u00a11% in years 1\u20139\n\u2022 Year 10 conversion rates higher for worse risk classes\n  \u25e6 Smokers \u00bf Standard NS \u00bf Preferred NS\n  \u25e6 Interpretation: smokers more likely to be declined if applying for new policy\n\u2022 Impact of issue age varies by duration:\n  \u25e6 Early years: youngest issue ages have slightly higher conversion rates\n  \u25e6 Middle years: no difference by issue age\n  \u25e6 Years 9\u201310: older issue age \u2192higher conversion rates\n\u2022 Large policies have highest year 10 conversion rates\n  \u25e6 A 1M policy\u2019s conversion rate is nearly 2x a \u00a1100K policy","source":"Predictive Models on Conversion Studies","reading":"Predictive Models on Conversion Studies","chapter":null,"section":"B"},{"q":"List key factors that cause mortality to vary for converted policies.","a":"\u2022 PISM ratios highest 1 year after conversion, then fall\n  \u25e6 High mortality immediately after conversion indicates anti-selection\n  \u25e6 Even 10 years later, PC mortality \u0105 100% of level period\n\u2022 Larger policies have higher PC mortality (more anti-selection)\n\u2022 Late converters have highest PISM ratios after conversion\n  \u25e6 Late converter PISM ratios decline after year 1\n  \u25e6 Middle converter PISM ratios slightly higher than early converters\n  \u25e6 Middle and early converter PISM ratios are flat after conversion\n\u2022 Younger issue ages have higher PISM ratios after conversion\n  \u25e6 \u010340 group\u2019s initial PISM ratio \u0105500%\n  \u25e6 Next highest group: 60+ (300%)\n  \u25e6 All PISM ratios decline by year after conversion","source":"Predictive Models on Conversion Studies","reading":"Predictive Models on Conversion Studies","chapter":null,"section":"B"},{"q":"List key factors that cause lapse rates to vary for converted policies.","a":"\u2022 Overall lapse rates highest 1\u20132 years after conversion\n  \u25e6 PC lapse rates roughly 5% and 5.5% 1 and 2 years after conversion\n  \u25e6 Lapse rates fall to about 2.5% by year 4, then level off\n\u2022 Lapse rates by gender fairly similar all years after conversion\n  \u25e6 Female lapses slightly higher initially; reverses later\n  \u25e6 Gender may not be useful model variable\n\u2022 Late converters have lower lapse rates after conversion\n\u2022 Larger policies have lower PC lapse rates","source":"Predictive Models on Conversion Studies","reading":"Predictive Models on Conversion Studies","chapter":null,"section":"B"},{"q":"List most significant drivers of anti-selection on term conversions.","a":"Anti-selection highest for late converters\n\u2022 Highest conversion rates\n\u2022 Highest initial post-conversion mortality ratios\n\u2022 Lowest post-conversion lapse rates\nOther factors that \u2191anti-selection risk:\n\u2022 Younger issue ages\n\u2022 Larger policies\n\u2022 Smokers","source":"Predictive Models on Conversion Studies","reading":"Predictive Models on Conversion Studies","chapter":null,"section":"B"},{"q":"Why is product classification important for statutory accounting?","a":"Product classification determines:\n1. Revenue and costs reporting in income statement\n2. Methodologies and assumptions for policy reserves\n3. Annual statement exhibits, schedules, and supporting info","source":"SVILAC Ch. 1: Valuation Overview and Product Classifications","reading":"SVILAC","chapter":"Ch. 1 \u2013 Valuation Overview and Product Classifications","section":"C"},{"q":"List four classifications under SSAP No. 50.","a":"1. Life contracts \u2013 financial assistance to beneficiary when insured dies\n  \u25e6 Long coverage period; mortality risk \u2191with age\n  \u25e6 Examples: WL, endowments, term, UL, variable life, annuities\n2. Deposit-type contracts \u2013 no insurance risk\n  \u25e6 Financial/investment instruments (like banks)\n  \u25e6 Examples: annuities certain, lottery payouts, dividend accumulations\n3. A&H contracts \u2013 protection vs. economic loss from medical condition\n4. P&C contracts \u2013 protection vs. physical/financial damage to property or injury","source":"SVILAC Ch. 1: Valuation Overview and Product Classifications","reading":"SVILAC","chapter":"Ch. 1 \u2013 Valuation Overview and Product Classifications","section":"C"},{"q":"What does SSAP No. 51 cover?","a":"Income recognition and reserving for life contracts\n\u2022 Recognize premiums as revenue on gross basis\n  \u25e6 Gross premium = amount charged to policyholder\n  \u25e6 Net premium = amount used in stat reserves\n  \u25e6 Loading = Gross \u2013 Net Premium\n\u2022 Stat reserves required for all unmatured contracts\n\u2022 Methods/assumptions: Appendices A-820 (SVL), A-822 (AOMR), C (AGs)\n\u2022 Reserves must comply with ASOPs from ASB","source":"SVILAC Ch. 1: Valuation Overview and Product Classifications","reading":"SVILAC","chapter":"Ch. 1 \u2013 Valuation Overview and Product Classifications","section":"C"},{"q":"Define RBC ratio and list 5 major risk categories.","a":"RBC ratio \u201c Total Adjusted Capital\nLife Insurer\u2019s RBC\n5 major risk categories:\n1. C-0: Asset Risk \u2013 Affiliates \u2013 default risk in affiliated investments\n2. C-1: Asset Risk \u2013 Other \u2013 default risk (debt) \u2014 market losses (equity)\n3. C-2: Insurance Risk \u2013 adverse mortality/morbidity\n4. C-3: Interest Rate, Health & Market Risk\n  \u25e6 Reinvestment rates \u00a1 guaranteed rates\n  \u25e6 Capital losses (sale price \u00a1 cost)\n  \u25e6 Losses on variable product guarantees from market return changes\n5. C-4: General Business Risk \u2013 fraud, mismanagement, other risks","source":"SVILAC Ch. 1: Valuation Overview and Product Classifications","reading":"SVILAC","chapter":"Ch. 1 \u2013 Valuation Overview and Product Classifications","section":"C"},{"q":"What is the net level premium reserve method?","a":"Net premiums are constant % of gross premiums\ntV NLP\nx\n\u201c PVFBt \u00b4 NP0 \u00a8 :ax`t\nNP0 \u201c PB0 \u201c\n\u02c6PVFB0\n:ax\n\u02d9\n\u201c NP for first policy year\nr GP\nt\n\u201c gross premium ratio \u201c GPt\nGP0\n:ax \u201c 1 ` v \u00a8 1px \u00a8 r GP\n1\n` v2 \u00a8 2px \u00a8 r GP\n2\n` \u00a8 \u00a8 \u00a8\n:ax`t \u201c r GP\nt\n` v \u00a8 1px`t \u00a8 r GP\nt`1 ` v2 \u00a8 2px`t \u00a8 r GP\nt`2 ` \u00a8 \u00a8 \u00a8\nNPt \u201c PBt \u201c PB0 \u00a8 r GP\nt","source":"SVILAC Ch. 11: Valuation Methodologies","reading":"SVILAC","chapter":"Ch. 11 \u2013 Valuation Methodologies","section":"C"},{"q":"What is the full preliminary term (FPT) reserve method?","a":"FPT = Modified NLP with formulaic expense allowance\ntV FPT\nx\n\u201c tV NLP\nx\n\u00b4 tVEx \u201c PVFBt \u00b4 pPVPBt ` PVPEtq\ntVEx \u201c PVPEt \u201c PE0 \u02c6 :ax`t\nPE0 \u201c EAx\n:ax\nEAx \u201c NP1 \u00b4 cx \u201c\n\u02c6PVFB1\n:ax`1\n\u02d9\n\u00b4 cx\ncx \u201c v \u00a8 qx \u00a8 DB \u201c first-year COI\nNPt \u201c\n$\n&\n%\ncx\nfor t \u201c 0\np\u03b1q\nPBt ` PEt \u201c PVFB1\n:ax`1\n\u00a8 r GP\nt\nfor t \u011b 1\np\u03b2q","source":"SVILAC Ch. 11: Valuation Methodologies","reading":"SVILAC","chapter":"Ch. 11 \u2013 Valuation Methodologies","section":"C"},{"q":"What is the commissioner\u2019s reserve valuation method (CRVM)?","a":"\u2022 Modified reserve where EA is smaller of:\n1. EA under FPT for contract\n2. EA under FPT assuming 20-pay contract\n\u2022 Smallest reserves allowed by SVL\n\u2022 tV CRVM\nx\n\u201c tV FPT\nx\nunless m \u0103 20 years","source":"SVILAC Ch. 11: Valuation Methodologies","reading":"SVILAC","chapter":"Ch. 11 \u2013 Valuation Methodologies","section":"C"},{"q":"Formulas for mean and mid-terminal reserves?","a":"Mean Reserve \u2013 DPA = Mid-Terminal Reserve + UPL\nInterpMeanV \u201c p1 \u00b4 hq pt\u00b41Vx ` NPtq ` h ptVxq\nMeanV \u201c pt\u00b41Vx ` NPtq ` ptVxq\n2\nif h \u201c 0.5 (common)\nDPA \u201c\n\u00ff\nModal NPs due between val date and next anniversary\nInterpMidV \u201c p1 \u00b4 hq pt\u00b41Vxq ` h ptVxq\nMidV \u201c t\u00b41Vx ` tVx\n2\nif h \u201c 0.5 (common)\nUPL \u201c\n# months until next premium\n# months between premium payment \u02c6 Modal NP\nDPA and UPL held separately in stat financial statements","source":"SVILAC Ch. 11: Valuation Methodologies","reading":"SVILAC","chapter":"Ch. 11 \u2013 Valuation Methodologies","section":"C"},{"q":"List types of continuous reserves.","a":"1. Semicontinuous\n  \u25e6 DB paid at moment of death\n  \u25e6 Premiums paid BOY\n2. Fully Continuous\n  \u25e6 DB paid at moment of death\n  \u25e6 NP paid continuously throughout year\n  \u25e6 UPL for NPs paid beyond val date\n3. Discounted Continuous\n  \u25e6 Semicontinuous\n  \u25e6 Assumes refund of unearned premium at death\n  \u25e6 Requires DPA","source":"SVILAC Ch. 11: Valuation Methodologies","reading":"SVILAC","chapter":"Ch. 11 \u2013 Valuation Methodologies","section":"C"},{"q":"What is the immediate payment of claims reserve (IPCR)?","a":"Required for reserve methods assuming curtate death benefits\n\u2022 Reality: DBs paid closer to time of death\nIPCRt \u201c\n$\n\u2019\n\u2019\n&\n\u2019\n\u2019\n%\ni\n3PVFBx`t\nif DB paid without interest\ni\n2PVFBx`t\nif DB paid with interest\nBased on \u201ddeath portion of reserve\u201d","source":"SVILAC Ch. 11: Valuation Methodologies","reading":"SVILAC","chapter":"Ch. 11 \u2013 Valuation Methodologies","section":"C"},{"q":"List problems with CRVM addressed by principles-based approach.","a":"\u2022 Rules-based and highly conservative assumptions\n  \u25e6 Prescribed mortality and expense allowance\n  \u25e6 Interest rate based on formula\n  \u25e6 No explicit lapse assumption\n\u2022 Reserves don\u2019t vary with risk\n  \u25e6 Same reserve for super preferred vs. standard class\n\u2022 CRVM unchanged for decades despite product innovation\n\u2022 Reg XXX and AXXX \u2192excessive reserves for term and ULSG","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"What are the overarching principles of PBRs?","a":"Overarching Principles\n1. Use conservatism reflecting:\n  \u25e6 Unfavorable events if reasonable probability\n  \u25e6 Tail risk (if significant)\n2. Consistency with company\u2019s risk management\n3. Assumptions: prescribed and non-prescribed\n  \u25e6 Non-prescribed = blend of company and industry experience\n4. Margins for uncertainty\n  \u25e6 Greater uncertainty \u2192larger margin \u2192larger reserve\nAlso:\n1. Ensure solvency\n2. NOT be excessive\n3. Reflect contracts\u2019 risk","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"List Valuation Manual objectives.","a":"1. Consolidate min reserve requirements into one document\n2. Promote uniformity among state valuation requirements\n3. Provide efficient, consistent & timely process to update requirements\n4. Mandate/facilitate specific reporting of experience data\n5. Enhance compliance with SVL revisions","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Outline the steps for determining VM-20 minimum reserve.","a":"1. Calculate net premium reserve (NPR) floor (ALWAYS for all policies)\n  \u25e6 Formulaic, prescribed assumptions (similar to CRVM)\n2. Calculate PBRs: deterministic and/or stochastic (depends on exclusion tests)\n  \u25e6 Cash flow projection model\n  \u25e6 Assumptions = blend of company and industry experience\n  \u25e6 Determine in aggregate or by policy group, then allocate\n  \u25e6 Starting asset collar = 98% to max(NPR, 102%) of final reserve\n  \u25e6 Time period: until reserve no longer changes materially\n3. Excess Reserve = max[DR, SR] \u00b4 NPR\n  \u25e6 For DR and SR, add \u02d8 allocated pre-tax IMR\n  \u25e6 Floored at 0\n4. Min Reserve = NPR + max[0, max(DR, SR) \u00b4 (NPR \u00b4 DPA)]\n5. Aggregate min reserve = sum of min reserve for each product group\n  \u25e6 Term, ULSG, other life","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Steps for determining eligibility for exclusion tests?","a":"1. Classify policies: term, ULSG, other life\n2. Does group use clearly defined hedging strategy?\n  \u25e6 If YES: Always do stochastic and deterministic (done)\n  \u25e6 Else \u2192#3\n3. Decide if want stochastic exclusion test\n  \u25e6 Any group: pass \u2192no stochastic reserve required\n4. Other life only: decide if want deterministic exclusion test\n  \u25e6 Only eligible if did stochastic exclusion test first\n  \u25e6 Pass \u2192no deterministic reserve required\n  \u25e6 Term and ULSG must ALWAYS calculate deterministic reserves","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"What is the net premium reserve methodology?","a":"NPR \u201c PV(Benefits) \u00b4 PV(Net Premiums)\nFloored by GREATER of:\n1. COI through next paid-to date\n2. Cash value floor\nDifferences vs. CRVM\n\u2022 Different EA\n\u2022 Prescribed lapses for term and ULSG\n\u2022 Prescribed mortality can be adjusted\nSimilarities with CRVM\n\u2022 Prescribed CSO mortality\n\u2022 Same interest rates\n\u2022 Same gross premiums","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"}
