104: Profit Measurement And Analysis","chapter":null,"section":"E"},{"q":"Pre-tax earnings formulas for solvency and stockholder?","a":"ProdCashFlowptq \u201c Premptq \u00b4 Benptq \u00b4 Expptq\nPreTaxSolvEarnptq \u201c ProdCashFlowptq ` InvIncomeptq \u00b4 SolvResIncrptq\nPreTaxStockEarnptq \u201c ProdCashFlowptq ` InvIncomeptq \u00b4 BenResIncrptq\n\u00b4 DACAmortptq ` InvIncRCptq\n\u201c PreTaxSolvEarnptq ` SolvResIncrptq \u00b4 BenResIncrptq\n\u00b4 DACAmortptq ` InvIncRCptq\n\u201c ProdCashFlowptq ` InvIncomeptq \u00b4 EarnResIncrptq ` InvIncRCptq","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Compare timing vs. permanent differences.","a":"1. Timing differences: Differences in earnings that will eventually reverse\n  \u25e6 Most common (usually most significant) example:\nTimingDiffptq \u201c SolvResIncrptq \u00b4 TaxResIncrptq\n  \u25e6 Tax authorities prefer higher tax revenue (higher assets, lower liabilities)\n2. Permanent differences: Differences that will not reverse\n  \u25e6 Example: Non-deductible investment income\nPermDiffptq \u201c \u00b4InvIncomeptq \u02c6 NonTaxInvPctptq","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Formulas for taxable earnings and tax on earnings?","a":"TaxableEarnptq \u201c PreTaxSolvEarnptq ` TimingDiffptq ` PermDiffptq\n\u201c PreTaxSolvEarnptq ` SolvResIncrptq \u00b4 TaxResIncrptq ` PermDiffptq\n\u201c ProdCashFlowptq ` InvIncomeptq \u00b4 TaxResIncrptq ` PermDiffptq\nTaxptq \u201c TaxRate \u02c6 TaxableEarnptq","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"How can negative taxable earnings affect profitability?","a":"At company level, total tax cannot be negative\n\u2022 New products generate negative earnings\n\u2022 Smaller insurers may not be able to deduct first year losses\n  \u25e6 Results in higher capital, lower ROI","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Describe US tax treatment for capital gains/losses.","a":"\u2022 Capital gains: Immediately taxable\n\u2022 Capital losses: Can only offset capital gains\n\u2022 Capital losses can be carried forward to offset future capital gains\n  \u25e6 Creates timing difference\n\u2022 If carryforwards not used within 3 years \u00d1 expire\n  \u25e6 Creates permanent difference","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Describe tax on \u201cinvestment income less expenses.\u201d","a":"Attempts to tax annual \u00d2 in p/h value and insurer earnings\nInvIncomeptq \u00b4 Expptq \u201c Benptq ` SolvResIncrptq \u00b4 Premptq ` PreTaxSolvEarnptq\nIETaxptq \u201c IETaxRate \u02c6 rInvIncomeptq \u00b4 Expptqs\nSome countries may use this or use as minimum tax\nNOT used in US or Canada","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Describe tax on capital.","a":"Certain types of capital may be subject to tax (e.g., par surplus)\nTaxOnCapptq \u201c TaxCapitalptq \u02c6 CapTaxRateptq\nCould be assessed in addition to tax on earnings or used as minimum tax","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Describe purpose and function of DAC tax.","a":"\u2022 Temporarily \u00d2 taxable income as premiums collected\n\u2022 Reversed over next 10 years\n\u2022 DACTaxAmountptq = additions to DAC tax \u00b4 deductions from DAC tax\nTaxableEarnptq \u201c PreTaxSolvEarnptq ` TimingDiffptq ` PermDiffptq ` DACTaxAmountptq\nFor each premium collected (any policy year) for life insurance:\nAdd to\nDeduct From\nYear\nTaxable Earnings\nTaxable Earnings\n1\n7.7%\n5% of 7.7%\n2\u00b410\n0\n10% of 7.7%\n11\n0\n5% of 7.7%","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Describe tax treatment under US GAAP (stockholder) accounting.","a":"GAAP reports taxes on accrued basis\nTaxptq \u201c TaxRate \u02c6 TaxableEarnings\nAccruedTaxptq \u201c TaxRate \u02c6 PreTaxStockEarnptq\nDefTaxProvptq \u201c AccruedTaxptq \u00b4 Taxptq\nAfterTaxStockEarnptq \u201c PreTaxStockEarnptq \u00b4 AccruedTaxptq\n\u201c p1 \u00b4 TaxRateq \u02c6 PreTaxStockEarnptq\nDefTaxLiabptq \u201c DefTaxLiabpt \u00b4 1q ` DefTaxProvptq\n\u201c TaxRate \u02c6 rTaxResptq \u00b4 EarnResptqs\nCauses taxes to be level % of pre-tax stockholder earnings\nDefTaxLiab = liability (or asset if negative) for future tax payments","source":"ILA101-103: Taxes","reading":"ILA101-103: Taxes","chapter":null,"section":"E"},{"q":"Describe 4 accounting-based profitability indicators:\n1. Book Value Per Share\n2. Price-to-Book Ratio\n3. ROE\n4. Operating Margin","a":"1. Book Value Per Share = Book Value\nTotal Shares\n2. Price-to-Book Ratio =\nShare Price\nBook Value Per Share\n3. ROE = Shareholder Profits\nShareholder Equity\n  \u25e6 Advantages: Well understood, common\n  \u25e6 Disadvantages: Meaningful only at portfolio level\n4. Operating Margin = Operating Profits\nNet Premiums\n  \u25e6 Advantage: Easy comparisons\n  \u25e6 Disadvantages: Doesn\u2019t reflect timing, CoC, or riskiness","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"Describe 3 accounting-based profitability indicators:\n1. Benefits Ratio\n2. Lapse Ratio\n3. General Expense Ratio","a":"1. Benefits Ratio =\nP/h Benefits + \u2206Reserves\nPrems + Other Charges and Income\n  \u25e6 Advantages: Measures mortality/morbidity; easy to understand\n  \u25e6 Disadvantages: Short-term focus is misleading\n2. Lapse Ratio = Lapsed Policies or Face\nIn-Force Policies or Face\n  \u25e6 Advantage: Indicates net persistency\n  \u25e6 Disadvantages: May not accurately reflect timing\n3. General Expense Ratio = General Operating Exp\nNet Prems\n  \u25e6 Advantages: Cross-company comparisons\n  \u25e6 Disadvantages: Meaningful only for comparing similar business","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"Describe 2 accounting-based profitability indicators:\n1. Return on Assets (ROA)\n2. Net Investment Result","a":"1. Return on Assets (ROA) =\nProfit\nTotal Company Assets\n  \u25e6 Advantages: Easy to calculate; common for DAs\n  \u25e6 Disadvantages: Not good for life products; may be volatile\n2. Net Investment Result = Inv Gains \u00b4 Impairments\n  \u25e6 Good for products where this is important earnings source","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"List disadvantages of accounting-based indicators.","a":"\u2022 Statutory focus is solvency, not income\n\u2022 Rules vary throughout world\n\u2022 Volatility of GAAP and IFRS earnings\n\u2022 Poor at comparing new and existing business\n\u2022 Not usually meaningful at product level\n\u2022 Assumptions are locked in\n\u2022 No accounting for CoC","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"Describe MCEV (market-consistent embedded value).","a":"MCEV = VIF + Required Capital + Free Surplus\nVIF \u201c PV Future Profits \u00b4 Value of Options and Guarantees\n\u00b4 Cost of Non-Hedgeable Risks \u00b4 Frictional Cost of Req Cap\nReq Cap \u201c MV of Cap Allocated to Support Business\nFree Surplus \u201c MV of Any Extra Allocated Cap\n\u2022 Assets based on trading value\n\u2022 Liabilities valued using replicating portfolios\n\u2022 VIF highly sensitive to assumption changes\n\u2022 More downside interest rate risk (asymmetric)\n\u2022 Mortality and morbidity risk can be hedged (symmetric)\n\u2022 May be trumped by emerging standards (Solvency II, IFRS)","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"List components of MCEV earnings analysis.","a":"1. New business\n2. Unwinding of existing business\n3. Experience variances and assumption changes\n4. Economic variances","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"Describe 3 MCEV-based profitability indicators:\n\u2022 MCEV\n\u2022 MCEV Earnings Analysis\n\u2022 Value of In-Force (VIF)","a":"1. MCEV\n  \u25e6 Advantages: Measures long-term value; harmonized\n  \u25e6 Disadvantages: May be volatile or not understood by investors\n2. MCEV Earnings Analysis\n  \u25e6 Advantages: Understand MCEV drivers\n  \u25e6 Disadvantages: Can be volatile\n3. Value of In-Force (VIF)\n  \u25e6 Advantages: Shows BV net of relevant costs\n  \u25e6 Disadvantages: Can be volatile","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"Describe 3 MCEV-based profitability indicators:\n\u2022 Value of New Business (VNB)\n\u2022 New Business Margin\n\u2022 Return on MCEV","a":"1. Value of New Business (VNB)\n  \u25e6 Advantages: Understand value of NB\n  \u25e6 Disadvantages: May be overly optimistic\n2. New Business Margin =\nVNB\nNB Prems\n  \u25e6 Advantages: Compare to expected profit margins\n  \u25e6 Disadvantages: May be overly optimistic\n3. Return on MCEV = MCEV Earnings\nMCEV\n  \u25e6 Advantages: Complements ROE\n  \u25e6 Disadvantages: May be overly optimistic","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"List primary earnings sources and risk factors for insurers.","a":"1. UW Results \u2013 mortality, health, lapse products\n  \u25e6 Worse-than-expected claims or surrenders\n  \u25e6 Adverse selection and moral hazard\n  \u25e6 Frequent product churning\n2. Inv Results \u2013 savings products\n  \u25e6 Insurer\u2019s asset allocation\n  \u25e6 Market performance\n  \u25e6 Level of guarantees\n  \u25e6 Inv expertise\n  \u25e6 P/h loss sharing\n  \u25e6 Duration mismatch\n3. Inv Mgmt Fee Income \u2013 unit-linked products\n  \u25e6 Market volatility\n  \u25e6 P/h behavior","source":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","reading":"ILA101-102 \u2013 Understanding Profitability in Life Insurance","chapter":null,"section":"E"},{"q":"How are life insurance DBs treated for tax purposes?","a":"Full DB is tax-free under \u00a7101(a) if there is an insurable interest\n\u2022 Insurable interest may not exist for\n  \u25e6 Employer-owned life insurance (COLI)\n  \u25e6 Transfers for value (e.g., life settlements)\n\u2022 If DB is annuitized, the DB proportion of payments (level %) is not taxed\nDB\n\u0159 Expected Annuity Payments \u201c Non-Taxable % of Each Payment","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"Define lifetime distribution.","a":"Lifetime distributions result when CSV is brought outside the contract before death\n\u2022 Surrenders (partial or full), policy loans, dividends, maturities","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"Describe tax treatment of inside buildup.","a":"7702 and 7702A determine how the inside buildup is taxed before death\n\u2022 Never taxed on a 7702-compliant contract if CSV stays inside through death\n\u2022 If a distribution occurs, taxation depends on MEC status (7702A)\n  \u25e6 Non-MECs: FIFO (best) \u2013 cost basis comes out first\n  \u25e6 MECs: LIFO (worst) \u2013 gains come out first\n  \u25e6 Additional 10% penalty tax on the gain\n  \u25e6 Policy loans trigger gains just like surrenders (never for non-MECs)\n  \u25e6 Taxed portion of policy loan \u2191inv in the contract\n\u2022 Gain inside the contract = 7702 CSV \u00b4 Inv in the Contract\n  \u25e6 Inv in the Contract = Prems Paid \u00b4 Previous Distributions Excl From Income\n  \u25e6 CSV ignores surrender charges and policy loans\n  \u25e6 Actual surrender charges incurred are netted out of policy gain","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"Describe tax treatment of:\n\u2022 Premiums paid and interest paid on policy loans\n\u2022 1035 contract exchanges\n\u2022 Contract sales\n\u2022 Gifted life insurance\n\u2022 Deduction of loss on surrender or sale","a":"\u2022 Prems paid and interest paid on policy loans \u2013 not tax deductible\n\u2022 1035 contract exchanges \u2013 does not trigger taxable gain\n  \u25e6 Cost basis carries over\n  \u25e6 Works for any combination of life, annuity, or QLTCI contract exchanges\n\u2022 Contract sales (e.g., life settlements)\n  \u25e6 Seller\u2019s taxable gain = price received \u00b4 cost basis\n  \u25e6 Cost basis = prems paid \u00b4 cumulative COI\n  \u25e6 Buyer\u2019s cost basis = price paid + future prems \u00b4 future untaxed distributions\n\u2022 Gifted life insurance \u2013 always tax-free\n\u2022 Deduction of loss on surrender or sale \u2013 not tax deductible","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"How did DEFRA and TAMRA affect life insurance taxation?","a":"DEFRA (1984): \u00a77702 \u2013 applies to all contracts entered after 1984\n\u2022 Requires a contract to be life insurance under \u201capplicable law\u201d\n\u2022 Set definitional limitations (actuarial tests) to limit inv orientation\n  \u25e6 Contracts must satisfy CVAT or GPT / CV Corridor Test\n  \u25e6 Limits CSV relative to DB and/or prems paid\nTAMRA (1988): \u00a77702A \u2013 applies to contracts entered after 6/20/1988\n\u2022 Defined the MEC, which mainly prevented abuse of UL as a tax shelter\n  \u25e6 MEC = 7702 contract that fails 7702A\u2019s 7-pay test\n  \u25e6 Taxation of distributions is much less favorable than non-MEC\n\u2022 Amended 7702\u2019s rules for mortality charges","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"List classes of life insurance under \u00a77702 and \u00a77702A.","a":"1. Non-MEC Life Insurance Contracts\n  \u25e6 Passes 7702 and 7702A\n  \u25e6 DB is tax-free and tax on inside buildup is deferred\n  \u25e6 Inv comes out first when distributed (FIFO)\n2. MECs: Investment-Oriented Contracts\n  \u25e6 Passes 7702 but fails 7702A\n  \u25e6 DB is tax-free and tax on inside buildup is deferred\n  \u25e6 Gains come out first when distributed (LIFO)\n  \u25e6 Additional 10% penalty unless age \u011b 59 1\n2 or disabled\n  \u25e6 Policy loans taxed\n3. Failed Contracts: \u201cShort-Term Endowments\u201d (Rare)\n  \u25e6 Fails 7702\n  \u25e6 NAR portion of DB is tax-free\n  \u25e6 Inside buildup taxed annually\n  \u25e6 Insurer\u2019s tax reserve deduction is limited","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"What is \u00a77702\u2019s applicable law requirement?","a":"Requires a contract to be life insurance by law in the jurisdiction where issued\n\u2022 Includes state law or foreign law\n\u2022 Canada is the only other country that defines life insurance for tax purposes\n\u2022 FATCA informs IRS about foreign-issued contracts owned by US taxpayers\n7702 requires insurable interest\n\u2022 P/h has an interest in the continued life of the insured\n\u2022 Must be present for tax-free DBs","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"Define tax law terms:\n\u2022 Statutes\n\u2022 Regulations\n\u2022 IRS pronouncements\n\u2022 Legislative history\n\u2022 Case law\n\u2022 Private letter rulings","a":"Courts ruling 7702/7702A issues will act in the following order\n1. Look at the relevant statute (DEFRA, TAMRA, etc.)\n2. Look at regulations if any exist\n  \u25e6 IRS pronouncements are official IRS interpretations of the Code\n  \u25e6 Generally have same effect as law\n  \u25e6 Includes notices, revenue rulings, and revenue procedures\n3. Look at the statute\u2019s legislative history\n  \u25e6 Formal legislative history \u2013 formal congressional reports and colloquies\n  \u25e6 Blue books \u2013 bigger collection for each law but not as binding\n4. Follow any binding case law \u2013 legal precedents established by courts\nPrivate letter rulings \u2013 IRS decisions on situations related to a specific taxpayer\n\u2022 Indicates IRS\u2019s thinking but have no precedential value","source":"ILA101-108: LIME Ch. 1","reading":"ILA101-108: LIME","chapter":"Ch. 1","section":"E"},{"q":"Describe CVAT (Cash Value Accumulation Test).","a":"Policy passes if: CSVt \u010f NSPt at all durations\n\u2022 Prospective test: must pass by the terms of the contract\n  \u25e6 Contract must be designed to pass now and in the future\n\u2022 NSPt = PVt(DB) + PVt(Endow) + PVt(QAB Charges)\n  \u25e6 Interest Rate = max[4%, Guaranteed Rate in Contract]\n  \u25e6 Mortality assumption: use 100% prevailing CSO (Notice 2006-95 safe harbor)\n\u2022 CSV = CV ignoring SCs, policy loans, & reasonable termination dividends\n  \u25e6 CSV also equals any amount p/h can borrow against\n  \u25e6 Pricing consideration: remove as much uncertainty around CSV as possible","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe Guideline Premium / Cash Value Corridor Test.","a":"Must satisfy BOTH GPT and CV Corridor Test\nGuideline Premium Limitation: Prems Paid \u010f maxpGSP, \u0159 GLPsq\n\u2022 Retrospective test: requires measurement of actual events\n\u2022 Prems paid = prems actually paid into the contract less:\n  \u25e6 Non-taxable distributions (inv portion)\n  \u25e6 Force outs (prems returned within 60 days to ensure GPT compliance)\nCash Value Corridor Test: DBt \u011b CSVt \u02c6 Corridor Factort\n\u2022 Set by law: Ages 0\u201340 factor = 250%; for ages 41\u201395, factors grade to 100%","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe guideline premium limitation and calculation.","a":"Prems Paid \u010f max(GSP, \u0159GLPs);\nGSP \u201c PVpDBq ` PVpEndowq ` PVpQAB Chargesq ` PV(Exp)\n1 \u00b4 PremLoad%\nGLP \u201c\n\u02c6\nPVpDBq ` PVpEndowq ` PVpQAB Chargesq ` PV(Exp)\n:ax\n\u02d9\n\u02c6\n\u02c6\n1\n1 \u00b4 PremLoad%\n\u02d9\n\u2022 Mortality assumption: use 100% prevailing CSO (Notice 2006-95 safe harbor)\n\u2022 GSP interest rate = max[6%, Rate Guaranteed in Contract]\n\u2022 GLP interest rate = max[4%, Rate Guaranteed in Contract]\n\u2022 Expense assumption: use reasonable exp expected to be charged","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"List considerations for choosing a 7702 test.","a":"Strengths of CVAT = Weaknesses of GPT / Corridor Testing\n. . . and vice versa\nNormally choose 1 method and use for contract\u2019s life\nReasons to choose CVAT\n\u2022 Good for traditional products\n\u2022 Easier to ensure prospective compliance\n\u2022 Simpler (only 1 test)\n\u2022 Requires much less record-keeping\nReasons to choose GPT and CV corridor test\n\u2022 Better for flexible prem products (e.g., UL)\n\u2022 Errors are less likely to affect all policies; easier to deal with","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe 7-Pay Test.","a":"Policy is not a MEC if. . .\nAmount Paid \u010f p7-Pay Premq \u02c6 t\n7-Pay Prem \u201c PV(Future Benefits)\n:ax:7\n\u201c CVAT NSP0\n:ax:7\nin most cases\n\u2022 Interest, mortality, and future benefits: same as CVAT\n  \u25e6 Policies designed to be funded at 7-pay limit usually pass CVAT\n\u2022 Exclude exp (same as CVAT)\n\u2022 If DB \u0103 10,000, add $75 to 7-pay prem\n\u2022 Aggregation rule \u2013 combine all policies on same insured when testing","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe 7702 treatment of:\n\u2022 Multi-year interest rate guarantees\n\u2022 Policyholder dividends\n\u2022 Interaction with SNL\n\u2022 Net rate plans","a":"\u2022 Interest rate guarantees\n  \u25e6 Include any initial interest guarantees\n  \u25e6 Include any guaranteed bonus interest\n  \u25e6 Disregard short-term guarantees after first year\n\u2022 Interest rates assumed do not include p/h dividends\n  \u25e6 P/h dividend = ANY nonguaranteed element (IRC \u00a7808)\n\u2022 SNL and product design challenges\n  \u25e6 Nonforfeiture interest rates have fallen steadily since 1980s\n  \u25e6 The 4% and 6% 7702/7702A minimums have not changed\n\u2022 Net-rate plans: guaranteed interest rate should include implied mortality charges","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe history leading to current mortality assumption regulation for future benefits.","a":"Current safe harbor = 100% 2001 CSO\nContracts Issued 1988 or Later (History of Changes):\n\u2022 TAMRA\u2019s \u201creasonable\u201d mortality standard created confusion\n  \u25e6 Permanent mortality rule: max mortality = 100% prevailing CSO table\n  \u25e6 Interim mortality rule said \u201creasonable\u201d meant \u201cexpected to be imposed\u201d\n\u2022 Notice 88-128 safe harbor = 100% of sex-distinct 1980 CSO\n\u2022 Notice 2006-95 safe harbor = 100% 2001 CSO (M/F SM/NS)\n  \u25e6 Same mortality as current SNL\n  \u25e6 In effect for all post-2008 contracts\n  \u25e6 Grandfathers 1980 CSO contracts unless there are unusual changes\nContracts Issued Before 1988: Use mortality guaranteed in contract","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"How are expense charges regulated by 7702?","a":"\u201cExpense charges\u201d refers to QAB charges and guideline prem exp\nFor contracts issued after 1988:\n\u2022 Include exp that company reasonably expects to actually charge\n\u2022 Use actual exp even if \u0103 guaranteed","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"List 4 computational rules under 7702.","a":"1. Assumed DBs cannot increase\n  \u25e6 Option 1 NAR should \u00f3 through maturity\n2. Deemed maturity must be age 95\u2013100\n  \u25e6 Even if actual maturity age \u0103 95\n  \u25e6 Even if ending mortality table age \u0105 100\n  \u25e6 Limits inv orientation (no short-term endowments)\n3. Assume DBs until deemed maturity\n  \u25e6 Allows partial endowments before age 95\n4. Assumed endowment \u010f smallest future DB\n  \u25e6 \u201cEndowment\u201d includes CSV at maturity\n  \u25e6 Prohibits endowments \u0105 DB","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"What are alternate DB rules under 7702?","a":"Alternative rules \u201coverride\u201d the non-increasing DB rule\n1. Increasing Death Benefits (e.g., option 2 UL contracts)\n  \u25e6 Increasing DBs are allowed in the GLP calculation only\n  \u25e6 The increases must only be used to keep the NAR from decreasing\n  \u25e6 Guideline limitation = greater of:\n  \u25e6 GSP assuming a non-increasing DB\n  \u25e6 \u0159 GLPs assuming an increasing DB\n  \u25e6 Least endowment rule \u2013 restricts option 2 endowment to be \u010f specified amount\n2. Net Level Reserve Test\n  \u25e6 Allows a net level reserve test in place of CVAT\nCSVt \u010f Net Level Reservet\n  \u25e6 Based on a NL prem paid through age 95+ and assumes NAR does not increase\n  \u25e6 Not well suited for contracts that allow face adjustments","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"What QABs are allowed under 7702, and how are they reflected in definitional\nlimitations?","a":"QABs Specifically Listed Under 7702\n1. Guaranteed insurability riders\n2. Accidental death and disability (AD&D) riders\n3. Family term coverage \u2013 \u201cfamily\u201d means base insured, spouse, or child\n4. Disability waiver \u2013 waiver of prems or monthly deductions (UL)\nInclude PV(QAB Charges) in CVAT NSP, GSP, GLP, and 7-Pay\n\u2022 \u201cCharges\u201d = actual charges expected\n\u2022 Effectively raises the limitations to allow for higher prems paid due to the QAB","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe adjustment rules under 7702.","a":"Changes are generally allowed if\n\u2022 Initiated by p/h (e.g., DB change)\n\u2022 Allowed by operation of the contract (e.g., PUA purchase)\n\u2022 NOT initiated by company\nContractual changes have 2 potential effects\n1. May require recalculation of definitional limits\n  \u25e6 CVAT is \u201cself-adjusting\u201d \u2013 recalculate based on new current DB\n  \u25e6 Still must pass prospectively\n  \u25e6 Guideline prems are more restricted\n  \u25e6 Recalculate GSP and GLP as of current attained age\n  \u25e6 Accumulate new GLP going forward\n2. May result in loss of grandfathered status\n  \u25e6 Example: a 1980 CSO contract could become 2001 CSO\n  \u25e6 Usually not an issue as long as change is allowed in contract","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"List 4+ adjustments allowed under guideline prem test.","a":"1. Changes in DB or endowment benefits requested by p/h\n2. A DB change by operation of the contract that was not reflected due to\ncomputational rules\n  \u25e6 Example: can\u2019t assume increasing DBs, but p/h might do it anyway\n3. Purchase of PUAs\n4. Addition/deletion of QAB\n5. Change in DB option (1 \u00d8 2)\n6. Change in UW class or rating","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"What rules govern adjustment events for 7-Pay Test?","a":"1. Reduction-in-benefits rule\n  \u25e6 Must recalculate 7-pay prem from issue if DB reduced during first 7 years\n  \u25e6 Retroactive \u2013 assume the contract always had the lower DB\n  \u25e6 Same for scheduled and unscheduled changes\n  \u25e6 If amount paid \u0105 new 7-pay limitation \u00f1 MEC\n  \u25e6 Best practice: if a DB reduction is scheduled, reflect from the outset\n  \u25e6 Last-to-die contracts: rule applies even beyond year 7\n2. Material change rule (for events other than DB reductions)\n  \u25e6 Triggered after any change to benefits or terms used in original 7-pay\n  \u25e6 Applies any time during life of the contract (even beyond 7th year)\n  \u25e6 Start a new 7-year test period using a new, \u201cadjusted\u201d 7-pay prem:\n7-pay(Adj) \u201c NSP \u00b4 CSV\n:ax:7","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"How is option 2 GLP calculated?","a":"Option 2 DB = Face + Cash Value\nADBO2\nx\n\u201c\n\u02dc100\u00b4x\n\u00ff\nt\u201c1\nvtqx`t\u00b41\n\u00b8\n` v100\u00b4x\nGLPDBO2\nx\n\u201c Face \u00a8 ADBO2 ` PV(Exp)\n:a100\u00b4x\n\u02c6\n\u02c6\n1\n1 \u00b4 PremExp%\n\u02d9\nExp and QAB charges should also be discounted with interest only\nCVAT NSP, GSP, and 7-pay always use the option 1 approach","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"What approaches can be used to calculate monthly mortality and COI rates?","a":"\u2022 Monthly Mortality Rates \u2013 Can be arithmetic or exponential\nqpmq \u201c\n$\n&\n%\nq{12\nif arithmetic\n1 \u00b4 p1{12\nif exponential\n  \u25e6 Practically equal until age 55, then exponential grows much higher\n  \u25e6 Arithmetic approach produces lower option 1 prems\n  \u25e6 Exponential produces unreasonably large prems for option 2 contracts\n\u2022 COI Rates \u2013 Good for projection-based methods (UL)\nCOI \u201c\n$\n\u2019\n\u2019\n&\n\u2019\n\u2019\n%\nq{12\n1 \u00b4 q{12\nif arithmetic\n1 \u00b4 p1{12\np1{12\nif exponential\nIt is important to use the correct rate (COI Rate \u0105 mortality rate)","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Write basic commutation functions for option 1 and option 2 versions of Ax and :ax.","a":"These are equivalent to basic actuarial principles:\nAx \u201c Mx\nDx\n:ax \u201c Nx\nDx\nADBO2\nx\n\u201c MDBO2\nx\nDDBO2\nx\n` v100\u00b4x\n:aDBO2\nx\n\u201c NDBO2\nx\nDDBO2\nx","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe projection-based approach used under 7702 and 7702A.","a":"Equivalent to basic actuarial principles approach, but more practical for UL\nBasic idea: Solve for net level prem (NLP) by iteratively projecting cash flows\n\u2022 For GLP, NLP = prem that matures contract at age 100\n\u2022 For 7-Pay, NLP = prem that pays contract up at beginning of year 7\nCVt`1 \u201c\n\u00b4\nCVt ` NLP \u00b4 Expt \u00b4 NARt \u02c6 COI Ratet\n\u00af\n\u02c6\n\u00b4\n1 ` ipmq\nt\n\u00af","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"What is immediate payment of claims adjustment?","a":"To reflect that claims will be paid immediately:\nAIPC\nx\n\u201c i\n\u03b4 \u00a8 Ax\nwhere \u03b4 \u201c lnp1 ` iq and i\n\u03b4 \u00ab 1 ` i\n2","source":"ILA101-108: LIME Ch. 2","reading":"ILA101-108: LIME","chapter":"Ch. 2","section":"E"},{"q":"Describe primary classifications of life insurance for tax purposes in Canada.","a":"Post-Dec 1, 1982 Policies\n1. Exempt policies \u00f1 insurance-oriented (most favorable)\n  \u25e6 Inside CSV build-up is only taxed on disposition\n  \u25e6 DBs are 100% tax-free\n  \u25e6 Must pass exempt test (different rules for pre-2017 vs. post-2016)\n  \u25e6 Burden is on insurer to maintain exempt status\n2. Non-exempt policies \u00f1 savings-oriented (least favorable)\n  \u25e6 CSV build-up is taxed annually (\u201caccrual taxation\u201d)\n  \u25e6 Untaxed CSV build-up is taxed at death\n  \u25e6 Includes deferred annuities\nGrandfathered Pre-Dec 2, 1982 Policies (most favorable tax status of all)\n\u2022 No exempt/non-exempt distinction and higher cost basis\n\u2022 If lose grandfathered status \u00f1 deemed disposition \u00f1 perform exempt testing","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"Describe Canadian exempt policy rules.","a":"\u201cExisting\u201d rules for pre-2017 issues, and \u201cnew\u201d rules for post-2016 issue\n\u2022 If policy fails exempt test, it is non-exempt for life\n\u2022 A coverage remains exempt if this is true for all anniversaries (t\u2019s):\nAFt \u010f AFETP\nt\n\u2022 AF = MTAR = maximum tax actuarial reserve\n  \u25e6 Post-2016: MTAR = max(CSV Gross of SC, NPR)\n  \u25e6 Pre-2017: MTAR = max(CSV Net of SC, 1.5 PTR)\n\u2022 ETP = Exempt test policy\n  \u25e6 Post-2016 ETP: 8-pay endowment at 90\n  \u25e6 Mortality = generally same as actual policy\n  \u25e6 Interest rate = 3.5%\n  \u25e6 Pre-2017 ETP: 20-pay endowment at 85\n  \u25e6 Mortality = generally same as actual policy\n  \u25e6 Interest rate = max(contract rate, 4%)","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"How is exempt test policy accumulating fund calculated?","a":"The AF grades linearly through the pay period, then equals PVFB\nPost-2016 AFETP\nt\n\u201c\n$\n\u2019\n\u2019\n\u2019\n&\n\u2019\n\u2019\n\u2019\n%\nDBt \u02c6 Arxs`8:90\u00b4rxs\u00b48 \u02c6\n\u02c6 t\n8\n\u02d9\nif t \u010f 8 and rxs ` t \u0103 90\nDBt \u02c6 Arxs`t:90\u00b4rxs\u00b4t\nif t \u0105 8 and rxs ` t \u0103 90\nDBt\nif rxs ` t \u011b 90\nPre-2017 AFETP\nt\n\u201c\n$\n\u2019\n\u2019\n\u2019\n&\n\u2019\n\u2019\n\u2019\n%\nDBt \u02c6 Arxs`20:85\u00b4rxs\u00b420 \u02c6\n\u02c6 t\n20\n\u02d9\nif t \u010f 20 and rxs ` t \u0103 85\nDBt \u02c6 Arxs`t:85\u00b4rxs\u00b4t\nif t \u0105 20 and rxs ` t \u0103 85\nDBt\nif rxs ` t \u011b 85","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"List anti-avoidance rules under Canadian insurance taxation.","a":"These rules put additional limits on cash accumulation to prevent abuse\n1. Always use total DB for ETP face amount\n2. 8% rule: If DB \u2191by \u0105 8% between anniversaries:\n  \u25e6 \u201cIssue\u201d new ETP for excess increase\n  \u25e6 Test excess DB\u2019s CSV against new ETP AF\n  \u25e6 Post-2016: applies at coverage level\n  \u25e6 Pre-2017: applies to total policy DB\n3. 250% rule: Fund growth capped at 250% every 3 years starting in year 10\nPolicy AFt\nPolicy AFt\u00b43\n\u010f 250%\nfor t \u011b 10\nOnly applies if policy AF \u0105\n3\n20 of total ETP AFs\n  \u25e6 If triggered, set all ETP issue dates = max(actual issue date, t \u00b4 3)\n  \u25e6 Will not apply again for 6 years once triggered","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"How is adjusted cost basis determined for a typical exempt life insurance policy in\nCanada?","a":"Generally speaking, for an exempt policy. . .\nACB \u201c\n\u00ff\nPrems `\n\u00ff\nTaxable POD \u00b4\n\u00ff\nNCPI \u00b4\n\u00ff\nTotal POD\n\u2022 Prems = all prems paid except portion funded by a disposition\n  \u25e6 Also include amounts paid to acquire (e.g., life settlement)\n\u2022 Taxable POD = portion of all dispositions included in income\n  \u25e6 ACB falls by Total POD \u00b4 Taxable POD\n\u2022 NCPI = net cost of pure insurance\nNCPIt \u201c qx`t \u02c6 pDBt \u00b4 AF\u02da\nt q\nqx`t \u201c prescribed mortality rate\nAF\u02da\nt \u201c Policy AF ignoring policy loans \u201c gross CSV (usually)","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"List 4+ types of dispositions for Canadian tax purposes.","a":"All of the following are considered dispositions:\n1. Full and partial surrenders\n2. Policy loans\n3. Policy dividends\n4. Maturity benefits\n5. Absolute assignment of ownership (sale, transfer, or gift to another party)\n6. If a previously exempt policy fails the exempt test\n7. If a non-exempt policy dies","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"How is taxable income and ACB impact determined by pre-death dispositions in\nCanada?","a":"Taxable Income \u201c\n#\nPOD \u00b4 Prorated ACB\nfor post-Dec 1982 partial surrenders\nmaxpPOD \u00b4 Full ACB, 0q\nfor all other dispositions\nPost-Dec 1982 partial surrenders ONLY:\nProrated ACB \u201c\n#\nPartial Surrender\nCSV\u00b4Policy Loan \u02c6 Current ACB\nif post-2016\nPartial Surrender\nPolicy AF\n\u02c6 Current ACB\nif pre-2017\nRemember: pre-2017 policy AF = max(CSV Net of SC, 1.5 PTR), so it\u2019s not always the CSV!\nIn ALL Situations:\nACB After \u201c ACB Before \u00b4 POD ` Taxable Income","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"How are policy loans taxed in Canada?","a":"Policy loan POD = Loan Amount \u00b4 Portion Used to Pay Prem\n\u2022 Cannot exceed CSV \u00b4 Prior Policy Loan Balance\nTaxable income and ACB impact = same as any other non-partial surrender\nFuture ACB impacts:\n\u2022 ADD non-deductible paid policy loan interest to ACB\n  \u25e6 Don\u2019t add capitalized interest\n\u2022 ADD loan repayments to ACB after gain is repaid\n  \u25e6 Repaid taxable income from policy loans is deductible (so don\u2019t add it)\n  \u25e6 Net effect of repayments is to restore the original ACB reduction","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"How does accrual taxation work for non-exempt life insurance policies in Canada?","a":"Post-Dec 1982 non-exempt policies are subject to accrual taxation\nPost-1989 policies: every anniversary (and on death):\nTaxable Incomet \u201c Policy AFt \u00b4 ACB Beforet\nACB Aftert \u201c ACB Beforet \u00b4 POD ` Taxable Income\n\u201c Policy AFt","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"List ways a policy can lose grandfathered status.","a":"If any of these occur, grandfathered status is lost forever\n\u2022 Prescribed increases in BOTH prems and DBs\n  \u25e6 \u201cPrescribed\u201d means \u201cunscheduled\u201d in contract\n  \u25e6 Exceptions for changes in u/w class, payment frequency, certain riders\n\u2022 Prescribed prem paid on a non-exempt policy\n\u2022 Non-permitted changes in ownership\nThe following will never result in loss of grandfathered status:\n\u2022 Adding a term or other rider\n\u2022 Non-arm\u2019s length transfer (e.g., assign to a family member)\n\u2022 Roll overs into an annuity contract","source":"ILA101-116: CIT Ch. 10: Taxation of Life Insurance Policies","reading":"ILA101-116: CIT","chapter":"Ch. 10 \u2013 Taxation of Life Insurance Policies","section":"E"},{"q":"Describe financial advisor distribution channel.","a":"Typical market: wealthy clients, more sophisticated products\n\u2022 Individuals who arrived from outside of the life insurance industry\n\u2022 May be found in inv advisory companies, banks, or credit unions\n\u2022 Stockbrokers (largest group)\n\u2022 Does NOT include fee-based planners\n\u2022 Reached through wholesalers\n\u2022 Most advanced uses of life insurance\n\u2022 More face-to-face interaction than other channels","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe independent agent distribution channel.","a":"Typical market: middle to high income clients\n\u2022 Includes brokers and PPGAs\n\u2022 Producer groups common\n  \u25e6 Benefits for agents: higher comp, networking, education\n\u2022 Wholesalers \u2013 how companies reach independent agents\n  \u25e6 Spread-sheeting model vs. assisted sales model\n  \u25e6 Can be organized by product line or one for all product lines\n  \u25e6 External vs. internal wholesalers\n\u2022 Companies compete over agents with commissions and services provided","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe the career agent distribution channel.","a":"Typical market: middle to high income clients\n\u2022 Recruited and hired by a single company, but often sell for other companies too\n\u2022 Field sales offices vs. agencies\n  \u25e6 Agency Managers: salaried employees; company pays expenses\n  \u25e6 General Agencies: independent contractors; paid commissions/overrides; GA pays\nexpenses; harder to replace\n\u2022 Other staff: specialists and sales managers\n\u2022 Recent trends: Numbers have been declining\n  \u25e6 Very expensive form of distribution\n  \u25e6 Agent retention has been low\n  \u25e6 Independent agents becoming more popular\n  \u25e6 Moving from smaller to \u201cmega-agencies\u201d\n  \u25e6 Traditional distinctions between agency managers and GAs blurring","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe MLEA distribution channel.","a":"Typical market: mostly middle income life clients\n\u2022 Captive \u2013 Only sell only for one company\n\u2022 Known for extremely high retention rates (80%, which is 4x career agents)\n\u2022 Sell both P&C and life insurance\n\u2022 P&C sales are very different from life insurance\n  \u25e6 P&C ownership is mandatory\n  \u25e6 P&C sales process is \u201cone and done\u201d\n  \u25e6 Wealthy MLEA clients more likely to be P&C\n  \u25e6 Life insurance requires more agent involvement during u/w process\n\u2022 Life insurance clients: few wealthy clients; mostly middle income","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe IMO distribution channel.","a":"Typical market: low to middle income\n\u2022 Independent agency-like organizations\n\u2022 IMOs recruit, train, and support agents\n\u2022 Differences with career agent system:\n  \u25e6 IMO system is built for high productivity\n  \u25e6 No business brokered outside of IMO\n\u2022 Highly structured sales presentations\n\u2022 Usually focus on specific set of products sold to a specific market","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe call center distribution channel.","a":"Typical market: low to middle income\n\u2022 Prospects directed to toll-free number\n\u2022 Effective with affinity groups and association marketing (e.g., college alumni)\n\u2022 Gaining popularity","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe home service agent distribution channel.","a":"Typical markets: lower income, inner cities, rural south\n\u2022 Personal, face-to-face interaction between prospect and sales intermediary\n\u2022 Captive \u2013 only sell for one company\n\u2022 Traditional form: industrial or debit life insurance\n  \u25e6 Agents collected prem door to door weekly\n  \u25e6 Commissions paid on growth, not individual sales\n  \u25e6 Became obsolete (labor force changes, selling practices, agent safety)\n\u2022 Monthly debit ordinary has replaced weekly industrial prem collection","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe worksite distribution channel.","a":"Typical market: low to middle income, smaller face policies\n\u2022 Employers allow policy prems to be paid via payroll deduction\n\u2022 Intended to supplement employees\u2019 existing coverage\n\u2022 Consumers like because\n  \u25e6 Ease of purchase and convenience\n  \u25e6 Perception that employer vetted quality first\n\u2022 Insurer must be an expert in administrative and payroll systems","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"Describe forms of direct distribution channels.","a":"Typical market: low to middle income\n1. Internet direct\n  \u25e6 Company-specific or market-specific websites\n  \u25e6 Aggregators (most popular) \u2013 multiple companies on one site\n  \u25e6 Mostly term life with larger face amounts than direct mail\n  \u25e6 Companies compete on price\n  \u25e6 Simplified issue u/w\n2. Pure direct\n  \u25e6 Mailed solicitations\n  \u25e6 More effective when combined with human intervention (e.g., sales rep in call center)\n  \u25e6 Overly saturated (not very effective)\n  \u25e6 Only 2\u20135% realized prem","source":"A&S Ch. 3: Primary Life Insurance Channels","reading":"A&S","chapter":"Ch. 3 \u2013 Primary Life Insurance Channels","section":"E"},{"q":"List 4 main steps performed by a distribution channel.","a":"1. Step 1: Prospecting for New Clients\n2. Step 2: Needs Analysis\n3. Step 3: Presenting and Closing\n4. Step 4: Managing the Client Relationship","source":"A&S Ch. 4: Functions of Distribution","reading":"A&S","chapter":"Ch. 4 \u2013 Functions of Distribution","section":"E"},{"q":"Describe how distribution channels prospect for new clients.","a":"\u2022 Traditionally the most important function\n\u2022 Main reason agents fail: don\u2019t generate enough prospects\n\u2022 Prospecting methods\n  \u25e6 Cold calling\n  \u25e6 Direct mail\n  \u25e6 Event based networking\n  \u25e6 Social media\n  \u25e6 Referred leads\n\u2022 Ultimate goal: word of mouth advertising\n\u2022 Channel considerations\n  \u25e6 Call center and/or direct methods don\u2019t use prospecting\n  \u25e6 Traditional agents \u2013 Difficult to measure success\n  \u25e6 IMOs have clearest process (IMO gives leads to agents or agents pay)","source":"A&S Ch. 4: Functions of Distribution","reading":"A&S","chapter":"Ch. 4 \u2013 Functions of Distribution","section":"E"},{"q":"Describe how distribution channels perform needs analysis.","a":"Key steps:\n1. Judge the likelihood that the prospect will buy\n2. Begin a sales discussion\nVariations\n\u2022 Level varies with socio-economic status of client\n\u2022 Varies with channel\n  \u25e6 Financial planners \u2013 more likely to do sophisticated analysis\n  \u25e6 IMOs \u2013 do little comprehensive analysis (specialized already)\n  \u25e6 Direct \u2013 may not do any at all (little or no face-to-face contact)","source":"A&S Ch. 4: Functions of Distribution","reading":"A&S","chapter":"Ch. 4 \u2013 Functions of Distribution","section":"E"},{"q":"Describe key steps that distribution channels follow to present and close contracts.","a":"1. Producer presents illustrations\n  \u25e6 Presented for different products, different companies\n  \u25e6 Regulated\n2. Agent initiates application and u/w process\n3. U/w steps\n  \u25e6 Long list of medical and lifestyle questions\n  \u25e6 Paramedical exam\n  \u25e6 Ways of speeding up the process: simplified issue, tele-u/w\n  \u25e6 Agents are MUCH less involved today\n4. Policy delivered in person by agent","source":"A&S Ch. 4: Functions of Distribution","reading":"A&S","chapter":"Ch. 4 \u2013 Functions of Distribution","section":"E"},{"q":"Describe role of distribution channels in managing client relationship and key\nchallenges.","a":"\u2022 P/h services is mostly done by home office\n  \u25e6 Frees agents\u2019 time to focus on selling and prospecting\n\u2022 Retention programs have mostly failed\n  \u25e6 Agent retention is a major challenge\n  \u25e6 Orphans must be serviced by home office\n  \u25e6 Levelized commissions hurt new agents\n  \u25e6 Poor comp for distribution systems for POS\n  \u25e6 More focus on sales than retention\n\u2022 Agents still deliver DBs","source":"A&S Ch. 4: Functions of Distribution","reading":"A&S","chapter":"Ch. 4 \u2013 Functions of Distribution","section":"E"},{"q":"Describe forms of producer compensation:\n1. Commissions\n2. Financing\n3. Commission advances\n4. Vesting Schedules\n5. Bonuses\n6. Expense Reimbursement Allowance (ERA)\n7. Benefits\n8. Recognition","a":"1. Commissions\n  \u25e6 Heaped, annualized commissions\ncommon\n  \u25e6 Claw backs mitigate FY lapses\n  \u25e6 \u00d2 renewal comm, \u00d2 persistency\n2. Financing\n  \u25e6 Validation requirements\n  \u25e6 Financing plans \u2013 financial\nassistance for new agents\n3. Commission advances\n  \u25e6 Debt owed to company\n4. Vesting Schedules\n  \u25e6 Usually fully vests after a given\nnumber of years\n5. Bonuses (e.g., persistency bonus)\n  \u25e6 Often % of prem\n  \u25e6 Not guar. but hard to take away\n6. Expense Reimbursement\nAllowance (ERA)\n  \u25e6 Covers agent\u2019s legit business exp\n  \u25e6 Regulated\n  \u25e6 Behaves like a bonus\n7. Benefits (Career Agents)\n  \u25e6 401k, health insurance, etc.\n8. Recognition\n  \u25e6 Incentive trips\n  \u25e6 Regulated\n  \u25e6 May be very expensive","source":"A&S Ch. 6: Distribution Compensation","reading":"A&S","chapter":"Ch. 6 \u2013 Distribution Compensation","section":"E"},{"q":"Describe 2 forms of agency head compensation.","a":"1. Override = % of agent commission\n  \u25e6 Traditional form of agency manager comp\n2. Gross Dealer Concession (GDC)\n  \u25e6 Common for brokerage inv products\n  \u25e6 Total revenue paid to producer for selling\n  \u25e6 More transparent\n  \u25e6 Written in contract\n  \u25e6 Fully discloses to manager and salesperson\n  \u25e6 Salesperson gets a % of GDC\n  \u25e6 GDC grid \u2013 salesperson % \u2191with production\n  \u25e6 Approaches for life insurance\n  \u25e6 GDC = agent commission + overrides\n  \u25e6 GDC priced into exp margin","source":"A&S Ch. 6: Distribution Compensation","reading":"A&S","chapter":"Ch. 6 \u2013 Distribution Compensation","section":"E"},{"q":"How does regulation limit distribution compensation?","a":"\u2022 NY State Regulation 4228\n  \u25e6 Limits total spending on sales comp\n  \u25e6 Extraterritorial\n\u2022 SEC regulation\n  \u25e6 Pertains to variable products","source":"A&S Ch. 6: Distribution Compensation","reading":"A&S","chapter":"Ch. 6 \u2013 Distribution Compensation","section":"E"},{"q":"Describe 2 important pricing considerations related to distribution compensation.","a":"1. Very large and front-loaded\n  \u25e6 High first-year commissions\n  \u25e6 Large costs paid before sales are made\n2. Prem must cover distribution costs\n  \u25e6 Don\u2019t omit or double count\n  \u25e6 Include overhead: yes or no?","source":"A&S Ch. 7: The Economics of Life Insurance Distribution","reading":"A&S","chapter":"Ch. 7 \u2013 The Economics of Life Insurance Distribution","section":"E"},{"q":"Describe 4 types of contingent or non-contingent distribution expenses.","a":"\u2022 Not Contingent (given)\n  \u25e6 Building rent and other fixed costs\n\u2022 Sales contingent\n  \u25e6 Commissions and overrides\n  \u25e6 Recognition\n  \u25e6 Benefits\n  \u25e6 Production bonuses\n\u2022 Persistency-contingent\n  \u25e6 Renewal commissions and overrides\n  \u25e6 Chargebacks\n\u2022 Agent longevity\n  \u25e6 Vesting\n  \u25e6 Field mgmt comp","source":"A&S Ch. 7: The Economics of Life Insurance Distribution","reading":"A&S","chapter":"Ch. 7 \u2013 The Economics of Life Insurance Distribution","section":"E"},{"q":"Describe 2 distribution expense modeling approaches.","a":"1. Model contingencies within the pricing model\n  \u25e6 More complex but easier to validate\n2. Enter as a single input\n  \u25e6 Model contingent distribution costs separately first\n  \u25e6 Simpler but harder to validate","source":"A&S Ch. 7: The Economics of Life Insurance Distribution","reading":"A&S","chapter":"Ch. 7 \u2013 The Economics of Life Insurance Distribution","section":"E"},{"q":"Describe how distribution loads can be priced into life insurance premiums.","a":"Distribution loading approach\n\u2022 2 ways to start\n  \u25e6 Create standalone model of distribution channel\n  \u25e6 Distribution business unit provides initial estimate\n\u2022 Assumes the market sets the prem\n\u2022 Distribution load =\n  \u25e6 Prem remaining after benefits, exp, and desired profit\n  \u25e6 Distribution channel\u2019s revenue\n\u2022 Distribution channel manages its exp within the load revenue\n  \u25e6 Clearer economic value\n  \u25e6 Channel can justify costs if lead to higher revenue\n\u2022 No need to model contingent distribution costs","source":"A&S Ch. 7: The Economics of Life Insurance Distribution","reading":"A&S","chapter":"Ch. 7 \u2013 The Economics of Life Insurance Distribution","section":"E"},{"q":"Which distribution channels are predicted to decline?","a":"\u2022 Direct Mail\n  \u25e6 Decline due to consumer saturation and \u2191reliance on technology\n  \u25e6 Applies to pure direct mail without human interaction\n\u2022 Home Service\n  \u25e6 Long-term decline with no signs of reversal\n\u2022 Career Agents and Independent Agents\n  \u25e6 Decline due to aging workforce and difficulty attracting younger agents","source":"A&S Ch. 10: The Future of Life Insurance Distribution","reading":"A&S","chapter":"Ch. 10 \u2013 The Future of Life Insurance Distribution","section":"E"},{"q":"Which distribution channels are predicted to be stable?","a":"\u2022 Internet Direct\n  \u25e6 Consumers prefer personalized advice and human interaction\n  \u25e6 Technology will influence shopping behavior\n  \u25e6 Uncertainty: Will Gen Y desire human interaction like prior generations?\n\u2022 Voluntary Worksite Marketing\n  \u25e6 Growth has plateaued due to market saturation\n  \u25e6 Focus has shifted to selling specialty products (e.g., identity theft protection)","source":"A&S Ch. 10: The Future of Life Insurance Distribution","reading":"A&S","chapter":"Ch. 10 \u2013 The Future of Life Insurance Distribution","section":"E"},{"q":"Which distribution channels are predicted to grow?","a":"Predicted to have slow growth:\n\u2022 IMOs and MLEAs\n  \u25e6 Slow, steady growth by targeting under-insured middle market\n\u2022 Financial Advisor\n  \u25e6 Growth as agents offer broader financial services\n  \u25e6 Limited life insurance growth due to estate planning law changes\nPredicted to have rapid growth:\n\u2022 Call Center-Mediated Direct Response\n  \u25e6 Avoids negative reputation of traditional agents (e.g., overselling, pressure)\n  \u25e6 Combines personal interaction with efficiency, meeting consumer preferences","source":"A&S Ch. 10: The Future of Life Insurance Distribution","reading":"A&S","chapter":"Ch. 10 \u2013 The Future of Life Insurance Distribution","section":"E"},{"q":"Describe recent trends in life insurance sales.","a":"\u2022 Sales have been declining and are at a 50-year low\n  \u25e6 Sharpest decline: middle-income and millennial market\n  \u25e6 Average US household is under-insured by 400K\n\u2022 Average face amount has risen\n  \u25e6 Agents now focus on the higher net worth market\n\u2022 Distribution channels are not designed to serve the mid-market","source":"Life Insurance for the Digital Age: An End-to-End View","reading":"Life Insurance for the Digital Age: An End-to-End View","chapter":null,"section":"E"},{"q":"Describe traditional forms of u/w and how end-to-end u/w is different.","a":"Traditional u/w methods:\n\u2022 Full u/w (lowest mortality cost)\n  \u25e6 Medical/para-medical exam\n  \u25e6 Collection of fluids (blood/urine)\n  \u25e6 Rx, MVR, and MIB\n\u2022 Non-medical u/w (higher mortality cost)\n  \u25e6 No medical/para-medical exam\n  \u25e6 No fluid collection\n  \u25e6 Rx, MVR, and MIB\nEnd-to-end approach:\n\u2022 Supplements non-medical u/w with predictive analytics\n\u2022 Can bring non-medical mortality cost down to fully u/w levels\n\u2022 More customer friendly (less invasive)\n\u2022 Faster, cheaper","source":"Life Insurance for the Digital Age: An End-to-End View","reading":"Life Insurance for the Digital Age: An End-to-End View","chapter":null,"section":"E"},{"q":"List 4+ ways that insurers can improve customer satisfaction.","a":"Insurance customer satisfaction << personal banking and retail\nHow to \u2191mid-market and millennial customer satisfaction:\n1. Quick tutorial on life insurance with concise explanation of benefits\n2. Individualize needs analysis and recommendations\n3. Simpler application process (fewer questions and pre-filled info)\n4. Real time quotes similar to auto insurance\n5. Relevant quote alternatives for comparison\n6. View of life insurance and related products (e.g., purchased by peers)","source":"Life Insurance for the Digital Age: An End-to-End View","reading":"Life Insurance for the Digital Age: An End-to-End View","chapter":null,"section":"E"},{"q":"Review end-to-end u/w process on back of card. Be able to describe each step.","a":"1. Improved UI\n2. Predict Risk Score\n3. Predict Smoker Status\nPredictive Analytics\n4. Triage\n9. Trad U/W\nToo Risky\n5. Risk Classification/Scoring\n6. External Rules Engine\n7. Real-Time\nQuotes\n8. Customer\nResponse","source":"Life Insurance for the Digital Age: An End-to-End View","reading":"Life Insurance for the Digital Age: An End-to-End View","chapter":null,"section":"E"},{"q":"List key trends with life insurance resulting from low interest rates","a":"\u2022 Prem rates \u00d2, especially for term\n\u2022 Term and WL sales remained steady\n\u2022 Multiple companies plan to exit the life insurance completely (or already have)\n\u2022 Major ULSG carriers have paused ULSG sales\n\u2022 Active mgmt of NGEs (e.g., raised COI charges) even if it means litigation\n\u2022 Insurers want to \u2191retention of profitable post-level term business","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"List key trends with annuities resulting from low interest rates","a":"\u2022 More focus on accumulation; less on long-tailed secondary guarantees\n\u2022 RILA market has expanded\n\u2022 VA market share has \u2193; some insurers have exited\n\u2022 More GA product competition from PE-backed companies\n\u2022 \u2191use of reinsurance for fixed annuities, including FIAs\n  \u25e6 Redundant reserve financing treaties utilized to aid profitability\n  \u25e6 Offshore reinsurance used for ALM and access to alternative inv\n\u2022 Fixed annuity sales \u00d2 when credit spreads \u00d2\n\u2022 Active mgmt of NGEs (crediting rates)","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"List key trends with LTC insurance resulting from low interest rates","a":"\u2022 Carriers continue to exit the standalone LTC market\n\u2022 Features of new standalone LTC products:\n  \u25e6 Simpler designs\n  \u25e6 Less rich benefits\n  \u25e6 Cost-sharing features (e.g., co-pays)\n\u2022 Some mutual companies have introduced par LTC policies\n\u2022 \u2191in LTC combo products (e.g., base life policy + LTC rider)\n  \u25e6 New product chassis mitigate interest rate risk (VUL)\n\u2022 Continued inv in inforce mgmt, including prem rate \u2191","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"Describe general trends in past 20 years when interest rates have risen and how\ncurrent period may affect insurers","a":"Past periods of rising interest rates have 2 things in common:\n1. The 10-year rate only \u21911% to 1.5% over a 2-year period\n2. Rates fell sharply after each period\nAssuming the trends are repeated with the current rise in interest rates:\n1. Portfolio rates won\u2019t change significantly, so it won\u2019t improve insurers\u2019 profits\n2. The \u2191in rates may be short-term","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"Provide examples of product designs that perform best when interest rates rise","a":"Focus on flexible product designs\n\u2022 WL is the most stable when interest rates change dramatically\n  \u25e6 Simple, compatible product design\n  \u25e6 Use of portfolio pricing instead of new money\n\u2022 Interest-sensitive products are hurt when interest rates are low\n  \u25e6 ULSG becomes expensive for p/h\n  \u25e6 FAs/MYGAs become unattractive compared to FIA, IUL, VAs\n  \u25e6 FIA/IUL perform well when rates rise if equity markets are also rising","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"Provide 4+ examples of products that perform well and mitigate interest rate risk along\nwith advantages to insurers and p/h","a":"\u2022 1-year rate guarantee instead of multi-year\n  \u25e6 Pro to insurer: can make timely adjustments based on market\n  \u25e6 Pro to p/h: potentially higher guarantees that adapt to markets\n\u2022 Multi-year rate guarantees with small stair-step rate \u2191\n  \u25e6 Pro to insurer: less risk since steps are small (e.g., 15 bps)\n  \u25e6 Pro to p/h: mitigates risk of low/flat guarantee\n\u2022 Participation in equity markets/indexes\n  \u25e6 Pro to insurer: higher illustrated returns with lower guarantees\n  \u25e6 Pro to p/h: earn returns comparable to other financial products\n\u2022 Monthly cap instead of annual cap\n  \u25e6 Pro to insurer: \u2191product popularity with low risk of large loss\n  \u25e6 Pro to p/h: possibility of much higher annual return\n\u2022 Cumulative guarantees over a defined period (e.g., 2%/year for 5 years)\n  \u25e6 Pro to insurer: cheaper than annual guarantee\n  \u25e6 Pro to p/h: same guaranteed \u2191over a longer term\n\u2022 Participation by paying dividends during favorable market conditions\n  \u25e6 Pro to insurer: weaker guarantee, so less risk in unfavorable markets\n  \u25e6 Pro to p/h: can participate in insurer\u2019s performance\n\u2022 Stacking rollup for FIA GLWBs\n  \u25e6 Pro to insurer: \u2193strain and adds flexibility\n  \u25e6 Pro to p/h: potential upside if market performs well","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"Describe how a temporary rise in interest rates might affect insurer\u2019s portfolio returns","a":"If the rise in rates is short-term, portfolio rates will continue to fall\n\u2022 Be prudent in providing higher credited rates and/or longer guarantees\n\u2022 Reduce nonguaranteed benefits and costs (e.g., sales rep comp)\n\u2022 Closely monitor features (e.g., ROP riders) where low interest rates with level\nprems will erode profits","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"Provide an example of a tail risk scenario involving rising interest rates","a":"\u2022 Early 1980s: UL writers shortened asset portfolios when ST yields \u0105 LT yields\n\u2022 When ST yields fell, UL writers moved to risky assets to maintain returns\n  \u25e6 Worked well until junk bond market collapsed in the early 1990s\n  \u25e6 3 large insurers went insolvent with mass UL surrenders","source":"Market Trends. . . in a Rising Interest Rate Environment","reading":"Market Trends. . . in a Rising Interest Rate Environment","chapter":null,"section":"E"},{"q":"Corporate bond issuer-bondholder legal structure?","a":"Indenture \u2013 contract between issuer and bondholders\nCorporate trustee \u2013 bank/trust co. acting as fiduciary for investors\n\u2022 Paid by issuer\n\u2022 Enforces B/H interests in indenture\n\u2022 Can declare default if issuer breaches indenture","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Corporate bond fundamentals?","a":"\u2022 Issuers: utilities, transportation, industrial, banks, etc.\n\u2022 Maturity: typically \u0103 30 years\n\u2022 Most are registered or book entry \u00d1 automatic coupons\n\u2022 Straight coupon bonds: fixed coupons paid semiannually\n  \u25e6 Participating bonds share profits above certain level\n  \u25e6 Income bonds (rare) pay interest only if issuer income sufficient\n\u2022 Coupons may also be zero, deferred, or paid-in-kind (PIK)","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Compare Zero vs. Deferred vs. PIK coupons.","a":"\u2022 Zero-coupon bonds\n  \u25e6 A type of OID bond\n  \u25e6 Less popular today (tax benefits declined)\n  \u25e6 No reinvestment risk if held to maturity\n\u2022 Deferred-interest bond (DIB) \u2013 blend of straight coupon + zero coupon\n  \u25e6 Most are junk bonds\n  \u25e6 Most pay no cash interest for first 5 years\n\u2022 Pay-in-kind (PIK) debentures\n  \u25e6 Pays additional securities instead of coupons\n  \u25e6 Additional securities can be sold separately\nNote: All have higher credit risk than straight coupon bonds","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Describe 5 bond security types.","a":"\u2022 Debentures \u2013 no specific security (most common)\n  \u25e6 B/H = general creditors; security = issuer financial strength\n  \u25e6 Common restrictions: min net worth, selling major assets, stock dividends\n  \u25e6 Other B/H protections: negative pledge clause\n  \u25e6 Subordinated issues may offer conversion rights\n\u2022 Mortgage Bonds \u2013 B/H gets 1st-mortgage lien on property\n  \u25e6 Blanket mortgage \u00d1 allows additional series on same mortgage\n  \u25e6 Possible B/H protection: after-acquired clause\n\u2022 Collateral Trust Bonds \u2013 backed by stock of issuer\u2019s subsidiaries\n  \u25e6 B/H protection: issuer default \u00d1 forfeits voting rights on subsidiary stock\n\u2022 Equipment Trust Certificates \u2013 issued by railroads\n  \u25e6 Trustee owns RR equipment, leases to RR, RR buys at lease end\n  \u25e6 Very secure: RR depends on equipment, always buys back\n\u2022 Guaranteed Bonds \u2013 guaranteed by one or more other companies","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"List 5 early debt retirement methods.","a":"1. Call and refunding provisions\n2. Sinking fund provisions\n3. Maintenance and replacement funds (doesn\u2019t retire bonds)\n4. Redemption through sale of assets (usually restricted)\n5. Tender offers \u2013 issuer buys back bonds at PV using CMT + fixed spread\nFirst 4 must be in indenture if applicable","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Describe corporate bond call provisions.","a":"\u2022 Riskiest for B/H: fixed price call\n  \u25e6 Call price usually starts at premium, then declines\n  \u25e6 May have initial lockout period or non-refundable period\n\u2022 Less risky, more common: make-whole call\n  \u25e6 Call price = max(par, PV remaining CFs at CMT + spread)\n  \u25e6 Call price moves inversely with interest rates\n  \u25e6 Issuer advantage: can issue at lower yield","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Describe corporate bond sinking fund provisions.","a":"Sinking fund provisions popularity has declined\n\u2022 Indenture requires issuer to retire portion of bonds each year (usually at par)\n\u2022 \u00d3 default risk\n\u2022 B/H benefit if rates \u00d2 (get par even if MV \u0103 par)\n\u2022 Issuer may accelerate sinking fund if rates \u00d3","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Issuer default rate formula?","a":"Issuer default rate \u2013 based on number of defaulting issuers\nNo. Issuers that Default in Year\nTotal Issuers at BOY","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Dollar default rate formula?","a":"Dollar default rate \u2013 based on amount of defaulted par\nOver multiple years:\nCumulative $ Value of Defaulted Bonds\nCumulative $ Value of All Issues \u02c6 Wtd Avg Years Outstanding\nAnnual rate:\nCumulative $ Value of Defaulted Bonds\nCumulative $ Value of All Issues","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Default loss rate and recovery rate formulas?","a":"Default Loss Rate = Default Rate \u00b4 Recovery Rate\nRecovery rate = % of defaulted bond B/H recover after default\n\u2022 Difficult to measure: consists of cash and securities","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Event risk vs. headline risk?","a":"Event risk \u2013 stockholder-driven event \u00d1 lower bond prices\n\u2022 Rating downgrades, \u00d2 leverage from M&A, etc.\nHeadline risk \u2013 bad media coverage \u00d1 lower bond prices","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Describe high-yield bond unique features.","a":"A.k.a. \u201cjunk bonds\u201d \u2013 many only just below IG (\u0103 BBB or Baa)\n\u2022 Deferred Coupon Structures (3 kinds)\n1. Deferred-interest bonds (most common) \u2013 no coupons 3\u20137 years\n2. Step-up bonds \u2013 low initial coupon, then \u00d2\n3. PIK bonds\n\u2022 Extendible Reset Bonds\n  \u25e6 Coupon resets periodically to maintain specified price\n  \u25e6 New rate = new interest rate level + credit spread\n  \u25e6 \u2030 floating rate (which uses fixed spread)\n  \u25e6 In practice, issuer may not afford the coupon\n\u2022 Clawback \u2013 redeem bonds during non-callable period w/ IPO proceeds\n  \u25e6 Can hurt B/H since investment would be rising","source":"HFIS Ch. 10: Corporate Bonds","reading":"HFIS","chapter":"Ch. 10 \u2013 Corporate Bonds","section":"F"},{"q":"Mortgage payment characteristics?","a":"\u2022 Can be amortizing (principal and interest), IO, and/or balloon\n\u2022 Rate can be fixed, adjustable (ARMs), or hybrid ARMs\n  \u25e6 ARMs require payment to be recast when the index-based rate changes","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"Key mortgage industry participants?","a":"\u2022 Direct lenders \u2013 UW and provide loans directly to borrowers\n\u2022 Brokers \u2013 work with clients and wholesale lenders\n\u2022 TPOs \u2013 when a loan is completely/partially originated/processed by a party other\nthan seller\n\u2022 Depository institutions \u2013 fund loans with bank deposits\n\u2022 Non-depository lenders \u2013 fund loans by selling them to investors\n\u2022 Originators \u2013 UW and fund loans\n\u2022 Servicers \u2013 collect monthly payments, handle property tax payments, deal with\ndelinquencies\n\u2022 MBS providers \u2013 public or private companies that buy and securitize mortgages\nfor investors","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"Describe aspects of the mortgage underwriting process.","a":"UW evaluates borrower\u2019s credit and value of property\nCriteria used to evaluate credit:\n1. Credit (\u201cFICO\u201d) scores: 730+ is strong\n2. If LTV ratio \u0105 80%, mortgage insurance required\n3. Debt-to-income ratio criteria (lower is better) (e.g. front ratio and back ratio)\nFront Ratio \u201c Total Monthly Payments on the Home\nBorrower\u2019s Pretax Monthly Income\nBack Ratio \u201c Front Ratio ` Other Debt Payments Like Auto Loans\nBorrower\u2019s Pretax Monthly Income\nDocumentation/standards \u2193until 2008 crisis, then \u2191","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"How are mortgage lending rates generated?","a":"\u2022 MBS providers heavily influence mortgage rates\n\u2022 WAC = Weighted avg coupon in MBS pool\n\u2022 Originators set rates \u0105 MBS coupon to profit\n\u2022 MBS investor coupon \u00ab 25\u201375 bps \u0103 WAC due to:\n1. Servicing fee\n2. Guaranty fees\n3. Excess servicing fee\n\u2022 Discount points \u2013 % of loan upfront fee to borrowers\n\u2022 Subordination \u2013 non-agency credit enhancement; junior bonds absorb losses\nfirst","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"How do rates affect prepayment/duration?","a":"\u2022 Falling interest rates: prepayments \u2191, durations \u2193\n\u2022 Rising interest rates: prepayments \u2193, durations \u2191(\u201cextension\u201d)","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"List 5 factors impacting mortgage prepayment risk.","a":"1. Sale of property\n2. Destruction of property (e.g. fire)\n3. Borrower default\n4. Partial principal prepayments\n5. Refinancing\nPrepayments can be rate-sensitive or rate-insensitive","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"Define SMM, CPR, and the PSA model.","a":"1. SMM (Single Monthly Mortality)\nSMM \u201c Scheduled Bal \u00b4 Actual Bal\nScheduled Bal\n2. CPR (Conditional Prepayment Rate) = annualized SMM\nCPR \u201c 1 \u00b4 p1 \u00b4 SMMq12\n3. PSA Model \u2013 CPRs not constant over loan life\n  \u25e6 CPR \u2191by 0.2% per month until 6.0% in month 30\n  \u25e6 Can express in multiples","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"List 5 mortgage credit risk factors.","a":"1. Credit scores\n2. LTVs\n3. Number of days delinquent\n4. Default (90+ days delinq.)\n  \u25e6 Some agencies insure (Ginnie Mae)\n  \u25e6 Non-agency recoveries depend on foreclosure process\n5. Default loss severity \u2191when:\n  \u25e6 High LTV\n  \u25e6 Appraisal values \u00bf market values\n  \u25e6 Property values \u2193after origination\n  \u25e6 Foreclosure process is expensive","source":"HFIS Ch. 21: Mortgages","reading":"HFIS","chapter":"Ch. 21 \u2013 Mortgages","section":"F"},{"q":"What is an FRA?","a":"FRAs allow a borrower (lender) to lock in a borrowing (lending) rate for a future period\nt \u201c 0\nEnter\nFRA\nt\nTime of\nBorrowing\nrt = ?\nt ` s\nFRA\nMaturity\nBorrowing Period","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"FRA payoff formula?","a":"A borrower enters an FRA to hedge against rising borrowing costs\nThe borrower\u2019s payoff is positive if the actual borrowing rate \u0105 rFRA\nBorrower\u2019s Payoff \u201c\n$\n&\n%\nprt \u00b4 rFRAq \u02c6 Notional\nif paid in arrears\nprt \u00b4 rFRAq\n1 ` rt\n\u02c6 Notional\nif paid at time of borrowing\nThe lender\u2019s payoff is always the negative of the borrower\u2019s\nIf paid at time of borrowing, the payment is \u201ctailed\u201d by the current rate rt","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"How to create synthetic FRA?","a":"Let rt,t`s be the implied forward rate between time t and t ` s\n1 ` rt,t`s \u201c\nPt\nPt`s\nwhere Pt and Pt`s are the current prices of zeros maturing at time t and t ` s\nTo lock in rt,t`s as a borrowing rate:\n1. Short 1 ` rt,t`s zero-coupon bonds maturing at time t ` s\n2. Buy 1 zero-coupon bond maturing at time t\nReverse the long/short position on each bond to lock in a lending rate","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Eurodollar futures for hedging?","a":"To lock in a borrowing (lending) rate, short (buy) Eurodollar futures\nThe payoff on a single short $1M Eurodollar contract with futures price Ft is:\nPayoff \u201c rFt \u00b4 p100 \u00b4 LIBORtqs \u02c6 100 \u02c6 25\n\u201c rp100 \u00b4 rforwardq \u00b4 p100 \u00b4 LIBORtqs \u02c6 100 \u02c6 25\n\u201c rLIBORt \u00b4 rforwards \u02c6 100 \u02c6 25\nThe payoff is positive if LIBOR is higher than the locked-in forward rate\nThe lender\u2019s payoff is always the negative of the borrower\u2019s","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Eurodollar futures vs. FRAs?","a":"Both can be used to lock in borrowing or lending rates\nKey difference: Eurodollar futures systematically favor borrowers\n\u2022 The Eurodollar futures payoff is always at time of borrowing\n\u2022 FRAs can payoff at time of borrowing or arrears\n\u2022 If paid at time of borrowing, FRAs are automatically tailed at current rate\n\u2022 Eurodollar futures can only be tailed at the forward rate (\u201cconvexity bias\u201d)\nPayoff \u201c rFt \u00b4 p100 \u00b4 LIBORtqs \u02c6 100 \u02c6 25\n1 ` rforward","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"LIBOR vs. 3-Month T-Bills?","a":"LIBOR \u0105 Treasury rates because of:\n1. Default premium in LIBOR rates\n2. Higher liquidity premium in LIBOR rates\n3. Market fluctuations that cause spreads to widen\n4. State tax exemption of Treasuries\nLIBOR is far more common for futures contracts\n\u2022 Tracks private lending rates better than T-bills","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Duration formulas?","a":"\u2206B per 1% change in y \u201c B \u02c6\n\u201e\n\u00b4ModDurp\u2206yq ` 1\n2(Convexity)p\u2206yq2\n\u0237\nB \u201c\nn\u00ff\nt\u201c0\nvtCFt\nMacDur \u201c\n\u0159n\nt\u201c0 tvtCFt\nB\nModDur \u201c MacDur \u02c6 v\nAlternative to modified duration: PVBP or \u201cDV01\u201d = ModDur\n100","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Convexity formula?","a":"\u2206B per 1% change in y \u201c B \u02c6\n\u201e\n\u00b4ModDurp\u2206yq ` 1\n2(Convexity)p\u2206yq2\n\u0237\nB \u201c\nn\u00ff\nt\u201c0\nvtCFt\nConvexity \u201c\nn\u0159\nt\u201c0\ntpt ` 1qvt`2CFt\nB","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Describe how a Treasury note futures contract works.","a":"A Treasury note futures contract will specify:\n\u2022 Underlying bond\u2019s YTM and maturity (e.g. 6% 10-year T-note)\n\u2022 Acceptable maturity range of delivered note: e.g. 6.5\u201310 years\n\u2022 Conversion factor: price of delivered note at underlying\u2019s YTM (e.g. 6%)","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Invoice price vs. no-arbitrage price?","a":"Invoice Price \u201c Futures Price at Maturity \u02c6 Conversion Factor ` Accrued Interest\nThe no-arbitrage futures price is\nFutures Price at Maturity \u201c\nPrice of CTD Bond\nConversion Factor of CTD Bond","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"How to find CTD bond?","a":"1. Identify all available bonds falling within the maturity range (6.5\u201310 years)\n2. Calculate the price of each one at the underlying\u2019s YTM (6%)\n  \u25e6 Conversion factor = PV bond CFs at 6% (expressed per dollar)\n  \u25e6 E.g. if the price at 6% is 105, the conversion factor is 1.05\n3. The CTD bond is the bond that results in:\nInvoice Price \u00b4 Futures Price at Maturity \u02c6 Conversion Factor \u201c 0\nThere should only be one bond that satisfies the above; all others will be negative","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Describe repos.","a":"\u2022 Repo \u2013 a sale of a security with a commitment to repurchase it at a specified\nprice at a designated future date\n  \u25e6 The borrower is the one selling the security (receives cash for it)\n  \u25e6 The lender holds the sec
