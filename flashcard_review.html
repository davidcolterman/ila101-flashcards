private and customized\n\u2022 Futures like forwards but standardized and traded on exchanges\nPayoff: Contract value at maturity (can be positive or negative)\n\u2022 Long position payoff = ST \u00b4 F\n\u2022 Short position payoff = F \u00b4 ST","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"How do call and put options work?","a":"\u2022 Call option: Gives buyer option to buy S at strike (K) by set date\n  \u25e6 Long call payoff = pST \u00b4 Kq`\n\u2022 Put option: Gives buyer option to sell S at strike (K) by set date\n  \u25e6 Long put payoff = pK \u00b4 STq`\n\u2022 Short side: Negative payoff if long side exercises\n  \u25e6 Else, short\u2019s gain = premium received\n\u2022 European options: Exercisable only at maturity\n  \u25e6 Path-independent: Payoff depends only on S at maturity\n  \u25e6 Includes PTP FIAs\n\u2022 American options: Exercisable anytime up to maturity\n  \u25e6 Path-dependent: Payoff depends on S before maturity\n  \u25e6 Includes cliquet and HWM FIAs","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Define arbitrage and no-arbitrage pricing.","a":"Arbitrage = trading strategy that:\n1. Begins with no money\n2. Zero probability of losing money\n3. Positive probability of making money\nNo-arbitrage principle or law of one price \u2013 two transactions with equivalent CFs\nshould have same price\n\u2022 In efficient market, arbitrage shouldn\u2019t exist\nNo-arbitrage forward price: F \u201c SterpT\u00b4tq\n\u2022 If F \u0105 SterpT\u00b4tq, borrow to buy asset; enter short side of forward\n\u2022 If F \u0103 SterpT\u00b4tq, shortsell asset; enter long side of forward","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Binomial tree discrete time pricing model?","a":"Binomial model assumptions\n\u2022 Only two assets: risky (St) and risk-free (Bt) earning r\n\u2022 St can go up by factor u or down by factor d with real-world probabilities:\nPrrSt`1 \u201c uSts \u201c p \u201c 1 \u00b4 q\nPrrSt`1 \u201c dSts \u201c q \u201c 1 \u00b4 p\n\u2022 d \u0103 er \u0103 u (else arbitrage exists)\n\u2022 Self-financing: no external CFs needed\n  \u25e6 No transaction costs\n  \u25e6 Unlimited borrowing/selling/shortselling/buying\nTwo equivalent methods for binomial option pricing:\n1. Replication portfolio method\n2. Risk-neutral probability method","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Single period replication portfolio method?","a":"Goal: Construct portfolio (X0) replicating option\u2019s payoffs in one period\nS0\nuS0\ndS0\nStock Price\nV0\nV1puq\nV1pdq\nOption\nX0 \u201c B0e\u00b4r ` \u22060S0\nB0 ` \u22060uS0\nB0 ` \u22060dS0\nReplication Portfolio\nwhere V1 \u201c pS1 \u00b4 Kq` for call or pK \u00b4 S1q` for put\nKey steps to calculate option price:\n1. Set V1puq \u201c B0 ` \u22060uS0 and V1pdq \u201c B0 ` \u22060dS0\n2. Solve for \u22060 \u201c V1puq\u00b4V1pdq\nS0pu\u00b4dq\n= portion of S to hold (\u201ddelta\u201d)\n3. Solve for B0 \u201c V1puq \u00b4 \u22060uS0 or B0 \u201c V1pdq \u00b4 \u22060dS0\n4. No-arbitrage option price = V0 \u201c X0","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Single period risk-neutral probability method?","a":"Suppose we can express S0 as risk-free PV of special expected value:\nS0 \u201c e\u00b4r \u02dcErS1s\n\u201c e\u00b4rr\u02dcpuS0 ` \u02dcqdS0s\n\u201c e\u00b4rr\u02dcpuS0 ` p1 \u00b4 \u02dcpqdS0s\n\u02dcp and \u02dcq = risk-neutral (RN) probabilities (\u2030 RW probabilities p and q)\n\u02dcp \u201c er \u00b4 d\nu \u00b4 d\nand\n\u02dcq \u201c 1 \u00b4 \u02dcp \u201c u \u00b4 er\nu \u00b4 d\nThis allows expressing no-arbitrage price as:\nV0 \u201c e\u00b4r \u02dcErV1s \u201c e\u00b4rr\u02dcpV1puq ` \u02dcqV1pdqs\nUnder RN framework, all assets expected to yield risk-free rate\nB1 \u201c B0er\n\u02dcErS1s \u201c S0er\n\u02dcErV1s \u201c V0er","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Multi-period risk-neutral probability method?","a":"V0\nV1puq\nV1pdq\nV2pu, dq\nV2pu, uq\nV2pd, dq\nS0\nuS0\ndS0\nudS0\nu2S0\nd2S0\nWork backwards using single period equations:\n1. At time 1: Solve for 2 possible values of V1\nV1puq \u201c e\u00b4r\u201c\u02dcpV2pu, uq ` \u02dcqV2pu, dq\n\u2030\nV1pdq \u201c e\u00b4r\u201c\u02dcpV2pd, uq ` \u02dcqV2pd, dq\n\u2030\n2. At time 0: Solve for option price:\nV0 \u201c e\u00b4r\u201c\u02dcpV1puq ` \u02dcqV1pdq\n\u2030","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Black-Scholes framework assumptions?","a":"Black-Scholes assumptions similar to binomial model:\n\u2022 Two assets: risky St and risk-free Bt earning r\n\u2022 St is continuous variable: follows geometric Brownian motion\n\u2022 Self-financing: no external CFs needed\n  \u25e6 No transaction costs\n  \u25e6 Unlimited borrowing/selling/shortselling/buying\nRN formulas for options/derivatives based on \u201dFeymann-Kac formula\u201d\nfpt, xq \u201c Ere\u00b4rpT\u00b4tqhpXTq|Xt \u201c xs\nwhere:\n\u2022 fpt, xq = value at time t when state variable X has value x\n\u2022 hpXTq = payoff function at maturity","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Black-Scholes RN price for forwards?","a":"No-arbitrage cost to enter forward at inception date t:\nfpt, Stq \u201c St \u00b4 Fe\u00b4rpT\u00b4tq \u201c 0\nCost of forward at any point after inception:\nfpt, Stq \u201c St \u00b4 Fe\u00b4rpT\u00b4tq","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Black-Scholes RN price for calls and puts?","a":"No-arbitrage prices of European call and put:\nct \u201c \u02dcEre\u00b4rpT\u00b4tqpST \u00b4 Kq`|St \u201c ss\npt \u201c \u02dcEre\u00b4rpT\u00b4tqpK \u00b4 STq`|St \u201c ss\n\u201c s\u03a6pd1q \u00b4 Ke\u00b4rpT\u00b4tq\u03a6pd2q\n\u201c Ke\u00b4rpT\u00b4tq\u03a6p\u00b4d2q \u00b4 s\u03a6p\u00b4d1q\nwhere:\n\u03a6pzq \u201c standard normal CDF and \u03a6p\u00b4zq \u201c 1 \u00b4 \u03a6pzq\nd1 \u201c\nlnps{Kq `\n\u00b4\nr ` \u03c32\n2\n\u00af\npT \u00b4 tq\n\u03c3\na\npT \u00b4 tq\nd2 \u201c d1 \u00b4 \u03c3\na\npT \u00b4 tq\nPut-call parity relates call and put prices:\nct \u00b4 pt \u201c s \u00b4 Ke\u00b4rpT\u00b4tq","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"How to calculate distributable earnings on traditional income statement?","a":"1. Calculate Pre-Tax Book Profit = Revenues \u00b4 Expenses \u00b4 Benefits\n  \u25e6 Revenues = Premium + InvInc + Policy Fee Income\n  \u25e6 Expenses = Admin Expenses + Commissions + GMDB Cost\n  \u25e6 Benefits = Death Claims + Annuitizations + Surrender Benefits + \u2191Resv + GMDB\nBenefit\n2. Calculate After-Tax Book Profit = Pre-Tax Book Profit \u00b4 Tax\n  \u25e6 Tax = Tax Rate \u02c6 Pre-Tax Book Profit\n3. Calculate \u2191Target Surplus = EOY Targ Surplus \u00b4 BOY Targ Surplus\n  \u25e6 EOY Targ Surplus = Targ Surplus Rate \u02c6 EOY Resv\n  \u25e6 BOY Targ Surplus = Previous Year EOY Targ Surplus\n4. Calculate After-Tax Interest on Targ Surplus = BOY Targ Surplus\n\u02c6Surplus Int Rate \u02c6 (1 \u00b4 Tax Rate)\n5. Calculate Distributable Earnings = After-Tax Book Profit \u00b4 \u2191Targ Surplus `\nAfter-Tax Interest on Targ Surplus","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Distributable earnings \u2013 simpler income statement (review back).","a":"Pre-Tax Book Profit = Revenues \u00b4 Expenses \u00b4 GMDB Benefit\n\u2022 Revenues = Surrender Charges + Policy Fee Income + Risk Charges\n\u2022 Expenses = Admin Expenses + Commissions + GMDB Cost\nAll other steps same as traditional income statement method","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Three key profit measures in actuarial pricing?","a":"1. Net present value (NPV) of distributable earnings\n  \u25e6 Discount rate = hurdle rate\n  \u25e6 NPV \u0105 0 suggests net profit for insurer; else net loss\n2. IRR = discount rate making NPV = 0\n  \u25e6 If IRR \u0105 hurdle rate, project expected to be profitable\n3. Profit margin (PM)\nPM \u201c\nNPV\nPV of premiums\nor\nPM \u201c\nNPV\nPV of Revenues\nFirst-year strain: Large deficit in first year\nLimitation for ELI: Typically considers only one economic scenario\n\u2022 Monte Carlo simulations ideal","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"Compare actuarial vs. no-arbitrage pricing.","a":"\u2022 Actuarial pricing: based on quantile of profit under RW measure\n  \u25e6 Includes all relevant RW CFs\n  \u25e6 Aims for positive NPV in certain % of RW scenarios: PrrNPV \u0105 0s \u0105 \u03b1\n  \u25e6 Mirrors portfolio percentile premium principle\n\u2022 No-arbitrage pricing: based on expected profit under RN measure\n  \u25e6 Ignores expenses, surrender charges, taxes\n  \u25e6 Expected profit = \u02dcErLs \u201c 0\n  \u25e6 Mirrors equivalence premium principle\n  \u25e6 Rarely used in practice","source":"ICRMELI Ch. 4: Pricing and Valuation","reading":"ICRMELI","chapter":"Ch. 4 \u2013 Pricing and Valuation","section":"C"},{"q":"GMAB cash flow profile and impact of fund return?","a":"\u2022 Policyholder Cash Flows:\n  \u25e6 Before maturity: Withdrawals/DB per decrement rate\n  \u25e6 At maturity: gets max(FV, GMAB)\n\u2022 Insurer Cash Flows:\n  \u25e6 Year 1: Negative from initial expenses\n  \u25e6 Year 2+ before maturity: Positive from M&E and GMAB rider fees\n  \u25e6 At maturity: pays max(GMAB \u00b4 FV, 0)\n\u2022 Positive PV of insurer CFs \u2192insurer profitable\n\u2022 Impact of Fund Return:\n  \u25e6 Lower assumed fund return \u2192\u2191likelihood of GMAB payout\n  \u25e6 Very poor (negative) returns \u2192large insurer losses\n  \u25e6 GMAB payout can far exceed rider revenue in bad scenarios\n  \u25e6 Risk not diversifiable like mortality risk","source":"ILA101-115: Simulation of a GMAB","reading":"ILA101-115: Simulation of a GMAB","chapter":null,"section":"C"},{"q":"How do puts hedge a GMAB?","a":"Key takeaway: Hedging significantly stabilizes insurer CFs but at a cost\n\u2022 Since GMAB = put option, insurer can hedge with put option\n\u2022 In scenarios triggering GMAB payout, put option also pays off\n\u2022 Put proceeds help offset GMAB payout\n\u2022 Put premium = additional insurer expense\n\u2022 Some volatility remains since fee income sensitive to fund performance","source":"ILA101-115: Simulation of a GMAB","reading":"ILA101-115: Simulation of a GMAB","chapter":null,"section":"C"},{"q":"GMAB hedge put option parameters (review back)","a":"n \u201c same term as GMAB\nK \u201c CurrentIndex \u02c6\nGMAB\nPremium \u02c6 p1 \u00b4 mqn\nNotional \u201c Premium \u02c6 p1 \u00b4 wqn\nCurrentIndex\nTotal Put Cost \u201c Notional \u02c6 Black-Scholes Put Price\nwhere:\n\u2022 m = total fee = M&E fee + GMAB rider fee\n\u2022 K = strike price of single put option on index\n  \u25e6 m \u2192higher strike price (\u2191probability of payoff)\n\u2022 Notional = number of put options needed\n  \u25e6 Reduced since some PHs lapse (w) before GMAB exercised\n\u2022 Black-Scholes Put Price = price of put on just one unit of index","source":"ILA101-115: Simulation of a GMAB","reading":"ILA101-115: Simulation of a GMAB","chapter":null,"section":"C"},{"q":"Considerations for stochastic simulation of GMAB?","a":"Problem: Closed-form solutions usually don\u2019t exist (PH behavior, etc.)\nMonte Carlo simulations usually more practical\n\u2022 Involves simulating 1000s of RN or RW scenarios\n\u2022 Strength of RN: more accurate for pricing (cost of hedging)\n  \u25e6 Average value more accurate than RW approach\n  \u25e6 Monte Carlo RN average price \u2192Black-Scholes price if enough simulations\n\u2022 Strength of RW: provides meaningful distribution of results to analyze\n  \u25e6 Shows asymmetry: most scenarios profitable, but unprofitable scenarios can be very\nbad\n  \u25e6 Not as accurate as RN since assumed fund return \u0105 risk-free rate","source":"ILA101-115: Simulation of a GMAB","reading":"ILA101-115: Simulation of a GMAB","chapter":null,"section":"C"},{"q":"Popularity of guaranteed living withdrawal benefits vs. other GLBs?","a":"\u2022 GLWB and GMIB most popular by far\n  \u25e6 90% of VA GLBs = GLWB or GMIB\n  \u25e6 GLWB has highest sales growth (most premium year 1)\n  \u25e6 GLWB significantly more popular than non-lifetime version (GMWB)\n\u2022 GLWB and GMIB have highest persistency (very low surrender rates)\n\u2022 GMAB popular with younger buyers","source":"VA Guaranteed Living Benefits Utilization","reading":"VA Guaranteed Living Benefits Utilization","chapter":null,"section":"C"},{"q":"4 inter-connected relationships for GLWB and GMIB utilization?","a":"1. When withdrawals start (age and source of funding most significant)\n  \u25e6 After age 70, withdrawals \u2191with age and duration\n  \u25e6 2/3 of contracts funded with qualified money (tax-favored retirement funds)\n2. Method of withdrawals (SWPs most significant)\n  \u25e6 SWPs popular for lifetime benefits and older owners (65+)\n  \u25e6 Withdrawals usually continue once started (low surrenders)\n3. Amount of withdrawal taken\n  \u25e6 Most owners take max allowed by contract (e.g. 4% of benefit base/year)\n  \u25e6 Younger owners more likely to exceed max\n  \u25e6 ITM has little to no effect\n4. Surrender rates \u2013 factors \u2192low surrenders:\n  \u25e6 Older owners (65+) in general\u2014even lower if taking withdrawals\n  \u25e6 Younger owners not taking withdrawals yet\n  \u25e6 SWPs have lower surrenders than non-systematic\n  \u25e6 Withdrawal amount \u00ab 100% of max (not too far below/above)\n  \u25e6 Higher ITM \u2192lower surrenders\n  \u25e6 Still in surrender charge period (higher lapse when exiting)","source":"VA Guaranteed Living Benefits Utilization","reading":"VA Guaranteed Living Benefits Utilization","chapter":null,"section":"C"},{"q":"Action steps and issues for pricing VA GLBs?","a":"1. Expect high utilization of lifetime benefits (hence low lapses)\n  \u25e6 Many used to fund retirement\n  \u25e6 GLB riders popular\n2. Qualified money has highest withdrawal risk\n3. Withdrawal activity can predict surrender activity\n4. Modeling GLB utilization important, especially for lifetime options","source":"VA Guaranteed Living Benefits Utilization","reading":"VA Guaranteed Living Benefits Utilization","chapter":null,"section":"C"},{"q":"Product design comparison of popular VA GLBs?","a":"1. GLWB\n  \u25e6 Lifetime benefits available ages 50\u201399 (usually 50s\u201380s)\n  \u25e6 Median max withdrawal allowed = 4%\n  \u25e6 Benefit base usually reduced proportionally for excess withdrawals\n2. GMIB\n  \u25e6 Most common design: roll-up or max(roll-up, ratchet)\n  \u25e6 Most are B-share (have SCs)\n  \u25e6 Annuitization rates extremely low (\u0103 1%), but \u2191with age, size, and ITM\n3. GMAB\n  \u25e6 Most common benefit base design: 100% of premiums paid in\n  \u25e6 Typical waiting period: 10+ years\n4. GMWB\n  \u25e6 Differences with GLWB\n  \u25e6 No automatic \u2191to benefit base if delay withdrawals\n  \u25e6 No cap on benefit base","source":"VA Guaranteed Living Benefits Utilization","reading":"VA Guaranteed Living Benefits Utilization","chapter":null,"section":"C"},{"q":"Basic Reinsurance Terminology (review back of card)","a":"\u2022 Reinsurance: Insurance on some/all of an insurer\u2019s risks\n\u2022 Ceding Company (CC): Insurer that cedes risks to reinsurer\n  \u25e6 Aka direct insurer or cedant\n\u2022 Reinsurer: Insurer that accepts (assumes) risk from CC\n\u2022 Treaty: Legal agreement between CC and reinsurer\n\u2022 Retention: Amount of risk CC retains (does not cede)\n\u2022 Retrocessionaire: Reinsurer that accepts risk from another reinsurer\n\u2022 Cession: Portion of risk transferred to reinsurer\n\u2022 Retrocession: Portion of risk transferred from reinsurer to retrocessionaire","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"A Brief History of Reinsurance (review back of card)","a":"\u2022 Ancient origins (BCE)\n  \u25e6 Risk spreading on Chinese merchant ships, Babylonian maritime loans\n  \u25e6 Greeks/Romans included risk fees on maritime loans\n\u2022 Medieval times\n  \u25e6 First insurance contract (1298), reinsurance contract (1370, marine)\n  \u25e6 Term \u201creinsurance\u201d first used in Florence (1457)\n\u2022 Modern developments\n  \u25e6 18th-century England legislation strengthened insurable interest\n  \u25e6 19th-century fires spurred fire insurance, founding of reinsurers (e.g., Swiss Re)\n  \u25e6 US life reinsurance began with American Central Life (1904)\n\u2022 Post-WWII to early 21st century\n  \u25e6 Reinsurance expanded post-WWII; N. American reinsurers \u00d3 since 1990s\n  \u25e6 Remains vital in life/health, growing use in annuities","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare recurring vs. portfolio reinsurance","a":"\u2022 Recurring: Agreements on new policies\n\u2022 Portfolio: Agreements to cede significant portions of inforce policies (aka block\nreinsurance)","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare indemnity vs. assumption reinsurance","a":"Indemnity (most common):\n\u2022 Reinsurer reimburses CC for claims share\n\u2022 No contractual relationship with p/h\n\u2022 CC remains liable even if reinsurer defaults\n\u2022 May include recapture provisions\nAssumption:\n\u2022 Reinsurer becomes directly liable to p/h\n\u2022 CC no longer liable\n\u2022 Requires novation (contract replacement)\n\u2022 P/h must agree, receive assumption certificates","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare proportional vs. non-proportional reinsurance","a":"Proportional: Responsibility based on benefit known in advance\n\u2022 Most common for life/health\n\u2022 Coinsurance: Proportional sharing of risks/terms\n\u2022 Mod-Co: Like coinsurance, CC retains reserves\n  \u25e6 Reinsurer pays reserve \u00d2 net of inv income\n\u2022 YRT: Transfers only mortality/morbidity risk in NAR\nNon-proportional: Liability depends on claims incurred\n\u2022 More common for unpredictable claims (P&C)\n\u2022 Stop Loss: Covers losses \u0105 attachment point\n\u2022 Catastrophe: High-severity, low-frequency events","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare automatic vs. facultative reinsurance","a":"\u2022 Automatic: Risks exceeding retention that meet UW criteria are automatically\nceded\n  \u25e6 CC must cede, reinsurer must accept\n\u2022 Facultative: CC may choose to cede or not\n  \u25e6 Reinsurer must approve each risk\n\u2022 Variations:\n  \u25e6 Conditional automatic: Reinsurer provides UW service\n  \u25e6 Facultative obligatory: Reinsurer can only decline if it hits full retention on that\nindividual","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare excess treaty vs. quota share reinsurance","a":"\u2022 Excess treaty: Covers risks based on scheduled retention limits\n\u2022 Quota share: Fixed % of each risk is ceded\n  \u25e6 Typically applies to first dollar of coverage\n  \u25e6 Can be combined with excess risk management","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare experience rated vs. non-experience rated reinsurance","a":"\u2022 Experience Rated: CC shares in reinsurer profits via experience refund\n  \u25e6 Higher reinsurance premiums\n\u2022 Non-Experience Rated: More common today","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare traditional vs. financial reinsurance","a":"\u2022 Traditional: Primary purpose is risk transfer\n\u2022 Financial: Primary purpose is specific business objective (e.g., surplus \u00d2, tax\n\u00d3, acquiring blocks), risk transfer secondary\n  \u25e6 Distinctions may require close examination of risks transferred","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"List uses of reinsurance","a":"Risk management:\n\u2022 Mortality/morbidity transfer\n\u2022 Lapse/surrender transfer\n\u2022 Investment risk transfer\nBusiness/financial strategy:\n\u2022 New business financing, UW assistance\n\u2022 Entering new markets, M&A, divesting product lines\n\u2022 Optimizing admin functions\n\u2022 Reinsurer returns/inforce \u00d2\n\u2022 Surplus management/optimization\n\u2022 Redundant reserve management","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How can reinsurance transfer risk?","a":"Mortality/morbidity (oldest, most common):\n\u2022 Life: Excess/QS treaties; retention limit key to limiting insolvency\n\u2022 Deferred annuities: Usually % of fund reinsured\n\u2022 Payout annuities: Rare (flat retention or QS)\nLapse/surrender (relevant when):\n\u2022 Significant first-year strain\n\u2022 Premiums \u00d2 sharply\n\u2022 Level premiums, claims \u00d2\n\u2022 Anti-selection/disintermediation from high lapses\nInvestment:\n\u2022 Leverage reinsurer capabilities, limit concentrations\n\u2022 Common with coinsurance/mod-co","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How does reinsurance aid new business/market entry?","a":"\u2022 New business financing: Relieves surplus strain\n\u2022 UW assistance: Manuals, training, audit, difficult case review\n\u2022 Market entry: Expertise on products, regulation, business lines\n\u2022 Fronting: Direct insurer issues policies, reinsures substantially all risk\n  \u25e6 Reinsurer handles admin\n  \u25e6 Common in P&C/A&H; rare for ILA/health","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Why might CC cede large portions of new business?","a":"\u2022 Low marginal cost (reinsurer\u2019s lower expenses or different assumptions)\n  \u25e6 Small profit \u0105 no profit\n\u2022 Allows writing larger policies\n\u2022 UW gains experience from reinsurer\n\u2022 Recapture provisions \u2192future profit \u00d2","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How does reinsurance relate to divestiture, M&A, and admin optimization?","a":"\u2022 Divesting product line: Exit lines/areas, reallocate capital, simplify admin,\noverhead \u00d3\n\u2022 M&A: Transfer blocks or sell/purchase companies\n  \u25e6 Assumption typically used for permanent sales; indemnity sometimes preferred\n\u2022 Admin optimization:\n  \u25e6 Cede business \u2192admin burden \u00d3\n  \u25e6 Assume business \u2192use excess admin capacity","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How does reinsurance benefit reinsurers?","a":"\u2022 Returns \u00d2: Assume business for profit and ROI\n\u2022 Inforce \u00d2: Leverage under-utilized admin capacity, spread overhead, augment\ndirect sales","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"What is the purpose of producer-owned reinsurance companies (PORCs)?","a":"\u2022 Substantial reinsurance volume ceded to PORCs\n\u2022 Allows high-producing agent groups to participate in earnings\n\u2022 Agent loyalty \u00d2, rewards high production","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How does reinsurance optimize surplus and fund redundant reserves?","a":"Surplus optimization:\n\u2022 Fund acquisition costs from high sales\n\u2022 Meet RBC/statutory/rating requirements\n\u2022 Replenish surplus post-poor experience\n\u2022 Meet dividend/debt service objectives\nSPVs (form of captive):\n\u2022 Raise capital, mitigate risks via securitization\n\u2022 Securitization = selling cash flow streams (premiums, claims)\n\u2022 Major use: Fund redundant XXX/AXXX reserves","source":"Tiller Ch. 1: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 1 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Describe YRT reinsurance and which products it suits.","a":"Reinsures mortality/morbidity risk only\nCC pays:\n\u2022 Reins premium to reinsurer\n\u2022 All p/h benefits and expenses\nReinsurer pays:\n\u2022 Reinsured claims (reimburses CC)\n\u2022 Expense allowance\nCC takes small ceded reserve credit (= unearned YRT premium)\nGood for:\n\u2022 Term, WL, UL (mortality)\n\u2022 Disability, LTCI, critical illness (morbidity)\nNot good for:\n\u2022 Lapse/investment risk transfer\n\u2022 Annuities\nProvides little surplus relief vs. coinsurance","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How is ceded NAR calculated under YRT?","a":"NAR = Face \u00b4 Terminal Reserve (or per treaty definition)\n\u2022 Calculated at policy level\n\u2022 Ignore deficiency reserves\n\u2022 YRT Premiums = YRT Rates \u02c6 Ceded NAR\n\u2022 Ceded DB = Reinsurer\u2019s NAR share\n\u2022 NAR must be well documented in treaty\n  \u25e6 Companies agree on method\n  \u25e6 DB in calculation = DB paid on death\n  \u25e6 NAR used \u00ab actual NAR\nTotal\nFace\ntVx\nNAR","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"List 4 YRT retention methods.","a":"1. Pro Rata (preferred)\n  \u25e6 Constant reinsured % = Orig Face Ceded\nTotal Orig Face\n  \u25e6 \u00d1 Very small reins amounts in later durations\n2. Level/Constant Retention\n  \u25e6 CC retains fixed NAR amount\n  \u25e6 Reinsured NAR \u00d3 over time\n3. Constant Risk Reinsured (rare)\n  \u25e6 Reinsured amount = constant\n  \u25e6 Retained NAR \u00d3 over time\n4. Formula Retention\n  \u25e6 NAR and retention per agreed formula","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How are YRT reinsurance premiums calculated?","a":"ReinsPrem \u201c YRT Rate \u02c6 Ceded NAR\n1000\n` Cession Fee\n\u2022 YRT premium rate = multiple of mortality table\n  \u25e6 Vary by age, duration, sex, UW class\n  \u25e6 Select periods common (e.g., 15 years)\n\u2022 May have zero first-year premium (ZFT)\n\u2022 Calendar year scales avoid year-end reins reserves\n\u2022 Substandard ratings:\n  \u25e6 Table rating: \u00d2 by multiple (e.g., 150%)\n  \u25e6 Flat extra: May have allowance on extra premium\n\u2022 Riders: Accidental death may be reinsured separately, term riders use base\n\u2022 Monthly renewable term (MRT) for UL: YRT done monthly","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Describe coinsurance and compare to YRT.","a":"Reinsurer has proportionate share of:\n\u2022 Direct p/h premium\n\u2022 Direct reserve\n\u2022 All benefits (mortality, morbidity, lapse, surrender, investment)\nvs. YRT:\n\u2022 Cedes more premium, reserves, benefits\n  \u25e6 Reinsurer must track all these\n  \u25e6 EAs more complicated\n\u2022 Can be used for any insurance/annuities\n\u2022 More surplus relief than YRT\n\u2022 Passes deficiency reserves to reinsurer","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How are coinsurance premiums calculated? List approaches for banded premiums.","a":"ReinsPrem \u201c (Amount Ceded Per 1000) \u02c6 (GP Per 1000)\nApproaches for banded premiums:\n1. Simplest\n  \u25e6 Use actual GP per policy\n  \u25e6 Common allowances for all bands\n2. More equitable (more complicated)\n  \u25e6 Use actual GP per policy\n  \u25e6 Vary allowances by band\n3. Single band\n  \u25e6 Use GP for specific band regardless of actual\n  \u25e6 One set of allowances for all policies","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Describe variations in coinsurance expense allowances.","a":"\u2022 Allowance = % of ceded premium\n\u2022 Uniquely developed per product\n\u2022 Varies by duration, sex, risk class, band, etc.\n  \u25e6 Based on reinsurer profit objectives\n\u2022 Premium tax methods:\n  \u25e6 Most common: Reinsurer includes provision in basic allowance\n  \u25e6 Reimburse exact amount (challenging)\n  \u25e6 Pay fixed amount as proxy","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How are the following treated under coinsurance:\n\u2022 Policy fee\n\u2022 Policyholder dividends\n\u2022 Policy loans","a":"\u2022 Policy fee: May be fully retained by CC\n  \u25e6 Reinsurer may coinsure so it\u2019s included in deficiency reserve\n\u2022 P/h dividends: Reinsurer may or may not participate\n  \u25e6 If no participation \u00d1 asset mgmt challenges for CC\n\u2022 Policy loans: No reinsurer participation ever\n\u2022 Substandards and riders treated similarly to YRT","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"Compare mod-co to regular coinsurance.","a":"Mod-co = coinsurance except:\n1. CC retains assets backing ceded reserves\n2. No ceded reserve credit on CC balance sheet\n3. No reinsured reserve on reinsurer balance sheet\n4. Reinsurer pays mod-co adjustment to CC\n  \u25e6 Main complexity vs. coinsurance\nAdvantages vs. coinsurance:\n\u2022 CC has more investment control\n\u2022 Good for interest-sensitive liabilities, p/h dividends\n\u2022 More assets for policy loans\n\u2022 Good when reinsurer offshore/unauthorized\n  \u25e6 No reserve credit questions","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"How is the mod-co adjustment calculated?","a":"Positive mod-co adjustment = payment by reinsurer\nMod-co adjustment =\nEnding ceded stat reserves\n\u00b4 Beginning ceded stat reserves\n\u00b4 \u201cInterest\u201d on beginning ceded stat reserves\nMod-co interest rate must be clearly defined in treaty\n\u2022 Should ensure reinsurer participates in total asset performance\n  \u25e6 Asset defaults, capital gains/losses, timing risks, inv income\n\u2022 Not simple interest rate in practice\n\u2022 Governed by NAIC Life & Health Reins Agreements Model Reg","source":"Tiller Ch. 4: Basic Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 4 \u2013 Basic Methods of Reinsurance","section":"D"},{"q":"List goals and advantages of advanced reinsurance.","a":"Goals:\n1. Surplus relief to CC\n2. Reduce asset transfers between companies\nAdvantages for CC:\n1. Allow ceded reserve credit for non-admitted reinsurers\n2. Improve security of ceded reserve credit\n3. Coordinate asset mgmt for asset-sensitive liabilities\n4. Minimize capital gains/losses at inception\n5. Easier recapture (minimizes capital gains/losses)","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"How is the outstanding surplus account calculated?","a":"OSA tracks reinsurer\u2019s investment in CC\nOSAt \u201c OSAt\u00b41 ` StatGaint \u00b4 i \u02c6 OSAt\u00b41 \u00b4 RiskCharget\n\u2022 StatGain = reinsurer\u2019s gain from operations (profit)\n  \u25e6 Initial OSA = Initial Stat Gain \u0103 0\n\u2022 i \u02c6 OSAt\u00b41 = inv income on beginning OSA\n\u2022 RiskCharge = % of beginning OSA\nOSA calculation same for all methods","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"Compare advanced reinsurance forms regarding:\n\u2022 Reinsurer holds reserve?\n\u2022 CC takes reserve credit?\n\u2022 Reinsurer holds assets backing ceded reserves?\n\u2022 Reinsurer owns performance of assets?\n\u2022 Calculate mod-co adjustment?\n\u2022 Establish FW balance instead of exchanging cash?\n\u2022 Establish FW balance for initial allowance only?\n\u2022 Complies with state laws?","a":"1.\n2.\n3.\n4.\nCoins.\nMod-Co\nFW-Co\nFW-Mod-Co\nReinsurer holds reserve\nYes\nNo\nYes\nNo\nCeding company takes reserve credit\nYes\nNo\nYes\nNo\nReinsurer holds assets backing ceded reserves\nYes\nNo\nNo\nNo\nReinsurer owns performance of assets\nYes\nNo\nYes\nYes\nCalculate mod-co adjustment\nNo\nYes\nNo\nYes\nEstablish a FW balance instead of exchanging cash\nNo\nNo\nYes\nYes\nEstablish a FW balance for initial allowance only\nNo\nNo\nNo\nYes\nComplies with state laws\nYes\nYes\nYes\n?\n5. Part-co is a blend of regular coinsurance and mod-co","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"Compare reinsurance report vs. FW balance calculation.","a":"Net Cash Due to Reinsurer =\nCeded premium\n\u00b4 Allowances\n\u00b4 Ceded benefits\n\u00b4 Mod-co adjustment (if any)\n\u00b4 Experience refund (if any)\nEOY FW Balance = BOY FW Balance\n` Ceded premium\n\u00b4 Allowances\n\u00b4 Ceded benefits\n\u00b4 Mod-co adjustment (if any)\n\u00b4 Experience refund (if any)\n\u00b4 Risk charge\nFW arrangement: No cash transferred between companies (except risk charge may be\npaid in cash)","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"Compare FW coinsurance vs. regular coinsurance.","a":"Differences:\n1. No cash exchanged at inception/renewal\n2. Net cash owed \u00d1 accounts payable/receivable\n  \u25e6 Net cash owed \u0105 0 \u00d1 accounts payable liability\n  \u25e6 Otherwise \u00d1 accounts receivable asset\n  \u25e6 One company\u2019s receivable = other\u2019s payable\n3. Assets stay with CC (like mod-co)\n  \u25e6 But CC shows ceded reserve credit (like regular coinsurance)\n  \u25e6 FW balance adjusted for interest on retained assets\n  \u25e6 Authors include ceded interest in ceded premium\n4. Alternative OSA calculation for FW:\nOSAt \u201c OSAt\u00b41 ` CededPremt\n\u00b4 CededBent \u00b4 CededResIncrt \u00b4 ExperienceRefundt \u00b4 RiskCharget","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"Describe FW mod-co.","a":"Tip: Think of it as \u201callowance retained mod-co\u201d\nFW-Mod-Co = mod-co except:\n\u2022 Reinsurer retains initial allowance\n\u2022 Reinsurer\u2019s initial FW liability = initial allowance\n\u2022 CC\u2019s initial FW asset = initial allowance\nFW-Mod-Co may violate state laws\n\u2022 State laws usually require quarterly settlement\n\u2022 May be possible to get approval","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"Describe part-co.","a":"Part-co = blend of regular coinsurance and mod-co\n\u2022 Main advantages:\n  \u25e6 Eliminates/minimizes cash transfer\n  \u25e6 No FW balance to track\n\u2022 Cash owed by each party cancels at inception:\n  \u25e6 Initial coinsurance reserve = initial allowance\n  \u25e6 Remaining reserves are mod-co reinsured\n\u2022 Co/mod-co split adjusted in renewals to minimize cash flow:\n  \u25e6 Generally, stat profits \u00d3 coinsurance portion\n  \u25e6 Could be designed so coinsurance portion = reinsurer\u2019s outstanding investment\n\u2022 Disadvantages:\n  \u25e6 Very complicated to administer/understand\n  \u25e6 Regulators may be concerned about \u00d2 coinsurance portion\n  \u25e6 Must calculate stat gain twice: preliminary then final","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"What are SPV objectives?","a":"\u2022 SPV owner = \u201csponsor\u201d (reinsurer, direct insurer, or parent)\n\u2022 Sponsor objectives: Fund redundant reserves with low-cost capital\n  \u25e6 Allows other capital for higher risk (higher returns)\n  \u25e6 Redundant Reserves = Total Stat Reserves \u00b4 Economic Reserves\n  \u25e6 Total Stat Reserves = Basic Stat Reserve + XXX Reserves\n  \u25e6 Economic Reserves = GAAP BenRes \u00b4 DAC\n  \u25e6 Should emerge from cash flows without additional funding\n\u2022 Investor objectives: Low-risk investment\n  \u25e6 Low loss possibility\n  \u25e6 Willing to accept low return (low risk)\n  \u25e6 Investors: Bondholders or bank issuing LOC","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"Describe SPV capital structure.","a":"\u2022 \u201cRequired Capital\u201d = capital contributed by sponsor\n  \u25e6 Greater of min regulatory capital and capital required by investors\n  \u25e6 May not tie to regulatory/rating agency capital\n\u2022 Economic Reserves + Required Capital\n  \u25e6 Should fund claims/expenses even under adverse developments\n  \u25e6 Higher RC = less risk for investors\n  \u25e6 If RC too high \u00d1 SPV may not be viable","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"List the 3 trust types in typical securitization SPV model.","a":"Captive (SPV)\nEconomic Reserve Trust\n(100% Coinsurance Cash Flows)\nCapital Account Trust\n(Parent\u2019s RC Paid-In)\nRedundant Reserve Trust\n(Investor Cash or LOC)\nInvestors\n(Or a Bank)\nParent (Sponsor)\n(Re)Insurer\nLosses","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"List steps for structuring an SPV.","a":"1. Sponsor forms captive, contributes RC\n2. If issuing bonds, document:\n  \u25e6 Restrictions on use of funds\n  \u25e6 Delineation between reserve/capital requirements\n  \u25e6 Investor funds used only after reserves/RC\n  \u25e6 How/when dividends, cash, etc. may be paid to sponsor\n  \u25e6 Any experience refunds\n  \u25e6 Interest payment on bonds\n  \u25e6 Repayment of initial principal\n3. Place funds in 3 trusts:\n  \u25e6 Redundant reserve trust\n  \u25e6 Capital account trust\n  \u25e6 Economic reserve trust","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"List SPV investor considerations.","a":"\u2022 SPVs expensive to establish: Requires sufficient volume\n\u2022 Bonds no longer issued post-crisis\n\u2022 Structures usually include NB for limited time (e.g., 1 year)\n\u2022 SPVs usually cover limited product groups (e.g., level term)\n\u2022 Max funding required for RC/redundant reserves at inception\n  \u25e6 But could have agreement for more in future\n\u2022 Usually based on some form of coinsurance\n\u2022 CC must be able to take ceded reserve credit (hence trusts)\n\u2022 Assets in SPV for long time (30+ years)\n\u2022 Investor retains inv income from assets","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"List advantages of using LOCs for SPVs.","a":"\u2022 Only annual redundancy amount needs LOC funding\n\u2022 Bank \u00d2 LOC amount each year for guaranteed fixed charge\n  \u25e6 Avoids refinancing the LOC\n  \u25e6 Better than bonds (would need reissue/refinance)\n\u2022 Long-term LOC costs \u00d3 as banks gain comfort","source":"Tiller Ch. 5: Advanced Methods of Reinsurance","reading":"Tiller","chapter":"Ch. 5 \u2013 Advanced Methods of Reinsurance","section":"D"},{"q":"Define 3 types of capital.\n\u2022 Regulatory required capital\n\u2022 Available capital\n\u2022 Target capital","a":"\u2022 Regulatory required capital \u2013 Required for p/h protection\n  \u25e6 Regulators represent p/h interests (solvency focused)\n  \u25e6 Held in safe investments for adverse events\n  \u25e6 Min thresholds trigger regulator intervention\n\u2022 Available capital \u2013 Used for growth, operational efficiency, or competitive\npositioning\n\u2022 Target capital \u2013 Reflects stakeholder perspectives:\n  \u25e6 Stockholders: Seek gains; prefer less conservatism\n  \u25e6 Debtholders: Prefer conservative capital\n  \u25e6 Regulators/p/h: Prefer conservative capital\n  \u25e6 Management: Balance; avoid excessive capital","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Compare factor-based vs. model-based regulatory capital methods.","a":"1. Factor-based (US)\n  \u25e6 RC requirements = factors \u02c6 financial statement amounts\n  \u25e6 Factors sometimes set using industry-wide models\n  \u25e6 Aggregate RC = individual RCs combined via correlation matrix\n2. Model-based (Canada, EU, Bermuda)\n  \u25e6 More actuary judgment\n  \u25e6 Models subject to regulatory review/approval","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe NAIC RBC and primary risk categories.","a":"NAIC: Mostly factor-based with some model-based components\n\u2022 Many assumptions prescribed\n\u2022 Shift to principles-based \u00d1 more model-based\n\u2022 Assets/liabilities measured under statutory accounting (conservative, mostly\nBV-based)\n4 primary risk categories:\n1. C0/C1: Asset Risk\n2. C2: Insurance Risk\n3. C3: Interest Rate/Market Risk\n4. C4: Business Risk","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe NAIC RBC asset risk component (C0, C1).","a":"\u2022 C0: Default risk for affiliated companies, OBS items (derivatives)\n\u2022 C1: Divided into C1cs (unaffiliated common stock) and C1o (all other)\n\u2022 C1o: Default risk for bonds, mortgages, RE, preferred stock\n  \u25e6 RC = factor \u02c6 BV of asset\n  \u25e6 Factors \u00d2 as credit rating \u00d3 (0% for Treasuries, 30% for junk bonds)\n\u2022 Additional adjustments:\n  \u25e6 Asset concentration factor \u02c6 10 largest holdings\n  \u25e6 Diversification factor \u02c6 total bond RC (factors \u00d3 as issuer count \u00d2)","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe NAIC RBC insurance risk component (C2).","a":"\u2022 C2mort: Risk DBs \u0105 expected\n  \u25e6 RC = factor \u02c6 NAR\n  \u25e6 Factors vary by:\n  \u25e6 Individual vs. group life\n  \u25e6 Insurer\u2019s ability to change NGEs\n  \u25e6 Portfolio size (factor \u00d3 as inforce \u00d2)\n\u2022 C2long: Risk payout annuity benefits \u0105 expected\n  \u25e6 RC = factor \u02c6 annuity reserves\n  \u25e6 Only life-contingent annuities in active payout\n  \u25e6 Factors vary with reserve size\n\u2022 Final C2 reflects negative correlation between mortality/longevity:\nC2 \u201c\nb\nC22\nmort ` C22\nlong ` 2 \u02c6 C2mort \u02c6 C2long \u02c6 CorrFactor","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe NAIC RBC interest rate/market risk component (C3).","a":"\u2022 C3a: Interest rate change risk (factor \u02c6 reserves)\n\u2022 C3b: Health care capitation risk\n\u2022 C3c: Market risk\n  \u25e6 C-3 Phase I: Certain fixed annuities, single premium life\n  \u25e6 Model-based, stochastic projection with prescribed scenarios\n  \u25e6 RC based on subset of worst scenarios\n  \u25e6 C-3 Phase II: VAs\n  \u25e6 Model-based, stochastic projection with prescribed scenarios\n  \u25e6 Requires reserves at CTE 70\n  \u25e6 RC = CTE 98 Reserves \u00b4 CTE 70 Reserves\n  \u25e6 Non-single premium life RC = factor \u02c6 reserves","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe NAIC RBC business risk component (C4).","a":"\u2022 Covers OR and any other risk not in C0\u2013C3\n\u2022 RC = factor \u02c6 annual premiums (premiums gross of reinsurance)","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Formula for NAIC authorized control level RBC and ratio?","a":"Authorized control level (ACL) RBC = covariance-adjusted sum\nACL RBC \u201c C0 ` C4a `\na\npC1o ` C3aq2 ` pC1cs ` C3cq2 ` C22 ` C3b2 ` C4b2\nRBC ACL Ratio \u201c Total Adjusted Capital\nACL RBC\n\u2022 C0 = Asset risk (affiliated amounts)\n\u2022 C1cs = Asset risk (unaffiliated common stock)\n\u2022 C1o = All other asset risk (excl. common stock)\n\u2022 C2 = Insurance risk\n\u2022 C3a = Interest rate risk\n\u2022 C3b = Health credit risk\n\u2022 C3c = Market risk\n\u2022 C4a = Business risk (non-health)\n\u2022 C4b = Health admin expense business risk","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"List US regulatory action levels.","a":"Level\nRBC ACL Ratio\nAction\nTrend Test Corridor\n[200%, 300%)\nCompany performs trend test\nCompany Action\n[150%, 200%)\nCompany prepares/submits RBC plan to regulator\nRegulatory Action\n[100%, 150%)\nCompany submits RBC plan; regulator issues corrective\naction order\nAuthorized Control\n[70%, 100%)\nRegulator authorized to take any actions necessary\nMandatory Control\n\u010370%\nCompany deemed insolvent, placed under regulatory control","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe Canadian solvency regulation and available capital tiers.","a":"Canadian insurers regulated at federal level by OSFI\n\u2022 Canadian assets/liabilities based on IFRS\nLICAT \u2013 significant capital assessment measure used by OSFI\nAvailable Capital = Tier 1 Capital + Tier 2 Capital\n\u2022 Tier 1 Capital = mostly shareholder equity, retained earnings (no limit)\n\u2022 Tier 2 Capital = assets not meeting Tier 1 criteria\n  \u25e6 Hybrid instruments, subordinated debt\n  \u25e6 Tier 2 must be positive and \u010f Tier 1","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Write Canadian LICAT ratio formulas.","a":"TR \u201c Available Capital + Surplus Allowance + Eligible Deposits\nBase Solvency Buffer\nCR \u201c Tier 1 Capital + 70% of Surplus Allowance + 70% of Eligible Deposits\nBase Solvency Buffer\n\u2022 Total Ratio: Focuses on p/h/creditor protection\n\u2022 Core Ratio: Focuses on financial strength\n\u2022 Surplus Allowance = PfADs calculated under:\n  \u25e6 CALM for pre-2023 business\n  \u25e6 IFRS 17 for business issued 2023+\n\u2022 Eligible Deposits = Collateral/LOCs from unregistered reinsurers + claims\nfluctuation reserves\n\u2022 Base Solvency Buffer (BSB) = 1-year CTE 99 min capital requirement","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"How is the Base Solvency Buffer determined under LICAT?","a":"BSB for each of 6 geographic regions = sum of 5 risk components:\n1. Asset default risk (credit + market risk)\n2. Mortality/morbidity/lapse risks\n3. Interest rate risk\n4. Segregated funds risk\n5. Foreign exchange risk\nEach item calibrated to 1-year CTE 99 level\nAdditional adjustments also apply:\n\u2022 Par products, diversification, reinsurance, collateral, hedges","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"List Canadian regulatory action levels.","a":"Target\nMinimum\nTotal Ratio\n100%\n90%\nCore Ratio\n70%\n55%\n\u2022 If either ratio approaches target \u00d1 OSFI assesses, takes necessary actions\n\u2022 If either ratio \u0103 minimum \u00d1 OSFI can take control\n\u2022 Companies must hold min $5M available capital regardless","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe capital requirement levels under Solvency II.","a":"EIOPA sets standards for EU members, including Solvency II guidance\nSolvency II establishes 2 capital requirement levels:\n1. Solvency Capital Requirement (SCR): 1-year 99.5% probability\n  \u25e6 Based on Basic Solvency Capital Calculation or internal model\n  \u25e6 Internal models subject to regulator approval\n2. Minimum Capital Requirement (MCR): Level requiring regulator intervention\n  \u25e6 Set at 1-year 85% solvency probability","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe asset/liability valuation under Solvency II.","a":"\u2022 Stresses starting economic balance sheet (similar to LICAT)\n\u2022 Assets/liabilities are marked to model\n  \u25e6 Model calibrated rather than directly from market data\n\u2022 Liabilities based on exit value\n  \u25e6 Based on transfer/settlement value between 2 willing parties with equal information\n  \u25e6 Difficult to determine: No trading exchanges, sparse M&A activity\n  \u25e6 Often determined using discounted cash flow models\n  \u25e6 Discount rate = risk-free rate with adjustments","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe key components of Solvency II balance sheet.","a":"\u2022 Assets = Assets Backing Tech. Provisions + Basic & Auxiliary Own Funds\n  \u25e6 Assets Backing Technical Provisions = All Tier 1 Assets + Some Tier 2 Assets\n  \u25e6 Assets Backing Technical Provisions = Technical Provisions (liability side)\n  \u25e6 Basic/Auxiliary Own Funds = Remaining Tier 2 Assets + Tier 3 Assets\n\u2022 Liabilities & Surplus = Technical Provisions + ECR + Free Own Funds\n  \u25e6 Technical Provisions = BEL + Risk Margin\n  \u25e6 Enhanced Capital Requirement (ECR) = SCR + MCR\n  \u25e6 Free Own Funds = any additional surplus assets held\n= Assets \u00b4 (Technical Provisions + ECR)\nBasic own funds currently exist; auxiliary could come from parent","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe MCR\u2019s relationship to Basic SCR under Solvency II and SCR action levels.","a":"Basic SCR reflects correlations across/within risk categories:\nBasic SCR \u201c\nd\u00ff\ni,j\nCorri,j \u02c6 SCRi \u02c6 SCRj\nSCR Ratio \u201c Available Capital\nSCR\nMCR must be between 25% and 45% of Basic SCR and \u011b 1.2M","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe Solvency II capital tiers.","a":"Tier 1 = highest quality; Tier 3 = lowest\n\u2022 At least 50% of SCR must be backed by Tier 1\n\u2022 Max 15% of SCR can be backed by Tier 3\n\u2022 At least 80% of MCR must be backed by Tier 1 capital, no Tier 3","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe regulatory action levels under Solvency II.","a":"Company approaching MCR must submit plan to regulator\n\u2022 Regulator must approve plan\n\u2022 If capital \u0103 SCR or MCR \u00d1 regulator requires more capital\n\u2022 EU regulators have latitude to decide further actions\nRegulatory actions determined by SCR Ratio:\nLevel\nSCR Ratio\nAction\nEarly Intervention Process\n[25%, 45%)\nIncreasingly severe prescribed supervisory actions\nas capital \u00d1 25%\nMinimum Required Level\n\u010325%\nCompany loses authorization to operate","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"List Solvency II risk categories.","a":"1. Underwriting risks\n  \u25e6 Non-life (P&C)\n  \u25e6 Life (7 categories)\n  \u25e6 Health\n2. Market risks\n2.1 Interest rate risk\n2.2 Equity Risk\n2.3 Property risk (RE)\n2.4 Spread risk (credit risk)\n2.5 Market risk concentration\n2.6 Currency risk\n3. Counterparty default\n  \u25e6 Type 1: All risk mitigation exposures (e.g., reinsurers)\n  \u25e6 Type 2: Future receivables from p/h, mortgage loans","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"List Solvency II life UW risk subcategories and shocks.","a":"1. Mortality risk: Life ins mortality +15%\n2. Longevity risk: Payout annuity mortality \u00b420%\n3. Disability-morbidity risk: Stresses initial claims, time on claim\n4. Lapse risk: RC = worst of 3 stress tests:\n  \u25e6 +50% permanent lapse shock\n  \u25e6 \u00b450% permanent lapse shock\n  \u25e6 \u00b440% PIF reduction\n5. Expense risk: Expenses +10% all years + inflation +1%\n6. Revision risk: Payout annuity benefits +3%\n7. Catastrophe risk: Add 0.15% to 1-year mortality rate\nAll calcs based on FMV assumptions with possible adjustments:\n\u2022 Spread adjustment: Accounts for \u201cirrational\u201d market movements\n\u2022 Matching/volatility adjustment: Can be made to discount rates","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe Bermuda regulatory balance sheet.","a":"Capital requirements prescribed by Insurance Act, regulated by BMA\n\u2022 Assets = Assets Backing EBS Technical Provision + Surplus Assets\n\u2022 Liabilities + Surplus = EBS Technical Provision + ECR + Free Surplus\n  \u25e6 EBS Technical Provision = BEL + Risk Margin\n  \u25e6 Enhanced Capital Requirement (ECR) = max[BSCR, MSM]\n  \u25e6 Expressed as MSM + Required Capital Over MSM\n  \u25e6 BSCR calibrated to 99.5% solvency (similar to Solvency II)\nMinimum Margin for Solvency (MSM) = max of:\n1. 25% \u02c6 ECR\n2. $1M BMD for Class 3A/3B insurers or $100M BMD for Class 4 insurers\nMSM available capital based on \u201cBermuda Statutory\u201d financials (US GAAP, IFRS)","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe target capital level under Bermuda regulation.","a":"Target Capital Level (TCL) = 120% \u02c6 ECR\n\u2022 TCL = amount of capital insurers expected to hold\n\u2022 TCL available capital based on economic balance sheet (EBS)\n\u2022 EBS assets are market value\n\u2022 EBS liabilities are fair value: BEL + Risk Margin\n\u2022 BEL uses discount rates based on either:\n  \u25e6 Standard approach: Based on market-representative portfolio\n  \u25e6 Scenario-based approach: Based on yields from company assets with adjustments\n\u2022 Risk Margin: 6% CoC approach discounted at prescribed risk-free rates","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Outline the BSCR risk categories.","a":"1. Market risk\n  \u25e6 Fixed income/equity risk: Prescribed factors \u02c6 asset MV\n  \u25e6 Interest rate risk (1 of 2 approaches):\n1.1 Duration-based: (|Asset Duration \u00b4 Liability Duration|) \u02c6 2% \u02c6 Asset MV\n1.2 Shock-based: Prescribed interest rate shocks\n  \u25e6 Currency risk: Prescribed shocks varying by currency\n  \u25e6 Concentration risk: Double RC for 10 largest holdings from single issuer\n2. Long-term risk \u2013 Risk from long-term liability fluctuations\n  \u25e6 Mortality risk: (Face \u00b4 BEL) \u02c6 NAR factor\n  \u25e6 Stop loss risk: Prescribed % \u02c6 premium\n  \u25e6 Morbidity risk: Prescribed % \u02c6 premium\n  \u25e6 Longevity risk: Prescribed % \u02c6 BEL\n  \u25e6 VA risk: Standard approach or CTE 95 internal model\n  \u25e6 Other long-term ins risk: Prescribed factor \u02c6 BEL\n3. Credit risk \u2013 Primarily counterparty risk\n4. P&C risk","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Describe Bermuda capital ratios and regulatory action levels.","a":"ECR Ratio \u201c BSCR Ratio \u201c Available Capital\nECR\nTCL Ratio \u201c Available Capital\nTCL\nRegulatory actions determined by ECR Ratio:\nLevel\nECR Ratio\nAction\nEarly Intervention Process\n[100%, 120%)\nCompany submits remediation plan, provides\nadditional reporting\nMinimum Required Level\n\u0103100%\nCompany must improve capital position, faces\nwind-up","source":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","reading":"Regulatory-Capital-Adequacy: Regulatory Capital Adequacy for Life Ins. Cos.","chapter":null,"section":"E"},{"q":"Why does nonforfeiture law exist?","a":"\u2022 Regulators want equitable treatment for persisters and lapsers\n\u2022 Regulators want p/h to receive fair share of equity on lapse","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"List key pricing concepts/risks for nonforfeiture.","a":"\u2022 Policies must provide min nonforfeiture value by US law\n\u2022 Lapse risks:\n  \u25e6 High lapses on high CSV products\n  \u25e6 Low lapses on low/no CSV products (e.g., T-100, lapse-supported)\n  \u25e6 Disintermediation: High lapses when rates \u00d2, asset MVs \u00d3\n\u2022 Nonforfeiture option utilization rates\n\u2022 Anti-selection: Mortality \u00d2 for options maximizing benefits/cost\n\u2022 Expense assumptions: Differ from regular policies, vary by option\n\u2022 Substandard risks:\n  \u25e6 May have same CSV as standard\n  \u25e6 Impact of later qualifying for standard","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"Compare RPU vs. ETI nonforfeiture options.","a":"1. Reduced Paid-Up (RPU)\n  \u25e6 Lower face than original: CSVrxs`t \u201c pRPU FaceqArxs`t\n  \u25e6 Maximizes coverage period\n  \u25e6 Low anti-selection\n2. Extended Term Insurance (ETI)\n  \u25e6 Maximizes p/h face\n  \u25e6 ETI expenses \u0103 RPU\n  \u25e6 Policy terminates when CSV = 0\n  \u25e6 Higher anti-selection (unless ETI is default)","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"List nonforfeiture options besides RPU and ETI.","a":"1. Automatic Premium Loan (APL)\n  \u25e6 Preserves original contract, benefits, riders\n  \u25e6 P/h can repay loan anytime\n  \u25e6 Policy terminates if Loan Balance \u0105 CSV\n  \u25e6 May entice p/h to stop paying premium\n  \u25e6 DB = Face \u00b4 Loan Amount\n2. Annuitization\n  \u25e6 Convert CSV \u00d1 payment stream (mostly DAs)\n3. Cash Surrender\n  \u25e6 Equivalent cash value of nonforfeiture options\n4. Flexible UL Premium Payments","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"Describe prospective approach for calculating nonforfeiture values.","a":"\u2022 Forward-looking PV based on expected future experience\n\u2022 Maintains parity between persisters/lapsers\nNF Value \u201c PVFB ` PVFE ` PV(Profit Contribution) \u00b4 PV(Gross Prems)\n\u2022 Net premium approach (common for traditional US products):\nNF Value \u201c PVFB \u00b4 PV(Level Net Premium)\nLevel Net Premium % \u201c PV0(FB) ` PV0(AcqCosts)\nPV0pGross Premiumsq\n\u2022 Assumptions for future experience:\n  \u25e6 Persister approach: Mortality only decrement\n  \u25e6 Whole contract approach: Reflects p/h option to terminate/convert","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"Describe retrospective nonforfeiture approach.","a":"\u2022 Backward-looking accumulation value:\nNF Value \u201c Fundt \u00b4 Surrender Charget\nFundt \u201c Fundt\u00b41 ` Premt ` Interestt \u00b4 Ben Chargest \u00b4 Expt \u00b4 Profitt\n\u2022 No-lapse guarantee: Policy stays in force even if NF Value \u0103 0","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"Compare prospective vs. retrospective approaches.","a":"\u2022 Product types (by premium flexibility):\n  \u25e6 Prospective: Works well for fixed premium products (WL, etc.)\n  \u25e6 Retrospective: Works well for flexible premium products (UL, annuities, etc.)\n\u2022 Retrospective easier to explain to p/h\n  \u25e6 Based on actual experience, not future assumptions\n\u2022 Prospective maintains more parity between persisters/lapsers\n\u2022 Prospective NF value changes if assumptions change (hard to explain)\n\u2022 Prospective NF value depends on policy class definitions","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"Compare US vs. non-US nonforfeiture practices.","a":"1. United States\n  \u25e6 Permanent policies must have nonforfeiture value\n  \u25e6 Balance different views on equity:\n  \u25e6 Lapsers: Want max value\n  \u25e6 Persisters: Want to pay as little as possible for lapsers\n  \u25e6 Company: Wants compensation for risk/costs\n  \u25e6 Agent: Wants compensation for sale (AcqCosts)\n  \u25e6 Regulator: Maximize p/h return without threatening solvency\n2. Outside United States\n  \u25e6 Unlike US, most countries do NOT have specific nonforfeiture laws\n  \u25e6 Some countries (e.g., Canada) may file general NF plan with regulator\n  \u25e6 United Kingdom:\n  \u25e6 Most life products are variable\n  \u25e6 Strong disclosure regulation","source":"ILA101-105: Life and Annuity Non-forfeiture Practices","reading":"ILA101-105: Life and Annuity Non-forfeiture Practices","chapter":null,"section":"E"},{"q":"How do NGEs differ from policyholder dividends?","a":"Principal NGE characteristics:\n1. Affect cost of contractual benefits/policy values\n2. Not guaranteed except for min/max values\n3. Insurer can change unilaterally (subject to contractual/legal restrictions)\nNGE Examples: COI charges, credited rates, index parameters\nNGEs \u2030 p/h dividends:\n\u2022 P/h dividends = par p/h share of par block profits\n\u2022 NGEs based on future experience expectations\n\u2022 P/h dividends based on actual past experience","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List 4+ NGE examples.","a":"All NGEs subject to max/min values under contract/regulation\n\u2022 Credited rates: Adjustable based on investment performance\n\u2022 Premium loads and other expenses\n\u2022 COI charges: Vary by UW class, sex, age, policy year\n  \u25e6 Guaranteed max rates comply with SNL/tax law\n  \u25e6 Guaranteed rates may be higher if anticipated mortality \u0105 SNL mortality\n\u2022 Index parameters: Adjustable caps/participation rates\n\u2022 Nonguaranteed bonuses: AV credits or charge refunds under certain conditions\n\u2022 VA rider charges for enhanced GLB riders\n\u2022 Indeterminate premiums: Traditional products with guaranteed/nonguaranteed\npremium scales","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List actuarial considerations for original NGE determination.","a":"Actuary must balance profitability with consumer needs\n\u2022 Expected mortality:\n  \u25e6 Varies with UW, target market, risk classes, policy sizes\n\u2022 COI charges relative to expected mortality\n\u2022 Policy load/expense charges:\n  \u25e6 How to cover policy issue expenses\n  \u25e6 Portion of premium covering costs\n  \u25e6 Revenue source for flexible premium products\n\u2022 Basis for credited interest:\n  \u25e6 Whether investment yields cover credited interest/other costs\n  \u25e6 New money vs. portfolio method\n\u2022 Assess assumptions via sensitivity testing:\n  \u25e6 Impact to profitability/competitiveness (individually and aggregate)","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List actuarial considerations when revising NGEs.","a":"NGE revisions allowed if experience doesn\u2019t align with AEFs set in original pricing\n\u2022 Insurers have faced lawsuits:\n  \u25e6 Changes not allowed by contract\n  \u25e6 Changes calculated inappropriately\n  \u25e6 Changes recouping past losses\n\u2022 Trend vs. variance:\n  \u25e6 Future NGE changes result from variances from expected values\n  \u25e6 NGE assumptions should already anticipate experience trends\n  \u25e6 If actual trend aligns with expected \u00d1 no changes needed\n\u2022 Insurers can provide illustrations of possible future values to p/h","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Define the following from ASOP 2:\n\u2022 NGE Framework\n\u2022 Determination Policy\n\u2022 Policy Classes","a":"NGE Framework = combination of:\n\u2022 Company\u2019s determination policy\n\u2022 Method to define policy class\n\u2022 Any other relevant criteria/principles for determining NGEs\nDetermination policy = insurer\u2019s governing principles/objectives for NGEs\n\u2022 Could be single document or collection of documents\n\u2022 Includes profitability/capital objectives/requirements\n\u2022 Specifies NGE review frequency with max time between reviews\nPolicy classes = policies grouped together when determining NGEs\n\u2022 Different NGEs can have different class definitions\n  \u25e6 Must appropriately reflect differences within AEFs\n\u2022 Classes not expected to change after issue\n  \u25e6 Can be redefined if supported by new information","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List ASOP 2 considerations for NGE scale determination/revision.","a":"1. Review prior determinations (including original):\n  \u25e6 If not available, use reasonable approach to reconstruct\n  \u25e6 Consider whether NGE scales consistent with policy language\n2. Analyze emerging experience vs. anticipated from prior determination:\n  \u25e6 Expectation: Do not revise unless AEFs change\n3. Consider whether to recommend NGE scale revision:\n  \u25e6 Not purely mathematical (consider multiple criteria)\n  \u25e6 Other stakeholders: Senior mgmt, marketing, legal, admin\n4. If doing revision, determine revised NGE scales:\n  \u25e6 Should be purely prospective: Focus on future profitability\n  \u25e6 Do NOT recoup past losses or distribute past gains","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List 3 ASOPs assisting with NGE data considerations.","a":"\u2022 ASOP 23 data considerations:\n  \u25e6 Actuaries must review data (or disclose why they didn\u2019t)\n  \u25e6 NOT required to audit data\n  \u25e6 Disclose data limitations and implications\n\u2022 ASOP 2 data considerations:\n  \u25e6 Use professional judgment if recreating past determinations\n  \u25e6 Disclose any reliance on others\n  \u25e6 Must still review data and methods/models using data\n\u2022 ASOP 25: Guidance on credibility considerations","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Describe actuarial guidance for NGE modeling.","a":"ASOP 56: Guidance on modeling (developing, modifying, reviewing, etc.)\nIdeally start with original or past determination model\nIf prior model not available/usable:\n\u2022 Start with model designed for another purpose, modify it\n\u2022 Example: CFT models for asset adequacy testing\n  \u25e6 May be done at aggregate level with simplifications\n  \u25e6 May include PADs not appropriate for NGE determination","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Outline Model 582 requirements for basic illustrations.","a":"Basic illustration: Sent to all applicants for policies subject to Model 582\n\u2022 Must include numeric summary of DBs, policy values, premium outlay\n\u2022 Must be created under 3 bases:\n1. Policy guarantees (least favorable)\n2. Insurer\u2019s illustrated scale (most favorable allowed)\n3. Insurer\u2019s illustrated scale with reduced NGEs (in between)\n  \u25e6 Based on avg of guaranteed values and illustrated scale values\n\u2022 Illustrated NGEs cannot be more favorable than illustrated scale\n  \u25e6 Do not project NGE improvements\n  \u25e6 Label all NGEs \u201cnonguaranteed\u201d\n\u2022 Illustrated scale \u010f lesser of:\n  \u25e6 Disciplined current scale (DCS)\n  \u25e6 Currently payable scale (current/actual scale)\n\u2022 Lapse-supported illustrations NOT allowed","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List Model 582 requirements for disciplined current scale.","a":"DCS = scale based on insurer\u2019s recent historical experience\n\u2022 Illustration Actuary (IA) must certify Model 582 compliance\n\u2022 Reflect only insurer actions already taken\n\u2022 Can NOT include projected experience improvements\n\u2022 Assumed expenses \u011b minimums defined in Model 582\nModel 582 points to ASOP 24 for guidance on IA\u2019s work\n\u2022 Defines parameters of DCS (NGE scale) certified annually by IA\nDCS must also pass self-support test (SST):\n\u2022 Passed if accumulated policy CFs \u011b illustrated CSV\n\u2022 Must pass at every illustrated point starting at 15th anniversary\n  \u25e6 Second-to-die policies: Test 20th anniversary and later\n\u2022 Cash flows based on DCS assumptions","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Describe Model 582 Lapse-Supported Test.","a":"Lapse-supported illustrations not allowed\n\u2022 IA must certify illustrations are NOT lapse-supported\n\u2022 Certification based on lapse support test\n\u2022 Lapse support test = SST with modified lapse assumption:\n  \u25e6 Years 1\u20135: Same lapse rates as SST\n  \u25e6 Years 6+: Assume 100% persistency (0% lapses)","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List provisions of NY Regulation 210.","a":"\u2022 Effective March 2018 for policies issued in NY (inforce and new business)\n\u2022 More prescriptive (strict) than ASOP 2\n\u2022 Key requirements:\n  \u25e6 Max time between NGE reviews \u010f 5 years\n  \u25e6 Formally documented, board-approved NGE determination policy\n  \u25e6 Various specific reinsurance considerations\n  \u25e6 Waiting period for filings and disclosures to p/h","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Describe regulation of NGEs in Canada.","a":"ICA Requirements for NGEs:\n\u2022 Insurer/board must set policies for dividends/bonuses and criteria for adjusting policy values\n\u2022 Maintain separate par accounts\n\u2022 Actuary reports annually to board on fairness of par management and adjustable criteria\nCIA Edu. Note: Fairness Opinions\n\u2022 Define experience factor classes at issue\n\u2022 Apply policies consistently, based on objective methods\n\u2022 Align with policy/board provisions; avoid unreasonable pooling/cross-subsidies\n\u2022 Document support for fairness opinions","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Describe regulation of NGEs in Asia.","a":"Singapore\n\u2022 MAS Notice 320: Internal governance for charges/expenses, par disclosures,\nboard/senior mgmt/AA roles\n\u2022 SoP L03: Guidance on fund policy management\nHong Kong\n\u2022 Guideline 16: Fair treatment, AA advises board on p/h expectations (no\nprescribed NGE approach)\n\u2022 \u201cGreen light process\u201d for unit-linked: Benchmark charges, ensure \u201ctreating\ncustomers fairly\u201d\nJapan: One ASOP requires AA to confirm adequate funding of par policies","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Describe regulation of NGEs in United Kingdom.","a":"\u2022 Most current NGE regulation created in early 2000s\n  \u25e6 Primary focus: \u201cTCF principle\u201d (treat customers fairly)\n  \u25e6 Requires communication/disclosures to p/h around NGE determination\n\u2022 Principles and Practices of Financial Management (PPFM) document\n  \u25e6 Published by UK insurers with with-profits (par) business\n  \u25e6 Outlined in \u201cFinancial Conduct Authority\u2019s Conduct of Business Sourcebook\u201d\n  \u25e6 Describes how NGEs are managed\n  \u25e6 Detail varies by insurer but generally high-level\n  \u25e6 Can be amended anytime with written notice to p/h","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"List data/information challenges for NGEs.","a":"\u2022 Original product pricing often unavailable or insufficiently detailed\n  \u25e6 ASOP 2: OK to reconstruct if needed\n\u2022 Experience data considerations/challenges:\n  \u25e6 Sufficient granularity of experience studies\n  \u25e6 Experience credibility\n  \u25e6 Whether anticipated experience factors supported by emerging experience\n  \u25e6 Materiality of experience changes\n  \u25e6 Sensitivity of profit to assumption changes\n  \u25e6 Availability of p/h behavior experience (premium persistency, lapse, etc.)\n\u2022 No industry standard for evaluating AEF changes\n  \u25e6 ASOP 2: Changing NGE scales should NOT \u00d2 expected profit vs. original\nexpectations","source":"Overview of NGEs","reading":"Overview of NGEs","chapter":null,"section":"E"},{"q":"Formulas for product cash flow and solvency earnings?","a":"ProdCashFlowptq \u201c Premptq \u00b4 Benptq \u00b4 Expptq\nPreTaxSolvEarnptq \u201c ProdCashFlowptq ` InvIncomeptq \u00b4 SolvResIncrptq\nAfterTaxSolvEarnptq \u201c PreTaxSolvEarnptq \u00b4 Taxptq","source":"ILA101-104: Profit Measurement And Analysis","reading":"ILA101-104: Profit Measurement And Analysis","chapter":null,"section":"E"},{"q":"Formulas for distributable and stockholder earnings?","a":"Distributable Earnings\nDistEarnptq \u201c AfterTaxSolvEarnptq \u00b4 ReqCapIncrptq ` ATInvIncRCptq\nStockholder Earnings (U.S. GAAP Earnings)\nPreTaxStockEarnptq \u201c ProdCashFlowptq ` InvIncomeptq \u00b4 BenResIncrptq\n\u00b4 DACAmortptq ` InvIncRCptq\n\u201c PreTaxSolvEarnptq ` SolvResIncrptq \u00b4 BenResIncrptq\n\u00b4 DACAmortptq ` InvIncRCptq\nAfterTaxStockEarnptq \u201c PreTaxStockEarnptq \u00b4 Taxptq \u00b4 TaxInvIncRCptq \u00b4 DefTaxProvptq","source":"ILA101-104: Profit Measurement And Analysis","reading":"ILA101-104: Profit Measurement And Analysis","chapter":null,"section":"E"},{"q":"Formula for annual ROE?","a":"Annual ROEt \u201c AfterTaxStockEarnt\nEquityBaset\nEquityBase \u201c StockAssets \u00b4 StockLiab\nStock Assets \u201c SolvRes ` ReqCap ` DAC\nStockLiab \u201c BenRes ` DefTaxLiab\nAlternatively, equity base can be mid-year:\nMidYearEquityBaset \u201c EquityBaset ` EquityBaset\u00b41\n2","source":"ILA101-104: Profit Measurement And Analysis","reading":"ILA101-104: Profit Measurement And Analysis","chapter":null,"section":"E"},{"q":"List considerations for selecting profit goals.","a":"1. Select accounting basis:\n  \u25e6 Usually solvency (Statutory) \u00f1 distributable earnings\n  \u25e6 May also use stockholder basis (GAAP)\n2. Determine how to reflect risk:\n  \u25e6 Formula-based: Function of risk (mortality, expense, investment)\n  \u25e6 Judgment-based\n  \u25e6 Sensitivity tests (recommended)\n3. Interest/discount rate considerations:\n  \u25e6 Cost of capital = weighted avg of company\u2019s capital sources\n  \u25e6 Opportunity cost = return on alternative ventures with similar risk\n  \u25e6 Current/expected future capital position\n  \u25e6 Discounting use:\n  \u25e6 After-tax usually more appropriate than pre-tax\n  \u25e6 Use CoC if determining whether product produces acceptable return","source":"ILA101-104: Profit Measurement And Analysis","reading":"ILA101-
