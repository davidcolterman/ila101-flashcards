urity until the borrower repurchases it\n\u2022 Haircut \u2013 the amount by which the repo collateral exceeds the loan","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Clean vs. dirty price?","a":"Dirty price = true market price of bond (PV bond CFs at YTM)\nClean price = Dirty Price \u00b4 Accrued Interest\nAccrued interest = prorated portion of the coupon since the last coupon date\nAccrued Interest \u201c\nDays Since Last Coupon\nTotal Days Between Coupon Dates","source":"ILA101-113 Ch. 7: Interest Rate Forwards and Futures","reading":"ILA101-113","chapter":"Ch. 7 \u2013 Interest Rate Forwards and Futures","section":"F"},{"q":"Why are insurer duties complex?","a":"\u2022 Answering to policyholders, shareholders, rating agencies and tax agencies\n\u2022 Managing its group\u2019s overall balance sheet and capital adequacy\n\u2022 Reporting financials based on accounting requirements (if publicly traded)","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"Insurer challenges in financial crisis?","a":"\u2022 Significant realized losses\n\u2022 Unrealized losses via Accumulated Other Comprehensive Income (AOCI)\n  \u25e6 Many assets are classified as AFS \u2192must reflect MV on balance sheet\n  \u25e6 AOCI = MV \u00b4 Amortized Cost\n  \u25e6 Flows through equity on the balance sheet\n  \u25e6 AOCI losses \u2191sharply between June 2008 and March 2009, then back to normal by\nSeptember 2009\n\u2022 Severe drops in market capitalization vs. the broader market\n\u2022 Falling RBC ratios \u2192need to raise capital","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"Insurer actions post-crisis?","a":"Increased liquidity, lowered risk\n\u2022 Almost doubled allocations to cash and short-term securities\n\u2022 Significantly reduced exposure to securitized assets\nRaised capital\n\u2022 Issued common and preferred equity\n\u2022 Issued unsecured debt, surplus notes, and subordinated debt\n\u2022 De-risked through changing asset allocations\n\u2022 Attempted to divest businesses","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"List 3 ways to create integrated risk management strategy.","a":"1. Clearly define a market risk budget\n2. Evaluate economic objectives vs. insurance constraints\n3. Determine how and where ALM fits into the overall risk management framework","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"List 6 core ERM processes.","a":"1. Risk governance\n2. Risk and capital measurement\n3. Risk budgeting\n4. Liquidity risk management\n5. ALM and SAA\n6. Risk reporting","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"List GSAM\u2019s 6 ALM/SAA steps.","a":"\u2022 Step 1 \u2013 Investment Objectives and Constraints\n\u2022 Step 2 \u2013 Asset Universe and Assumptions\n\u2022 Step 3 \u2013 Liability Cash Flow and Replicating Portfolio\n\u2022 Step 4 \u2013 Risk Measures\n\u2022 Step 5 \u2013 Risk Return Trade-Offs\n\u2022 Step 6 \u2013 ALM and SAA","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"GSAM Step 1: Investment Objectives/Constraints?","a":"Gives insight into a portfolio\u2019s risk and return attributes under different scenarios\n\u2022 Most important step\nExamples of constraints:\n\u2022 Achieve 5.5% target yield\n\u2022 Asset-liability duration mismatch tolerance: \u02d80.2\n\u2022 Define exposure limits to specific asset/credit classes","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"GSAM Step 2: Asset Universe/Assumptions?","a":"\u2022 Establish a broad set of asset classes to achieve diversification and portfolio\nefficiency\n\u2022 Correlations are key\n  \u25e6 Correlations between assets\n  \u25e6 Correlations between assets and liabilities","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"GSAM Step 3: Liability CF/Replicating Portfolio?","a":"3 main steps:\n\u2022 Project liability cash flows to understand the liability profile\n\u2022 Develop the duration profile of the liabilities\n\u2022 Design a risk-minimizing asset portfolio that matches the key economic\ncharacteristics of the liabilities","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"GSAM Step 4: Risk Measures?","a":"\u2022 Helps assess effectiveness of different investment strategies\n\u2022 Risk metrics:\n  \u25e6 Asset-only volatility\n  \u25e6 Surplus volatility\n  \u25e6 Economic or required capital, Value at Risk (VaR)\n  \u25e6 Conditional Value at Risk (CVaR) (a.k.a. CTE)\n  \u25e6 Surplus drawdown risk","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"GSAM Step 5: Risk/Return Trade-Offs?","a":"\u2022 Apply optimization techniques\n\u2022 Evaluate and compare various efficient frontiers","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"GSAM Step 6: ALM/SAA?","a":"\u2022 Overall SAA decision reflects an insurer\u2019s risk and return objectives, ALM and\nother constraints\n\u2022 SAA is used to develop customized benchmarks\n\u2022 To recommend a portfolio, must also consider:\n  \u25e6 Appropriate benchmark(s) to be constructed in line with SAA\n  \u25e6 Relevant tolerance for active management to achieve target alpha\n  \u25e6 How will current market views be incorporated into the portfolio?","source":"ILA101-112: Revisiting the Role of Insurance Company ALM","reading":"ILA101-112: Revisiting the Role of Insurance Company ALM","chapter":null,"section":"F"},{"q":"Capital market vs. actuarial ALM view?","a":"\u2022 Capital Market View: Insurance product = bundle of options granted by the\ninsurer to policyholders in exchange for a fee\n  \u25e6 Preferred by the authors\n  \u25e6 Insurance products increasingly offer options that policyholders can exercise\n\u2022 Actuarial View: Series of future benefit payments/cash flows tied to contingent\nevents (death, etc.)\n  \u25e6 Relies on historical experience and current market for assumptions\n  \u25e6 If actual experience \u2030 historical, insurers face substantial risk\n  \u25e6 Assumes economic variables stay within a reasonable range of historical experience\nOptimal Solution = Robust ALM that combines:\n\u2022 Actuarial approach (risk measurement, capital allocation)\n\u2022 Capital markets view to manage embedded options","source":"ILA101-114: ALM of Financial Institutions, Ch. 16","reading":"ILA101-114: ALM of Financial Institutions","chapter":"Ch. 16","section":"F"},{"q":"ALM experience loss examples?","a":"\u2022 Guaranteed Investment Contracts (GICs):\n  \u25e6 Falling interest rates make it difficult to fund guaranteed payments\n\u2022 Credit risk on high-yield and real estate\n  \u25e6 Insurers were short credit options that were exercised (defaults)\n\u2022 VA GMxBs\n  \u25e6 Unhedged insurers took losses when equity markets and rates \u2193\nCommon Feature: Poor ALM practices susceptible to paradigm market changes\n\u2022 Insurers wrote options based on an incorrect view of the world\n\u2022 Products were mispriced, and portfolios overly risky","source":"ILA101-114: ALM of Financial Institutions, Ch. 16","reading":"ILA101-114: ALM of Financial Institutions","chapter":"Ch. 16","section":"F"},{"q":"LTCI ALM lessons learned?","a":"\u2022 LTCI products may collect premiums decades before claims begin\n\u2022 Pricing relies heavily on assumed reinvestment returns\n  \u25e6 Premiums must accumulate sufficient reserves\n\u2022 Insurers in the 1990s assumed high reinvestment rates (7%)\n\u2022 Unhedged insurers took large losses when rates \u00d3 in the early 2000s\n\u2022 Erroneously assumed rates would mean revert higher\nLesson: Active management of options/rights protects against drops in future\ninvestment yield, increasing certainty of meeting obligations","source":"ILA101-114: ALM of Financial Institutions, Ch. 16","reading":"ILA101-114: ALM of Financial Institutions","chapter":"Ch. 16","section":"F"},{"q":"Describe short options written by insurers.","a":"\u2022 Risk Products: Term life, disability, LTCI\n  \u25e6 Feature: Option to renew a policy at guaranteed premiums\n  \u25e6 Embedded Short Option: Call on the value of future benefit payments\n\u2022 Investment Products: Fixed and variable annuities\n  \u25e6 Features: Additional deposits, withdrawals, guaranteed benefits/interest\n  \u25e6 Embedded Short Options:\n  \u25e6 Call on the value of future annuity payments\n  \u25e6 Put on the value of the policy\n  \u25e6 Interest rate floor\n\u2022 Hybrid Products: WL and VUL\n  \u25e6 Features: cash surrender, borrowing at pre-determined rates\n  \u25e6 Embedded Short Options:\n  \u25e6 Put on the value of the policy\n  \u25e6 Series of puts on fixed-rate bonds","source":"ILA101-114: ALM of Financial Institutions, Ch. 16","reading":"ILA101-114: ALM of Financial Institutions","chapter":"Ch. 16","section":"F"},{"q":"How can fixed annuity rate risk be hedged?","a":"Insurer objectives:\n\u2022 Crediting rate \u011b one-year LIBOR\n\u2022 Earn a 150 bps spread (Yield \u00b4 Crediting Rate)\nAssume: yield on 10-year investment = 6%, and LIBOR = 4.0%\n\u2022 Objectives are met as long as LIBOR \u010f 4.5%\n\u2022 If LIBOR rises above 4.5%, the insurer cannot earn a 150 bps spread\nSolution: enter a swap: pay fixed (4.5%), receive floating (LIBOR)\n\u2022 Locks in a spread of 6.0% \u00b4 4.0% \u00b4 4.5% ` 4.0% \u201c 150 bps\n\u2022 The floating LIBOR payment will always offset the crediting rate","source":"ILA101-114: ALM of Financial Institutions, Ch. 16","reading":"ILA101-114: ALM of Financial Institutions","chapter":"Ch. 16","section":"F"},{"q":"Describe options granted to insurers.","a":"\u2022 Risk Products: Term life, disability, LTCI\n  \u25e6 Features: Right to receive either future premiums or reserve\n  \u25e6 Right/option: Callable bond\n\u2022 Investment Products: Fixed and variable annuities\n  \u25e6 Product features:\n  \u25e6 Right to convert the policy from a fixed to floating rate\n  \u25e6 Right to receive future M&E fees and/or SCs (MV \u00d2 with underlying assets)\n  \u25e6 Right/option: swaption, bond with equity call option\n\u2022 Hybrid Products: Permanent, whole, and variable life\n  \u25e6 Product features:\n  \u25e6 Right to change the dividend or NGE scale\n  \u25e6 Right to receive future premiums or excess of reserve over CSV\n  \u25e6 Right/option: swaption, callable bond","source":"ILA101-114: ALM of Financial Institutions, Ch. 16","reading":"ILA101-114: ALM of Financial Institutions","chapter":"Ch. 16","section":"F"}]
;
</script>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "ila101_flashcards_v1";
  const SECTION_ORDER = ["A", "B", "C", "D", "E", "F"];

  DECK.forEach((c, i) => {
    c.id = i;
    c.leaf = [c.section, c.reading, c.chapter || ""].join("␀");
  });

  // ---------- persistence ----------
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { stats: {}, selected: null };
  }
  const persisted = loadState();
  const stats = persisted.stats || {};
  let selectedLeaves = new Set(persisted.selected || DECK.map(c => c.leaf));
  if (!persisted.selected) {
    // ensure every leaf present (first run)
    DECK.forEach(c => selectedLeaves.add(c.leaf));
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      stats,
      selected: Array.from(selectedLeaves)
    }));
    schedulePush();
  }

  function cardStat(id) {
    if (!stats[id]) stats[id] = { seen: 0, got: 0, missed: 0, lastResult: null, last: null, dueAt: 0 };
    return stats[id];
  }

  // ---------- spaced-repetition schedule ----------
  const MIN = 60 * 1000, HOUR = 60 * MIN;
  // delay until next inbox appearance, keyed by [previous result][new result]
  const SCHEDULE = {
    none:   { got: 24 * HOUR, missed: 1 * HOUR },
    got:    { got: 72 * HOUR, missed: 24 * HOUR },
    missed: { got: 24 * HOUR, missed: 30 * MIN }
  };
  function nextDueDelay(prevResult, newResult) {
    return (SCHEDULE[prevResult || "none"] || SCHEDULE.none)[newResult];
  }

  // ---------- build tree ----------
  // sectionsMap: section -> Map(reading -> {chapters: Map(chapterLabel-or-'' -> [cards]), cards: [all cards in reading]})
  const tree = new Map();
  DECK.forEach(c => {
    if (!tree.has(c.section)) tree.set(c.section, new Map());
    const readings = tree.get(c.section);
    if (!readings.has(c.reading)) readings.set(c.reading, new Map());
    const chapters = readings.get(c.reading);
    const chKey = c.chapter || "";
    if (!chapters.has(chKey)) chapters.set(chKey, []);
    chapters.get(chKey).push(c);
  });

  function leafKeysFor(section, reading, chapter) {
    if (section === undefined) return DECK.map(c => c.leaf);
    if (reading === undefined) {
      const out = [];
      tree.get(section).forEach((chapters, rd) => chapters.forEach(cards => out.push(...cards.map(c => c.leaf))));
      return out;
    }
    if (chapter === undefined) {
      const out = [];
      tree.get(section).get(reading).forEach(cards => out.push(...cards.map(c => c.leaf)));
      return out;
    }
    return tree.get(section).get(reading).get(chapter).map(c => c.leaf);
  }

  const checkboxRegistry = []; // {el, keys} keys = array of leaf strings this checkbox governs

  function buildTreeUI() {
    const container = document.getElementById("tree");
    container.innerHTML = "";
    const sections = Array.from(tree.keys()).sort((a, b) => {
      const ia = SECTION_ORDER.indexOf(a), ib = SECTION_ORDER.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });

    sections.forEach(section => {
      const readings = tree.get(section);
      const secLeaves = leafKeysFor(section);
      const secCount = secLeaves.length;

      const details = document.createElement("details");
      details.open = sections.length <= 2;
      const summary = document.createElement("summary");
      summary.className = "section-summary";
      const tri = document.createElement("span");
      tri.className = "tri"; tri.textContent = "▸";
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      const nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = "Section " + section;
      const countSpan = document.createElement("span");
      countSpan.className = "count";
      countSpan.textContent = secCount;
      cb.addEventListener("click", e => e.stopPropagation());
      cb.addEventListener("change", () => {
        setLeaves(secLeaves, cb.checked);
      });
      label.appendChild(cb); label.appendChild(nameSpan); label.appendChild(countSpan);
      summary.appendChild(tri); summary.appendChild(label);
      details.appendChild(summary);
      checkboxRegistry.push({ el: cb, keys: secLeaves });

      readings.forEach((chapters, reading) => {
        const readingLeaves = leafKeysFor(section, reading);
        const hasChapters = !(chapters.size === 1 && chapters.has(""));

        if (!hasChapters) {
          // standalone reading == leaf row directly
          const row = document.createElement("div");
          row.className = "leaf-row";
          const rLabel = document.createElement("label");
          const rCb = document.createElement("input");
          rCb.type = "checkbox";
          const rName = document.createElement("span");
          rName.className = "name"; rName.title = reading; rName.textContent = reading;
          const rCount = document.createElement("span");
          rCount.className = "count"; rCount.textContent = readingLeaves.length;
          rCb.addEventListener("change", () => setLeaves(readingLeaves, rCb.checked));
          rLabel.appendChild(rCb); rLabel.appendChild(rName); rLabel.appendChild(rCount);
          row.appendChild(rLabel);
          details.appendChild(row);
          checkboxRegistry.push({ el: rCb, keys: readingLeaves });
        } else {
          const rDetails = document.createElement("details");
          const rSummary = document.createElement("summary");
          rSummary.className = "reading-summary";
          const rTri = document.createElement("span"); rTri.className = "tri"; rTri.textContent = "▸";
          const rLabel = document.createElement("label");
          const rCb = document.createElement("input"); rCb.type = "checkbox";
          const rName = document.createElement("span");
          rName.className = "name"; rName.title = reading; rName.textContent = reading;
          const rCount = document.createElement("span");
          rCount.className = "count"; rCount.textContent = readingLeaves.length;
          rCb.addEventListener("click", e => e.stopPropagation());
          rCb.addEventListener("change", () => setLeaves(readingLeaves, rCb.checked));
          rLabel.appendChild(rCb); rLabel.appendChild(rName); rLabel.appendChild(rCount);
          rSummary.appendChild(rTri); rSummary.appendChild(rLabel);
          rDetails.appendChild(rSummary);
          checkboxRegistry.push({ el: rCb, keys: readingLeaves });

          chapters.forEach((cards, chLabel) => {
            const chLeaves = cards.map(c => c.leaf);
            const row = document.createElement("div");
            row.className = "leaf-row";
            const cLabel = document.createElement("label");
            const cCb = document.createElement("input"); cCb.type = "checkbox";
            const cName = document.createElement("span");
            cName.className = "name"; cName.title = chLabel; cName.textContent = chLabel;
            const cCount = document.createElement("span");
            cCount.className = "count"; cCount.textContent = cards.length;
            cCb.addEventListener("change", () => setLeaves(chLeaves, cCb.checked));
            cLabel.appendChild(cCb); cLabel.appendChild(cName); cLabel.appendChild(cCount);
            row.appendChild(cLabel);
            rDetails.appendChild(row);
            checkboxRegistry.push({ el: cCb, keys: chLeaves });
          });

          details.appendChild(rDetails);
        }
      });

      container.appendChild(details);
    });

    refreshTreeUI();
  }

  function setLeaves(keys, checked) {
    keys.forEach(k => checked ? selectedLeaves.add(k) : selectedLeaves.delete(k));
    persist();
    refreshTreeUI();
    refreshSetupScreen();
  }

  function refreshTreeUI() {
    checkboxRegistry.forEach(({ el, keys }) => {
      const selCount = keys.reduce((n, k) => n + (selectedLeaves.has(k) ? 1 : 0), 0);
      el.checked = selCount === keys.length && keys.length > 0;
      el.indeterminate = selCount > 0 && selCount < keys.length;
    });
  }

  document.getElementById("selectAllBtn").addEventListener("click", () => setLeaves(DECK.map(c => c.leaf), true));
  document.getElementById("selectNoneBtn").addEventListener("click", () => setLeaves(DECK.map(c => c.leaf), false));

  // ---------- footer stats ----------
  function inboxCards(cards) {
    const now = Date.now();
    return cards.filter(c => stats[c.id] && stats[c.id].dueAt > 0 && stats[c.id].dueAt <= now);
  }

  function refreshFooterStats() {
    let seen = 0;
    Object.values(stats).forEach(s => { seen += s.seen; });
    document.getElementById("statSeen").textContent = seen;
    document.getElementById("statInbox").textContent = inboxCards(DECK).length;
  }

  let resetArmed = false;
  const resetBtn = document.getElementById("resetProgressBtn");
  resetBtn.addEventListener("click", () => {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = "Click again to confirm";
      resetBtn.classList.add("confirm");
      setTimeout(() => {
        resetArmed = false;
        resetBtn.textContent = "Reset all progress";
        resetBtn.classList.remove("confirm");
      }, 3000);
    } else {
      Object.keys(stats).forEach(k => delete stats[k]);
      persist();
      refreshFooterStats();
      resetArmed = false;
      resetBtn.textContent = "Reset all progress";
      resetBtn.classList.remove("confirm");
    }
  });

  // ---------- session state ----------
  let mode = "all"; // 'all' | 'inbox'
  let order = [];
  let pos = 0;
  let flipped = false;
  let sessionGot = 0, sessionMissed = 0;

  function filteredDeck() {
    let d = DECK.filter(c => selectedLeaves.has(c.leaf));
    if (mode === "inbox") {
      d = inboxCards(d);
    }
    return d;
  }

  function inboxCountInSelection() {
    return inboxCards(DECK.filter(c => selectedLeaves.has(c.leaf))).length;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function refreshSetupScreen() {
    const total = filteredDeck().length;
    document.getElementById("setupCount").textContent = total;
    document.getElementById("setupSub").textContent =
      (mode === "inbox" ? "due cards" : "cards") + " selected in the filter panel";
    document.getElementById("startBtn").disabled = total === 0;
    document.getElementById("startBtn").style.opacity = total === 0 ? 0.5 : 1;
    const inboxTabBtn = document.querySelector('.mode-toggle button[data-mode="inbox"]');
    const inboxAvail = inboxCountInSelection();
    inboxTabBtn.disabled = inboxAvail === 0;
    inboxTabBtn.textContent = "Inbox due now (" + inboxAvail + ")";
  }

  document.getElementById("modeToggle").addEventListener("click", e => {
    const btn = e.target.closest("button[data-mode]");
    if (!btn || btn.disabled) return;
    mode = btn.dataset.mode;
    document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("active", b === btn));
    refreshSetupScreen();
  });

  function showScreen(name) {
    document.getElementById("setupScreen").style.display = name === "setup" ? "flex" : "none";
    document.getElementById("reviewScreen").style.display = name === "review" ? "flex" : "none";
    document.getElementById("summaryScreen").style.display = name === "summary" ? "flex" : "none";
  }

  function startSession(cards) {
    order = shuffle(cards);
    pos = 0;
    sessionGot = 0; sessionMissed = 0;
    flipped = false;
    showScreen("review");
    renderCard();
  }

  document.getElementById("startBtn").addEventListener("click", () => startSession(filteredDeck()));
  document.getElementById("reshuffleBtn").addEventListener("click", () => startSession(order.length ? order : filteredDeck()));
  document.getElementById("endSessionBtn").addEventListener("click", () => finishSession());
  document.getElementById("reshuffleAllBtn").addEventListener("click", () => startSession(filteredDeck()));
  document.getElementById("reviewMissedBtn").addEventListener("click", () => {
    const missed = order.filter((c, i) => sessionResults[i] === "missed");
    startSession(missed.length ? missed : filteredDeck());
  });
  document.getElementById("backToSetupBtn").addEventListener("click", () => {
    refreshSetupScreen();
    showScreen("setup");
  });

  let sessionResults = []; // parallel to order

  function renderCard() {
    const card = order[pos];
    flipped = false;
    document.getElementById("card").classList.remove("flipped");
    const eyebrow = (card.section ? '<span class="chip">' + card.reading + '</span>' : "") +
      (card.chapter ? card.chapter : "");
    document.getElementById("frontEyebrow").innerHTML = '<span class="chip">Sec ' + card.section + '</span>' + card.reading;
    document.getElementById("backEyebrow").innerHTML = eyebrow;
    document.getElementById("frontContent").textContent = card.q;
    document.getElementById("backContent").textContent = card.a;
    document.getElementById("missedBtn").disabled = true;
    document.getElementById("gotBtn").disabled = true;
    updateProgress();
  }

  function updateProgress() {
    document.getElementById("progressLabel").textContent = (pos + 1) + " / " + order.length;
    document.getElementById("progressFill").style.width = ((pos) / order.length * 100) + "%";
    document.getElementById("tallyGot").textContent = sessionGot;
    document.getElementById("tallyMissed").textContent = sessionMissed;
  }

  function flipCard() {
    flipped = !flipped;
    document.getElementById("card").classList.toggle("flipped", flipped);
    document.getElementById("missedBtn").disabled = !flipped;
    document.getElementById("gotBtn").disabled = !flipped;
  }

  document.getElementById("card").addEventListener("click", flipCard);
  document.getElementById("card").addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); flipCard(); }
  });

  function mark(result) {
    const card = order[pos];
    const s = cardStat(card.id);
    const prevResult = s.lastResult;
    s.seen++;
    s[result]++;
    s.dueAt = Date.now() + nextDueDelay(prevResult, result);
    s.lastResult = result;
    s.last = Date.now();
    sessionResults[pos] = result;
    if (result === "got") sessionGot++; else sessionMissed++;
    persist();
    refreshFooterStats();

    if (pos + 1 < order.length) {
      pos++;
      renderCard();
    } else {
      finishSession();
    }
  }

  document.getElementById("gotBtn").addEventListener("click", () => mark("got"));
  document.getElementById("missedBtn").addEventListener("click", () => mark("missed"));

  document.addEventListener("keydown", e => {
    if (document.getElementById("reviewScreen").style.display === "none") return;
    if (e.target.tagName === "INPUT") return;
    if (e.code === "ArrowRight" && !document.getElementById("gotBtn").disabled) mark("got");
    if (e.code === "ArrowLeft" && !document.getElementById("missedBtn").disabled) mark("missed");
  });

  function finishSession() {
    document.getElementById("sumGot").textContent = sessionGot;
    document.getElementById("sumMissed").textContent = sessionMissed;
    document.getElementById("sumTotal").textContent = sessionGot + sessionMissed;
    document.getElementById("reviewMissedBtn").style.display = sessionMissed > 0 ? "inline-flex" : "none";
    showScreen("summary");
    refreshSetupScreen();
    refreshTreeUI();
  }

  // ---------- export / import ----------
  function exportProgress() {
    const payload = {
      app: "ila101-flashcards",
      version: 1,
      exportedAt: new Date().toISOString(),
      stats,
      selected: Array.from(selectedLeaves)
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "ila101-flashcard-progress-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById("exportBtn").addEventListener("click", exportProgress);

  let importArmed = false;
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  importBtn.addEventListener("click", () => {
    if (!importArmed) {
      importArmed = true;
      importBtn.textContent = "Click again to confirm";
      setTimeout(() => { importArmed = false; importBtn.textContent = "Import progress"; }, 3000);
      return;
    }
    importArmed = false;
    importBtn.textContent = "Import progress";
    importFile.click();
  });
  importFile.addEventListener("change", () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data.stats !== "object") throw new Error("Not a recognized progress file");
        Object.keys(stats).forEach(k => delete stats[k]);
        Object.assign(stats, data.stats);
        selectedLeaves = new Set(Array.isArray(data.selected) ? data.selected : DECK.map(c => c.leaf));
        persist();
        refreshTreeUI();
        refreshFooterStats();
        refreshSetupScreen();
        showImportStatus("Imported progress for " + Object.keys(data.stats).length + " cards.", false);
      } catch (e) {
        showImportStatus("Couldn't read that file: " + e.message, true);
      }
      importFile.value = "";
    };
    reader.readAsText(file);
  });

  function showImportStatus(text, isError) {
    const el = document.getElementById("importStatus");
    el.textContent = text;
    el.style.color = isError ? "var(--danger)" : "var(--success)";
    setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 5000);
  }

  // ---------- cloud sync ----------
  const SYNC_CODE_KEY = "ila101_sync_code";
  let syncCode = localStorage.getItem(SYNC_CODE_KEY) || "";
  let syncDocRef = null, syncReady = false, syncPushTimer = null;

  async function sha256Hex(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function setSyncStatus(text, isError) {
    const el = document.getElementById("syncStatus");
    el.textContent = text;
    el.style.color = isError ? "var(--danger)" : "var(--ink-muted)";
  }

  function renderSyncUI() {
    document.getElementById("syncBtn").textContent = syncCode ? "Change sync code" : "Enable cloud sync";
  }

  function schedulePush() {
    if (!syncReady || !syncDocRef) return;
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(() => {
      syncDocRef.set({ stats, updatedAt: Date.now() }, { merge: true })
        .then(() => setSyncStatus("Synced " + new Date().toLocaleTimeString()))
        .catch(() => setSyncStatus("Cloud sync offline (will retry)", true));
    }, 2000);
  }

  async function initSync() {
    renderSyncUI();
    if (!syncCode) return;
    setSyncStatus("Connecting…");
    try {
      await firebase.auth().signInAnonymously();
      const docId = await sha256Hex(syncCode);
      syncDocRef = firebase.firestore().collection("syncs").doc(docId);
      const snap = await syncDocRef.get();
      if (snap.exists) {
        const remote = snap.data().stats || {};
        Object.keys(remote).forEach(id => {
          const r = remote[id], l = stats[id];
          if (!l || (r.last || 0) > (l.last || 0)) stats[id] = r;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ stats, selected: Array.from(selectedLeaves) }));
        refreshTreeUI();
        refreshFooterStats();
        refreshSetupScreen();
      }
      syncReady = true;
      setSyncStatus("Cloud sync on");
      schedulePush();
    } catch (e) {
      setSyncStatus("Cloud sync offline (will retry)", true);
    }
  }

  document.getElementById("syncBtn").addEventListener("click", () => {
    const form = document.getElementById("syncForm");
    form.style.display = form.style.display === "none" ? "flex" : "none";
    form.style.flexDirection = "column";
    if (form.style.display === "flex") document.getElementById("syncCodeInput").focus();
  });

  document.getElementById("syncConnectBtn").addEventListener("click", () => {
    const val = document.getElementById("syncCodeInput").value.trim();
    if (!val) return;
    syncCode = val;
    localStorage.setItem(SYNC_CODE_KEY, syncCode);
    document.getElementById("syncForm").style.display = "none";
    syncReady = false;
    initSync();
  });

  window.addEventListener("online", schedulePush);

  // ---------- init ----------
  document.getElementById("deckMeta").textContent = DECK.length + " cards · Sections A–F";
  buildTreeUI();
  refreshFooterStats();
  refreshSetupScreen();
  showScreen("setup");
  initSync();
  setInterval(() => {
    refreshFooterStats();
    if (document.getElementById("setupScreen").style.display !== "none") refreshSetupScreen();
  }, 30000);
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
