,{"q":"What are the NPR\u2019s objectives?","a":"\u2022 Floor gives uniform baseline for industry\n\u2022 Easier to audit than DR or SR\n\u2022 Only reserve required if pass both exclusion tests\n\u2022 Can be used as allocation basis for DR/SR results","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"What is the deterministic PBR methodology?","a":"Determined in aggregate using single economic scenario\n1. PV of Cash Flow Approach\nAPV(Ben, Exp & Related)\nlooooooooooooooomooooooooooooooon\nInclude existing PLs & SA AV\n\u00b4 APV(Prems & Related)\nlooooooooooooomooooooooooooon\nInclude PL, reins, & derivative CFs\nDiscount rates vary by model segment (driven by assets in segment)\n2. Direct Iteration Approach\n  \u25e6 DR = starting asset amount that matures all future benefits & expenses\n  \u25e6 Project all CFs iteratively until balance found","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"What is the stochastic PBR methodology?","a":"Determined in aggregate using same CFs as deterministic\n1. Project model segment CFs using stochastically generated scenarios\n2. PV negative of projected statement value of assets\n  \u25e6 Discount rates = 1.05 \u02c6 1-year treasury scenario rates\n3. Sum amounts in (2) across all model segments at end/beginning of each\nprojection year\n4. Scenario reserve = sum of starting assets across all segments + max of values\nabove\n5. Stochastic reserve = CTE 70 of scenario reserve distribution","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"General assumption considerations for deterministic and stochastic PBRs?","a":"\u2022 Most assumptions = blend of company and industry experience\n  \u25e6 Higher company data credibility \u2192closer to company experience\n  \u25e6 \u201dPrudent estimate\u201d\n\u2022 Prescribed assumptions limited to:\n  \u25e6 Interest rate movements (DR only)\n  \u25e6 Equity performance (DR only)\n  \u25e6 Spreads over treasuries on reinvestment\n  \u25e6 Definition of industry mortality table and grading method\n  \u25e6 ULSG: definition of industry lapse table\n\u2022 Margins for adverse deviation and estimate error (non-stochastic\nassumptions)\n  \u25e6 Greater uncertainty \u2192larger margin \u2192larger reserve\n  \u25e6 Higher margin if credibility, data quality, assumption reliability are low","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"VM-20 mortality assumptions?","a":"\u2022 VM-20 prescribes company/industry blending table\n  \u25e6 Varies with credibility and \u201dsufficient data period\u201d\n\u2022 VM-20 prescribed margins vary by attained age\n  \u25e6 Company margins also vary with credibility\n\u2022 Mortality improvement assumptions:\n  \u25e6 Between experience date and valuation date:\n  \u25e6 Improve company exp using supported company-specific factors\n  \u25e6 Improve industry exp using SOA-published rates\n  \u25e6 After valuation date (future mortality):\n  \u25e6 Use VM-20 prescribed improvement rates","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"VM-20 policyholder behavior assumptions?","a":"PH behavior risk factors:\n\u2022 Premium payment patterns and premium persistency\n\u2022 Partial and full withdrawals (surrenders)\n\u2022 Allocation between investment options\n\u2022 Other PH benefit options\nVM-20 requirements:\n\u2022 Use experience from same block being modeled; else similar block\n\u2022 Include margin: lower credibility \u2192more conservative assumption\n\u2022 Dynamic assumptions consistent with economic scenario","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"VM-20 expense assumptions?","a":"Same assumption for DR and SR (except inflation effects)\nConsiderations:\n\u2022 Spread capital expenditures (IT, etc.)\n\u2022 Assume going concern\n\u2022 Expense basis\n  \u25e6 Align with actual expense\n  \u25e6 Consistent between new and in-force\n\u2022 Reflect inflation\n\u2022 NO future expense improvements\n\u2022 NO taxes\n\u2022 Consistency with related assumptions\nExpense types to include:\n1. Direct + indirect + overhead\n2. Acquisition expenses\n3. Expected future non-recurring\n4. Efficiencies from\ncombinations/mergers\nUse FULLY allocated expenses","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Compare reinsurance: rules-based vs. principles-based.","a":"Rules-Based\n\u2022 Mirror-image reserves (usually)\n\u2022 Ceding company reserve credit = reinsurer\u2019s assumed reserve\nPrinciples-Based\n\u2022 Mirror-image reserves not required (or likely)\n\u2022 Ceding company and reinsurer use own assumptions\n\u2022 Reins Reserve Credit = Pre-Reins Min Reserve \u00b4 Post-Reins Min Reserve\n  \u25e6 Pre-reins run: follow VM-20 assuming reins didn\u2019t exist\n  \u25e6 98% to 102% collar for starting assets does not apply\n\u2022 Reins features like stop-loss may require additional stochastic analysis\n\u2022 If YRT rates non-guaranteed: reserve credit based on pre-PBR approach","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Overview of asset modeling framework under VM-20?","a":"Existing Assets = SA Assets + PLs + Derivatives + GA Assets\n\u2022 \u201dSolve\u201d for GA Asset balance so total = 98% to 102% of reported reserve\n\u2022 Requires iterations\nReinvestment Assets\n\u2022 VM-20 prescribes yield spread\n\u2022 Reflect investment policies of company\n  \u25e6 Should not produce lower reserve than \u201dalternative investment strategy\u201d\n  \u25e6 VM-20 prescribes 50/50 mix of A and AA public non-callable corporate bonds\nReflect default costs on all modeled assets","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"List the criteria for a Clearly Defined Hedging Strategy (CDHS).","a":"1. Risks being hedged: cash flow, fee income, interest credits, etc.\n2. Hedging objectives\n3. Material risks not hedged: mortality, withdrawal, etc.\n4. Financial instruments used\n5. Trading rules and tolerances\n6. Metrics and frequency for effectiveness measurement\n7. Conditions and duration for non-hedging\n8. Responsible group or area\n9. Identified basis, gap, or assumption risks\n10. Ineffectiveness circumstances","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Overview of economic assumptions under VM-20?","a":"\u2022 Based on NAIC\u2019s Generator of Economic Scenarios (GOES)\n\u2022 GOES generates Treasury rates and S&P 500 total returns\n  \u25e6 Based on prescribed parameters (same for all companies)\n\u2022 GOES can generate up to 10,000 scenarios\n  \u25e6 Companies may use subset for SR\n  \u25e6 Subset use = simplification technique (must not materially understate reserves)\n\u2022 DR scenario is No. 12 from stochastic exclusion test set","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Outline the key roles and responsibilities for corporate governance under VM-20?","a":"1. Board of directors\n  \u25e6 Oversee management\u2019s process to correct material control weaknesses\n  \u25e6 Oversee PBR infrastructure / consistency with company\u2019s risk management\n  \u25e6 Interacts with senior management\n  \u25e6 Document reviews and actions\n2. Senior management\n  \u25e6 Establish PBR infrastructure and modeling resources\n  \u25e6 Review PBR assumptions, methods, and models\n  \u25e6 Review significant/unusual issues with PBR results\n  \u25e6 Adopt internal VM compliance controls\n3. Qualified actuary(ies)\n  \u25e6 Must meet Academy\u2019s qualification standards\n  \u25e6 Oversees PBR calculation\n  \u25e6 Develops internal standards for actuarial practices, controls, documentation\n  \u25e6 Summary report to board and senior management\n  \u25e6 Disclose significant unresolved issues to auditors/regulators\n  \u25e6 Issue VM certifications but not necessarily opinion on reserve adequacy","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Value of future experience submissions?","a":"\u2022 Helps regulators and reviewers\n  \u25e6 Easier to monitor, perform reasonableness checks, develop thresholds\n\u2022 Facilitates credibility-based blends\n\u2022 Provides database of inter-company experience\n\u2022 Data source for standard valuation table updates","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"Two PBR support components implemented by NAIC?","a":"1. Additional state actuarial resources\n  \u25e6 Aid in reviewing PBRs and supporting updates requirements/examination tools\n  \u25e6 Facilitate refinement and implementation of PBR requirements\n2. Valuation Analysis Working Group (VAWG)\n  \u25e6 Responds to states confidentially during annual PBR reviews/exams\n  \u25e6 Utilizes state actuarial resources to:\n  \u25e6 Assist with issues and questions\n  \u25e6 Maintain documentation/databases to increase support consistency\n  \u25e6 Provides analysis and recommendations for PBR issues to address in VM","source":"ILA101-110: Fundamentals of the PBA to Stat Reserves","reading":"ILA101-110: Fundamentals of the PBA to Stat Reserves","chapter":null,"section":"C"},{"q":"GAAP definition, primary audience, and information sources?","a":"GAAP = conventions, rules, and procedures defining accepted accounting practices\n\u2022 Provides transparency to capital providers and related audiences\n\u2022 Capital providers = stockholders and policyholders\n  \u25e6 Stock companies owned by stockholders\n  \u25e6 Mutual companies owned by policyholders\n\u2022 Financial statements = primary GAAP information source\n  \u25e6 Income statement, balance sheet, etc.\n\u2022 Other sources:\n  \u25e6 Conference calls with analysts\n  \u25e6 Responses to rule-makers\u2019 queries\n  \u25e6 Supplementary investor information\n  \u25e6 Press releases","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"Purpose of GAAP financial statements?","a":"\u2022 Summarizes enterprise\u2019s assets, liabilities, and transaction effects on earnings\n\u2022 Expressed in single, uniform currency unadjusted for inflation\n  \u25e6 Non-monetary info converted to monetary\n\u2022 Measures single entity, not entire industry\n  \u25e6 Subsidiaries consolidated into one set of statements\n\u2022 Reportable segments based on operating segments\n  \u25e6 Operating segment = relatively homogenous segment per company\u2019s\ndecision-makers\n  \u25e6 May differ company to company\n\u2022 Measured over clearly defined period (quarterly or annually)","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"List users of financial statements.","a":"\u2022 Capital providers (debt and equity)\n  \u25e6 Financial institutions\n  \u25e6 Investment banks\n  \u25e6 Private lenders\n  \u25e6 Commercial banks\n  \u25e6 Individual investors\n\u2022 Brokers and dealers in financial instruments issued by enterprise\n\u2022 Expert advisors to users\n  \u25e6 Attorneys, actuaries, accountants\n\u2022 Policyholders or other stakeholders","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"List parties with GAAP accounting oversight roles.","a":"\u2022 Management responsibilities:\n  \u25e6 Fair presentation per GAAP\n  \u25e6 Complete financial reporting process\n  \u25e6 Explain matters not evident in numerical info\n\u2022 Auditors: opine on fairness of presentation and internal control effectiveness\n  \u25e6 Independent external auditors \u2013 not employees (hired by/report to Board)\n  \u25e6 Opinions based on testing and COSO criteria\n  \u25e6 Internal auditors \u2013 can be employees or contracted third parties\n\u2022 Other regulatory bodies: SEC, IRS, state insurance departments\n\u2022 Users acting on behalf of others: stock analysts, rating agencies","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"Standard-setters for GAAP accounting?","a":"\u2022 Financial Accounting Standards Board (FASB)\n  \u25e6 Establishes uniform standards for financial statement contents\n  \u25e6 Maintains Accounting Standards Codification (ASC)\n  \u25e6 Issues Statements of Financial Accounting Concepts (SFACs)\n  \u25e6 Standardization reduces need for individual specific info requests\n\u2022 AICPA and PCAOB: issue standards for accountants and auditors\n  \u25e6 AICPA: American Institute of Certified Public Accountants\n  \u25e6 PCAOB: Public Company Accounting Oversight Board\n\u2022 SEC: ultimate regulator of US public companies\n  \u25e6 Can de-list or halt stock trading\n  \u25e6 Issues pronouncements: manuals, staff bulletins, enforcement releases","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"Meaning and importance of relevance and reliability for GAAP?","a":"Financial statement info must be relevant and reliable\n\u2022 Relevant info must be timely\n  \u25e6 Perfect info not valuable if too late\n\u2022 Relevant = consistent and comparable\n  \u25e6 Consistent = based on similar/identical measures from prior periods\n  \u25e6 Comparable = equivalent to measures used in other enterprises\n  \u25e6 Should be comparable across time periods\n  \u25e6 Prior results restated when errors surface\n  \u25e6 Some standards entity-specific (e.g. ASC 944 for insurers only)\n\u2022 Relevant = provides appropriate detail\n  \u25e6 Adequate detail informs without confusing\n\u2022 Reliable = materially accurate and verifiable\n\u2022 Reliability also implies \u201dfree of bias\u201d","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"Key relationships between GAAP balance sheet and comprehensive income?","a":"Balance Sheet: Assets = Liabilities + Equity\n\u2022 Equity = Assets \u00b4 Liabilities\n\u2022 Equity = Paid-In Stock + Paid-In Additional Capital + Retained Earnings\n\u2022 EOY Equity = BOY Equity + Comprehensive Income + Owner Transactions\n  \u25e6 Owner Transactions = Capital Contributions \u00b4 Dividends\nComprehensive Income = Net Income + Other Comprehensive Income (OCI)\n\u2022 Income Statement: Net Income = Revenues \u00b4 Expenses\n  \u25e6 Revenue = Premiums + Fees + InvInc + Realized Gains\n  \u25e6 Expenses = Benefits + Expenses \u00b4 Realized Losses\n\u2022 OCI = equity changes from gains/losses not central to operations\n  \u25e6 Changes in unrealized gains/losses on AFS assets\n  \u25e6 Shadow adjustments\n  \u25e6 MRB FV changes due to own credit risk","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"Define asset, liability, and equity per SFAC No. 8 (CON8 Ch4).","a":"SFAC No. 8 (\u201dCON8 Ch4\u201d) defines balance sheet elements:\n\u2022 Asset = present right of entity to economic benefit\n  \u25e6 Restricts others\u2019 access to asset\n  \u25e6 Provisions for losses required if probable future benefit \u00d3\n  \u25e6 Includes tangible (e.g. financial instruments) and intangible (e.g. goodwill)\n\u2022 Liability = present obligation of entity to transfer economic benefit\n  \u25e6 ASC 450 requires liabilities for contingent events that are probable and reasonably\nestimable\n\u2022 Equity = residual interest in entity\u2019s assets after deducting liabilities\n  \u25e6 Aka \u201dnet assets\u201d","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"SFAC No. 5 criteria for recognition and measurement?","a":"1. Definition: asset, liability, revenue, or expense\n2. Measurability: must have quantifiable attribute with sufficient reliability\n  \u25e6 Historical cost: easy via company records; adjust for depreciation\n  \u25e6 Fair value: from active secondary markets or expert appraisals\n  \u25e6 Present value: discount CFs at rate that can vary\n  \u25e6 Least preferable, but necessary for most ILA products\nAlways use uniform monetary units unadjusted for inflation\n3. Relevance: consistent, comparable, meaningful in users\u2019 decision-making\n4. Reliability: accurate, verifiable, free of bias","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"Compare cash basis vs. accrual accounting.","a":"\u2022 Cash basis is simplest\n  \u25e6 Record entries only when cash changes hands\n  \u25e6 Not appropriate for incomplete or long-term transactions (like life insurance)\n\u2022 Accrual alters timing of when cash transactions are recognized\n  \u25e6 Goal: earnings emerge proportionally to \u201dcompleteness\u201d of earnings process\n  \u25e6 Examples: reserves, DAC, unearned premium liabilities","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"What is the double-entry accounting system?","a":"GAAP predicated on double-entry accounting\nFinancial Statement\nAccount Type\nDebit\nCredit\nRevenue\n\u2013\n+\nIncome Statement\nExpense\n+\n\u2013\nBalance Sheet\nAsset\n+\n\u2013\nLiability or Equity\n\u2013\n+\nThis system ensures A = L + E always holds\n\u2022 Debits = \u2191assets and expenses\n\u2022 Credits = \u2191liabilities, equity, and revenue\n\u2022 Credits and debits always balance in any period","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"Considerations for materiality in GAAP financial statements?","a":"Key tradeoff: approximately correct, timely info \u0105 more accurate info too late\nEstimates should be precise enough for informed decisions\n\u2022 Some users require more precision than others\n\u2022 Material errors should be corrected\n\u2022 Immaterial imprecision doesn\u2019t need correction\n\u2022 \u201dImmaterial\u201d = impact won\u2019t influence decision-making\n  \u25e6 Requires judgment","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"List key disclosures required under GAAP.","a":"\u2022 Footnotes and narrative disclosures supplement primary financial statements\n  \u25e6 E.g. describe future liability not currently quantifiable\n\u2022 SEC Regulation S-K \u2013 market risk exposure impact on financial statements\n  \u25e6 Quantitative disclosures: market risk, earnings sensitivity\n  \u25e6 Qualitative info on exposures\n\u2022 Disclosures for accounting principle changes\n  \u25e6 ASC 250: accounting changes and error corrections\n  \u25e6 ASC 855: significant events between period end and statement release\n\u2022 Additional GAAP disclosures:\n  \u25e6 Company and product description\n  \u25e6 Summary of significant accounting policies\n  \u25e6 Details of invested assets\n  \u25e6 Details of reserves and accounting assets","source":"GAAP Ch. 1: GAAP Objectives and Their Implications","reading":"GAAP","chapter":"Ch. 1 \u2013 GAAP Objectives and Their Implications","section":"C"},{"q":"List acquisition costs capitalized in DAC (traditional & LP).","a":"Deferrable = incremental direct costs of successful acquisition:\n\u2022 Employee comp tied to selling, UW, issue, processing issued contracts\n\u2022 Other costs not incurred if the contract were not acquired\n\u2022 Commissions \u0105 ultimate (renewal) level\n\u2022 LP: all premium-based commissions (ultimate level = 0)\n\u2022 Certain direct marketing costs\nExpense all else as incurred (overhead, general advertising, unsuccessful efforts)\nIgnore premium taxes & FIT in the LFPB and DAC (exception: premium taxes on LP\ncontracts may be deferrable)","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Formulas for grouped DAC amortization and rollforward?","a":"AmortRatiot \u201c\nBOY DACt ` Capt\n\u0159\ns\u011bt expected BOYIFs\nAmortt \u201c AmortRatiot \u02c6 BOYIFt\nEOY DACt \u201c BOY DACt ` Capt \u00b4 Amortt \u00b4 True-upt\n\u2022 Yr 1: Amort1 = Deferrable \u02c6 BOYIF1 / \u0159BOYIF\n\u2022 Constant-level basis: amount/units inforce (initial DB if non-level)\n\u2022 No interest accretion on DAC","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Describe the DAC experience true-up (unlocking).","a":"True-upt \u201c DACt \u02c6 expected BOYIFt \u00b4 actual BOYIFt\nexpected BOYIFt\n\u2022 Actual IF \u0103 expected \u2192write DAC down (extra amortization)\n\u2022 One-sided: no adjustment if more persist than expected\n\u2022 Revise future amort prospectively over the new inforce projection\n\u2022 True-up is just extra amort; total amort + true-ups = deferrable","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Considerations for cohort grouping and unit of account?","a":"Contract grouping necessary to calculate NPR\n\u2022 NPR based on group experience/assumptions\n\u2022 Reserves can still be calculated at contract level\nGroups must consist of same cohort (issued within 1 year)\nContracts in group should be similar by:\n\u2022 Type (e.g. don\u2019t mix term and WL)\n\u2022 Contract length\n\u2022 Premium paying period (don\u2019t mix LP and non-LP)\n\u2022 Rating class\n\u2022 Issue age (possibly banded)\n\u2022 Face amount band\nMore (smaller) groups \u2192\u2191assumption precision, BUT:\n\u2022 Credibility \u2193\n\u2022 NPR more likely to be capped","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"LFPB for traditional nonpar insurance?","a":"NPRt \u201c PV0(Actual Benefits Through t) + PV0(Expected Benefits After t)\nPV0(Actual GPs Through t) + PV0(Expected GPs After t)\nLFPBt \u201c PVFBt \u00b4 NPRt \u02c6 PVGPt\n\u201c pLFPBt\u00b41 ` NPRt \u02c6 GPtqp1 ` iq \u00b4 Bent\n\u201c LFPBt\u00b41 ` NPt ` Accretiont \u00b4 Bent\n\u2022 NPR calculated at group level and capped at 100%\n\u2022 \u201dBenefits\u201d = DBs, maturities, CSV, and claim/termination-related expenses (LAE)\n\u2022 CF assumptions = best estimates without PADs revised at least annually\n\u2022 Discount rate = upper-medium grade yields (A-rated)\n  \u25e6 Maximize relevant observable inputs; minimize unobservable\n  \u25e6 Must reflect duration characteristics of liabilities\n  \u25e6 Can be curve or blended single rate\n  \u25e6 Measure LFPB at original (accretion rate) and current DR\n\u2022 LFPB can\u2019t be negative at group level: floor at 0","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Rules for truing up NPR for traditional long-duration insurance?","a":"\u2022 CF assumptions not locked in at issue\n\u2022 Recalculate (\u201dtrue-up\u201d) NPR from issue (at least annually)\nNPRt \u201c PV0(Actual Benefits Through t) + PV0(Expected Benefits After t)\nPV0(Actual GPs Through t) + PV0(Expected GPs After t)\n  \u25e6 Replace estimated CFs with actuals\n  \u25e6 Must revise/re-confirm assumptions when CFs updated\n  \u25e6 Use original discount rate (\u201daccretion interest rate\u201d)\n\u2022 NPR can be updated more frequently than annually (e.g. quarterly)\n  \u25e6 Review at same time each year\n  \u25e6 Interim reviews may be needed:\n  \u25e6 Special situations: pandemics, medical advances, competitive changes\n  \u25e6 Other significant developments\n  \u25e6 Must update all CF components\n  \u25e6 Must address all assumptions (exception: LAE can be locked-in)","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"How to quantify and present remeasurement gains/losses?","a":"ASC 944 requires separate remeasurement loss/gain line on income statement\nTotal effect on income when benefits deviate from expected:\nActual Benefits Incurred\n` Remeasurement Loss\n(\u201c Revised BOP LFPB \u00b4 Original BOP LFPB)\n` Change in Reserve\n(\u201c EOP LFPB \u00b4 Revised BOP LFPB)\n\u201c Total Benefit Expense\nCalculate all items above using at-inception DR (accretion interest rate)","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"How to present GAAP net income on income statement and in SOE format for\ntraditional nonpar?","a":"GAAP net income =\nGAAP Revenue = Gross Premiums + Net Investment Income\n\u00b4 GAAP Expenses = DBs + SBs + IncrLFPB + Non-Def Exp + DAC Amort\nSOE Format:\nEarnings Source\nFormula\n(`)\nPremium Load\nGP \u00b4 NP\n(`)\nInterest Spread\nNII \u00b4 Accretion\n(\u00b4)\nAcquisition Costs\nDAC Amort + Non-Def AcqCost\n(\u00b4)\nAll Other Expenses\nMaintExp + RenewalComm + PremTax + Overhead\n(\u00b4)\nBenefit Deviation\nActual Benefits \u00b4 Expected Benefits\n(`)\nOther Reserve Unlock\nIncrLFPB Before NPR Unlock \u00b4 IncrLFPB After NPR Unlock\n` Int Spread Before NPR Unlock \u00b4 Int Spread After NPR Unlock\n` Prem Load Before NPR Unlock \u00b4 Prem Load After NPR Unlock\n\u201c\nGAAP Net Income\nDAC is non-interest-bearing: large early DAC \u2193invested assets \u2192\u2193early interest spread \u2192contributes\nto yr-1 loss (amort largest in yr 1)","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"ASOP 10 guidance for setting best estimate assumptions?","a":"\u2022 Use best estimates without conservatism or PADs\n\u2022 Best estimate = \u201dmost likely, average, or central\u201d outcome\n  \u25e6 Corresponds to mode, mean, or median of probability distribution\n  \u25e6 Other interpretations possible\n\u2022 Considerations when selecting best estimates:\n  \u25e6 Characteristics/magnitude of company\u2019s business\n  \u25e6 Company maturity and growth rate\n  \u25e6 Company\u2019s prior experience and trends\n  \u25e6 Medical, economic, social, technological developments\n  \u25e6 Actual recent company experience (if relevant and credible)\n  \u25e6 Relevant industry data to supplement company experience\n  \u25e6 ASOP 23 for data quality issues","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Considerations for mortality and lapse assumptions for traditional nonpar?","a":"Mortality\n\u2022 Typically based on company experience studies\n\u2022 New products may require industry experience, adjusted as needed\n\u2022 Reflect marketing and UW practices\n\u2022 Reflect historical mortality improvement if actuary believes it will continue\n\u2022 Can be dependent on lapses (anti-selection)\nLapse rates\n\u2022 Account for face, issue year/age, duration, premium paying period/frequency\n\u2022 Composite rates should account for current and future business mix","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Assumption considerations for non-fixed premiums?","a":"\u2022 Most nonpar trad contracts have fixed premiums\n  \u25e6 Fixed premiums = contract parameter, not assumption\n\u2022 Examples with adjustable premiums:\n  \u25e6 Many term policies: premiums adjustable up to contract maximum\n  \u25e6 Indeterminate premium contracts: premiums reset prospectively if assumptions\nchange\n\u2022 Adjustable premiums require best estimate assumption considering:\n  \u25e6 Current premium levels\n  \u25e6 Historical premium patterns\n  \u25e6 Expectations of future increases/decreases\n  \u25e6 Contractually guaranteed maximum premiums\n\u2022 Include actual premiums when unlocking NPR\n\u2022 Indeterminate premium policies are UL-type if satisfying 1 of:\n  \u25e6 Stated account balance with interest credits/charges not fixed/guaranteed\n  \u25e6 Interest rates and market conditions mainly drive changes in contract elements","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Treatment of coupons, dividends, and conversion privileges for traditional nonpar?","a":"\u2022 LFPB should reflect coupons, endowments, and conversion privileges\n\u2022 Dividend-paying policies not following contribution principle:\n  \u25e6 Dividend revisions may follow different schedule than other assumption revisions\n  \u25e6 Dividend scale slope impacts LFPB\n  \u25e6 May create anomalies when dividend elements don\u2019t align with current experience\n  \u25e6 E.g. dividend investment return assumption may not match current returns\n  \u25e6 PH dividend option utilization usually not reflected in LFPB\n  \u25e6 Assume dividends always paid in cash\n\u2022 If shareholder dividends restricted, establish UPPEA\n  \u25e6 Do not include PH dividends in LFPB when using UPPEA","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Accounting for riders on traditional nonpar?","a":"If rider can\u2019t exist standalone (e.g. premium waiver, LTCI/CI combo):\n\u2022 Treat base + rider as single unit\n\u2022 Include rider charges and benefits in LFPB\n\u2022 Include deferrable acquisition costs in DAC\n\u2022 Riders often profitable \u2192will lower NPR, all else equal\nSeparate riders insuring risk other than base contract\n\u2022 Examples: disability income riders, spouse term riders\n\u2022 Assumptions should be internally consistent with base\n\u2022 In some situations, insurers set rider GAAP reserve = stat reserve\n  \u25e6 Appropriate if not materially different","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"GAAP valuation approaches for disability waiver riders?","a":"If disability not occurred:\n1. Gross approach \u2013 value rider separately from base\n  \u25e6 Reserve = PV expected waived premiums \u00b4 NPR \u02c6 PV expected rider charges\n2. Net approach \u2013 integrate rider with base\n  \u25e6 Reduce base contract premiums for expected waived amounts\nMortality assumption approaches:\n\u2022 Could use higher mortality for contracts with active disability\n\u2022 Could use averaged mortality assumption for all contracts (disabled or not)\n\u2022 Consider credibility/availability of disabled life mortality data","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Rules for updating discount rates on traditional nonpar?","a":"Update every reporting period (even if not addressing CF assumptions)\nChange in LFPB from new discount rates \u2192OCI\nOCIt \u201c AOCIt \u00b4 AOCIt\u00b41\nAOCIt \u201c accumulated OCI at time t\n\u201c LFPBt based on original DR \u00b4 LFPBt based on current DR\nDo NOT recalculate NPR using current DR\n\u2022 Always use NPR from most recent CF experience/assumption unlocking\nOCI accounting reduces GAAP equity volatility\n\u2022 LFPB on balance sheet based on current discount rates\n\u2022 When interest rates \u2191: AFS asset FV and LFPB \u201dFV\u201d \u2193\n\u2022 Reductions in AFS asset FV \u2192negative OCI\n\u2022 Reductions in LFPB \u201dFV\u201d \u2192positive OCI","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Compare 3 approaches for locked-in interest accretion when using discount rate curve.","a":"3 approaches for locking in curve of accretion rates:\n1. Spot rate \u2013 use original spot rates for each CF through time\n2. Forward rate \u2013 use implied period-specific forward rates\n3. Effective yield \u2013 use IRR based on spot curve\nDifferences:\n\u2022 Effective yield may exceed long-term spot rates if premiums payable over multiple\nyears and yield curve upward sloping\n  \u25e6 From \u201dleveraging effect\u201d: premiums \u00bf benefits in early years, then reverses\n  \u25e6 Can cause spot rate accretion \u00bf effective yield method\n\u2022 Spot rate interest accretion may better match investment income\n\u2022 Forward rate usually produces least accretion in early years\n  \u25e6 Accretion in later years very high (may exceed investment income)\n  \u25e6 Also \u2192lower early reserves\n  \u25e6 Forward curves tend to dip/spike \u2192affects interest accretion","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Practical challenges and solutions for multiple issue dates within cohort?","a":"Locked-in DRs must reflect rate environment when contracts sold\n\u2022 Challenge: interest rates vary throughout issue year\n\u2022 May prevent using single yield curve at BOY/MOY/EOY\nPossible solutions\n\u2022 Use average curve\n  \u25e6 Could be weighted (e.g. by premium) or simple\n  \u25e6 Could average only key dates (e.g. month-ends)\n\u2022 Use provisional yield curve(s)\n  \u25e6 Lock in final yield curve(s) at EOY\n\u2022 Set DRs by sub-cohorts (e.g. monthly, quarterly)\n  \u25e6 Avoids provisional yield curves\n  \u25e6 NPR and cap still set at cohort level","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"How to apply ASC 820 guidance for unobservable discount rates?","a":"Follow ASC 820 level 3 measurement:\n\u2022 Reflect market participants\u2019 assumptions to price assets/liabilities, including risk\n\u2022 Reflect risk in both valuation technique and inputs\n\u2022 Reduce DRs by margin to reflect significant uncertainty from lack of market activity\n\u2022 Insurer\u2019s own data should be adjusted to reflect market participant\u2019s perspective\n  \u25e6 Doesn\u2019t need to be exhaustive effort\nApproaches when no A-rated rates for foreign currency:\n\u2022 Use highest available rating instead\n\u2022 Subtract assumed spread from highest rated rates","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Techniques for estimating long-dated interest rates?","a":"1. Interpolate between last observable rate and assumed LT rate\n2. Determine forward rate from last observable rate and extrapolate\n3. Add A-rated spread for shorter rates to longer risk-free rates\n  \u25e6 Often risk-free rate curve extends beyond A-rated curve\n  \u25e6 Assume A-rated spreads over risk-free rates constant\n  \u25e6 Can augment either other method","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Nature of limited-pay contracts and how they\u2019re accounted for?","a":"LP contracts have premium payment periods \u00a1 coverage period\n\u2022 Single-pay, 10-pay, 20-pay, payments to age 65, etc.\n\u2022 Also includes life payout annuities (usually single premium)\n\u2022 Problem: high profit during premium period, then losses\nSolution: defer GP in excess of NP\n\u2022 Life insurance: DPL amortized vs. discounted inforce\n  \u25e6 If experience = assumptions, profits emerge as level % of inforce\n\u2022 Payout annuities: DPL amortized vs. PV future benefits\n\u2022 Use same CF assumptions and accretion rates as LFPB\n  \u25e6 Update experience/assumptions when LFPB updated\n  \u25e6 Do not update discount rate","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"How to determine DPL for limited-pay traditional nonpar?","a":"1. Determine annual profit to defer\nProfitt \u201c p1 \u00b4 NPRq \u02c6 GPt\n2. Calculate DPL as constant % of inforce\nDPL% \u201c\nPV0pProfitq\nPV0pBOYIF\u02daq\nDPLt \u201c DPL% \u02c6 PVtpBOYIF\u02daq \u00b4 PVtpProfitq\n\u201c pDPLt\u00b41 ` Profittq \u02c6 p1 ` iq \u00b4 DPL% \u02c6 BOYIF\u02da\nt\u00b41\nDiscount BOYIF\u02da as of EOY\n3. Include \u2191in DPL on income statement as expense\n  \u25e6 As profit capitalized, DPL \u2191to offset and defer it\n  \u25e6 DPL \u2193each period after premiums end releasing profit into income","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Define restricted dividends.","a":"Shareholder dividends may be restricted by law/charter/policy form\n\u2022 Protects PHs\u2019 share of profits (future PH dividends)\n\u2022 PH surplus share excluded from stockholder equity\nWhen restricted dividends exist, insurer must establish UPPEA\n\u2022 UPPEA = deferred surplus (profits) paid as future PH dividends\n\u2022 Smooths net income \u2192more even stream of shareholder dividends\n\u2022 Do not include dividends in LFPB","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"How to calculate UPPEA?","a":"Assuming shareholder dividends restricted to 10% of surplus:\n1. Project GAAP income statement\n2. Calculate GAAP net income ignoring PH dividends\n3. Calculate running total of GAAP surplus before PH dividends\nCumSurplust \u201c CumSurplust\u00b41 ` NetIncomeBeforet\n4. Calculate running total of PH dividends paid\n5. UPPEAt \u201c 0.90 \u02c6 CumSurplust \u00b4 CumPHDivst\n6. Calculate final GAAP net income:\nNetIncomet \u201c NetIncomeBeforet \u00b4 PHDivst \u00b4 \u2206UPPEAt\nShadow UPPEA may be needed to offset OCI from AFS assets\n\u2022 Changes in shadow UPPEA \u2192OCI","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Examples and characteristics of claims liabilities?","a":"Claims liabilities established for:\n\u2022 Pending death claims\n\u2022 Resisted claims\n\u2022 Incurred but not reported (IBNR)\nCharacteristics:\n\u2022 Usually not discounted (paid out soon)\n\u2022 Less significant for life insurance (claims paid quickly)\n\u2022 IBNR can be shown separately on balance sheet or included with LFPB\n\u2022 Allocate change in total IBNR to cohorts using \u201drational allocation\u201d method\n  \u25e6 Liabilities for pending/resisted claims tied to original cohort more easily","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Accounting for premium accruals?","a":"Reported separately on GAAP balance sheet:\n\u2022 Advance premium liability \u2013 offsets premiums paid in advance\n\u2022 Receivable asset for due/unpaid premiums \u2013 \u2191income in place of premiums\nNetted against or added GAAP reserve (don\u2019t report separately):\n\u2022 DPA for non-annual modes (relevant to mean reserves)\n\u2022 UPL (relevant to midterminal reserves)","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Challenges in explaining change in LFPB to others?","a":"\u2022 New policies more sensitive (more affected by PV effects)\n  \u25e6 Opposite for older policies (\u2193future CFs remaining)\n\u2022 Reserve sensitivity \u2191with NPR (max sensitivity at 100% cap)\n\u2022 Many experience/assumption changes impact both benefits and premiums\n\u2022 Deviations in current experience also impact future experience\n\u2022 If experience only updated annually, impact affected by deviations in prior periods\n\u2022 1 \u00b4 NPR = insurer\u2019s best estimate profit margin (excluding expenses)\n  \u25e6 Changes every time NPR changes","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Considerations for interim reporting?","a":"Interim reporting \u2013 many insurers report GAAP earnings quarterly\n\u2022 Will \u2191volatility for insurers not updating NPR each quarter\n\u2022 Prior quarterly results can\u2019t be restated at EOY (must stand on their own)\n\u2022 Will likely cause results to differ from annual-only reporting","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"Disaggregated rollforward disclosure requirement for traditional nonpar?","a":"Key disclosure: YTD disaggregated tabular rollforward of GAAP reserve from\nbeginning to ending balance\n\u2022 Must be gross of reinsurance recoverables and include any DPL\n\u2022 Show future NPs and expected benefits separately\n\u2022 Aggregation level should align with insurer\u2019s business\n  \u25e6 Separate balances by geography, LOB, distribution channel, etc.\nExamples of potentially relevant items:\n\u2022 Newly issued contracts\n\u2022 Accrued interest and NPs collected\n\u2022 Benefit and expense payments\n\u2022 Derecognition of contracts due to death or lapse\n\u2022 Details around true-ups, unlocking, discount rate updates, etc.","source":"GAAP Ch. 5: Nonparticipating Traditional Life Insurance","reading":"GAAP","chapter":"Ch. 5 \u2013 Nonparticipating Traditional Life Insurance","section":"C"},{"q":"IFRS 17 scope, general measurement model, and effective date?","a":"Scope: contracts meeting IFRS 17 definition of insurance contract\nGeneral measurement model\n\u2022 Liability = Fulfillment Cash Flows (FCF) + Contractual Service Margin (CSM)\n\u2022 FCF = PV expected CFs + risk adjustment for non-financial risk\n\u2022 CSM = unearned profit released as insurer provides services\n\u2022 Assumptions each reporting date = current estimates\n\u2022 Simplifications/modifications to GMM:\n  \u25e6 PAA for short-duration coverages\n  \u25e6 VFA for investment contracts with discretionary participation features\n  \u25e6 Modified GMM for reinsurance contracts held\nEffective date: January 1, 2023\n\u2022 Early adoption concurrent with IFRS 9 (financial instruments) allowed","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"IFRS 17 presentation requirements?","a":"\u2022 Separate P&L into:\n1. Insurance service result (earnings from insurance components)\n2. Insurance finance income/expense (earnings from investment components)\n  \u25e6 Can be further disaggregated between P&L and OCI\n\u2022 Insurance revenue reflects changes in liability for future services\n  \u25e6 Excludes investment components and premium","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"How will IFRS 17 impact how insurers\u2019 earnings are compared and measured?","a":"\u2022 \u2191global comparability/transparency of insurers\u2019 financial health\n\u2022 Greater volatility in financial results and equity\n  \u25e6 Key driver: use of current market discount rates\n  \u25e6 \u2191visibility of economic mismatches between assets/liabilities\n  \u25e6 Product design and/or investment allocation may change in response\n\u2022 Key financial metrics will change\n  \u25e6 Premium volumes no longer key earnings driver\n  \u25e6 Profit emergence may change significantly\n\u2022 Clearer earnings picture: separation of financial vs. insurance drivers\n\u2022 Life vs. non-life sector impacts\n  \u25e6 Bigger impact for life insurers:\n  \u25e6 Significant change: No more locked-in assumptions\n  \u25e6 More visibility on minimum interest guarantees\n  \u25e6 Non-life insurers will want to qualify for PAA to maintain familiarity","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"List ways IFRS 17 will impact insurers\u2019 processes.","a":"\u2022 New routines\n  \u25e6 Identifying and accounting for onerous contracts\n  \u25e6 Presenting explicit margin for non-financial risk\n  \u25e6 Accounting for ceded reinsurance separately from direct contracts\n\u2022 Communication challenges\n  \u25e6 New presentation and disclosure requirements\n  \u25e6 New KPIs\n  \u25e6 Education for internal and external users\n\u2022 New data, systems, process, and control demands\n  \u25e6 Key challenges: long time-horizon typical for insurance \u2014 legacy systems\n  \u25e6 Will require new controls and upgrades\n\u2022 Scarce resources under pressure\n  \u25e6 IFRS 17 requires significant human talent/resources\n\u2022 Opportunities for streamlining and greater efficiency\n\u2022 2nd order impacts: IFRS 17 will trigger new tax/regulatory requirements","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Definition of insurance contract under IFRS 17?","a":"Insurance contract \u2013 when one party (issuer) accepts significant insurance risk from\nanother (PH)\n\u2022 Entitles PH to compensation from issuer when insured event occurs\n\u2022 Must be enforceable by law\n\u2022 Doesn\u2019t have to be written (can be oral, etc.)\n\u2022 Doesn\u2019t include financial instruments or service agreements\n\u2022 Includes contracts issued by mutual entities even though PHs bear pooled risk","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Define \u201dinsurance risk\u201d under IFRS 17 and provide examples of insurance vs.\nnon-insurance risks.","a":"Insurance contracts expose issuer to insurance risk or insurance and financial\nrisk\nInsurance risk \u2013 non-financial risk transferred from PH to issuer\nExamples of insurance risks:\n\u2022 Death or survival\n\u2022 Injury, illness, or disability\n\u2022 Property loss due to damage/theft\n\u2022 Failure to make debt payment when due\n\u2022 Any other non-financial variable specific to contract party\nExamples of financial risks:\n\u2022 Interest rates\n\u2022 Prices of financial instruments or commodities\n\u2022 Currency exchange rates\n\u2022 Price/rate indices\n\u2022 Credit ratings/indices\n\u2022 Any other financial variable specific to contract party","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Treatment of catastrophe-type non-financial variables under IFRS 17?","a":"Non-financial variables must be specific to a party to be insurance risks\n\u2022 Insurance risks:\n  \u25e6 Contract covering weather event damaging PH\u2019s assets\n  \u25e6 Insurance swaps triggered by climate variable specific to contract party\n\u2022 Not insurance risks (not specific to contract party):\n  \u25e6 Contract based on regional weather index\n  \u25e6 Cat bonds with principal/interest impacted by climate variables\nLoan or bond = insurance contract if principal/interest can be adversely impacted by\nuncertain non-financial events affecting debtor\n\u2022 Example: Loan balance forgiven on death of debtor\n\u2022 Insurance contract issuer = bondholder (aka investor or lender)","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Treatment of residual value guarantee-type non-financial variables under IFRS 17?","a":"Insurance contracts if cover risk of changes in FV of specific non-financial asset held\nby contract party\n\u2022 Not insurance contracts if only covers risk of changes in market prices\nResidual value guarantee on vehicle:\n\u2022 Insurance contract if:\n  \u25e6 Guarantees residual value of vehicle\n  \u25e6 Amount payable varies with vehicle condition when sold\n\u2022 Not insurance contract if vehicle must be restored to specified condition","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"How to assess significant insurance risk under IFRS 17?","a":"Insurance risk is significant if a scenario with commercial substance exists\nwhere on PV basis, issuer could:\n1. Suffer loss caused by insured event\n2. Pay significantly more than if event didn\u2019t occur\nAdditional considerations:\n\u2022 Assess at contract level\n\u2022 Insurance risk can be significant even if:\n  \u25e6 Insured event extremely unlikely\n  \u25e6 Expected PV contingent CFs / Expected PV all CFs is small\n  \u25e6 Always consider TVM\n  \u25e6 Significant insurance risk may not be present if issuer can delay timely\nreimbursement","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Additional considerations when assessing insurance risk (review back).","a":"\u2022 Insurance contract must involve uncertainty with one of:\n  \u25e6 Probability of insured event\n  \u25e6 Timing of insured event\n  \u25e6 Amount payable if insured event occurs\n\u2022 PH must suffer adverse effect to receive compensation\n  \u25e6 Lapse/persistency and expense risks not adverse to PH\n  \u25e6 Insurer could transfer these risks to another entity to create insurance contract\n  \u25e6 Second entity would apply IFRS 17, but not first\n\u2022 Investment contract may become insurance contract in future\n  \u25e6 Example: deferred annuity allowing annuitization into life annuity\n\u2022 Reinsurance contract = insurance contract if either:\n  \u25e6 Exposes reinsurer to significant loss\n  \u25e6 Transfers substantially all insurance risk on reinsured business","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Define investment contracts with discretionary participation features.","a":"Investment contract with DPF pays amounts that are:\n1. Expected to be significant portion of total contractual benefits\n2. Paid at issuer\u2019s discretion (timing or amount)\n3. Contractually based on:\n  \u25e6 Returns on specified pool of contracts\n  \u25e6 Realized/unrealized returns on specified pool of assets held by issuer\n  \u25e6 Profit or loss of issuer\nNOT insurance contracts, but follow IFRS 17 if issued by entity that\nalso issues insurance\n\u2022 If issued by any other entity, follow IAS 32, IFRS 7, and/or IFRS 9","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Treatment of fixed-fee service contracts under IFRS 17?","a":"Fixed-fee service contract \u2013 contract where service level depends on uncertain event\n\u2022 These are insurance contracts\n\u2022 Example: issuer charges fixed fee; agrees to repair car if breaks down\nCan apply IFRS 15 if meets these conditions:\n\u2022 Contract price doesn\u2019t reflect individual customer risk\n\u2022 Compensation = service, not cash\n\u2022 Insurance risk arises primarily from uncertainty in service usage frequency\nIFRS 15 choice made for individual contracts and can\u2019t be changed","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Treatment of financial guarantee contracts under IFRS 17?","a":"Reimburse PH for losses when specified debtor fails to make payment\n\u2022 Usually meets insurance contract definition\n\u2022 Not insurance if PH doesn\u2019t incur loss\nIFRS 17 can be optionally applied if issuer regards FGCs as insurance contracts and\naccounts for them as such\n\u2022 Election made contract-by-contract and can\u2019t be changed","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Initial recognition of insurance contracts under IFRS 17 GMM?","a":"Initial Liability = Initial FCF + Initial CSM\n\u2022 FCF = risk-adjusted PV of insurer\u2019s rights and obligations to PHs\n  \u25e6 Reflects expected CFs, TVM, and risk adjustment\n  \u25e6 FCF = PV expected CFs + risk adjustment for non-financial risk\n  \u25e6 Expected CFs based on current estimates\n  \u25e6 Risk adj = compensation required to bear uncertainty in amount/timing of\nnon-financial CFs\n\u2022 CSM = unearned profit recognized as insurer provides services\n  \u25e6 Includes effects of CFs occurring on recognition date\n  \u25e6 Includes de-recognition of any A/L previously recognized before IFRS 17\nFor profitable groups, Initial FCF \u0103 0\n\u2022 Set CSM = \u00b4FCF \u2192no gain at inception (all profit deferred)\nFor onerous (non-profitable) groups, Initial FCF \u0105 0\n\u2022 Set CSM = 0 (no profit to defer; recognize loss immediately)\n\u2022 Amount of FCF called Loss Component","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Subsequent recognition of insurance contracts under IFRS 17 GMM?","a":"Liability after inception = sum of:\n\u2022 Liability for remaining coverage = FCF for future services + remaining CSM\n  \u25e6 Always measured at current estimates\n\u2022 Liability for incurred claims\nChanges in FCF broken into:\n\u2022 TVM effects: recognize in statement of financial performance\n\u2022 Changes related to past/current service: recognize in P&L\n\u2022 Changes related to discount rates: recognize in OCI\n\u2022 Changes related to future services (e.g. assumption revisions)\n  \u25e6 CSM adjusted to offset these\nInterest accretes on CSM each period using original DR","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Basic IFRS 17 aggregation requirements?","a":"All contracts must be aggregated into groups on initial recognition:\n1. Onerous contracts\n2. Contracts with no significant possibility of becoming onerous\n3. All remaining contracts\nContracts within each group issued within 1 year of each other","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Broad steps in IFRS 17 aggregation process?","a":"1. Identify portfolios of insurance contracts (term, WL, SPDAs, etc.)\n  \u25e6 Portfolio = contracts with similar risks managed together\n2. Group onerous contracts within each portfolio\n  \u25e6 Can assess in sets only if supportable; otherwise assess individual contracts\n  \u25e6 Contracts priced to be very competitive more likely onerous\n  \u25e6 Identification more challenging if more variation in:\n  \u25e6 Pricing\n  \u25e6 UW practices\n  \u25e6 Contract features/benefits\n  \u25e6 Distribution channel and marketing method\n3. Group profitable contracts based on possibility of becoming onerous\n  \u25e6 As with onerous, set-level assessment allowed if supportable\n  \u25e6 Possibility of becoming onerous based on:\n  \u25e6 Estimates from entity\u2019s internal reporting\n  \u25e6 Likelihood that assumption changes could make contract onerous\n  \u25e6 Analysis requires judgment; focus on most sensitive assumptions\n  \u25e6 Gathering info beyond internal reporting not required\n  \u25e6 Smaller initial CSMs more likely to become onerous","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"What is the premium allocation approach under IFRS 17?","a":"PAA similar to US GAAP short-duration accounting\n\u2022 Liability for remaining coverage = unearned premium reduced for acquisition costs\n\u2022 Assumed to produce results similar to GMM\nAutomatically eligible: contracts with coverage periods \u010f 1 year\nOther contracts: eligible if PAA measurement doesn\u2019t differ materially from GMM\n\u2022 Key requirement: FCF can\u2019t have significant variability before incurred claims\nMany GI/P&C contracts qualify (short coverage periods, no EDs)\nMost life insurance contracts do not qualify for PAA\n\u2022 Insurers may choose to apply GMM to all contracts for consistency anyway","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"How to determine FCF variability level for PAA eligibility?","a":"Factors that \u2191variability in FCFs:\n\u2022 Existence of embedded derivatives\n\u2022 Length of coverage period\nConsiderations when determining FCF variability:\n\u2022 Key market/risk factors (e.g. interest rates, adjustable premiums)\n\u2022 Pricing information\n\u2022 Sensitivity analysis: could establish \u201dmargin of difference\u201d\n\u2022 Perform analysis more often in unstable interest rate environments","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Definition of direct participating contract under IFRS 17?","a":"Direct participating contracts = specific type of participation contract under IFRS 17\n\u2022 Obligation to PH = FV of Underlying Items \u00b4 Variable Fee\nInsurance contract is direct participating contract when:\n\u2022 Contractual terms specify PH participates in share of clearly identified pool of\nunderlying items\n\u2022 Entity expects to pay PH amount = substantial share of FV returns on underlying\nitems\n\u2022 Entity expects substantial proportion of change in amounts payable to vary with\nchange in FV of underlying items\nAssess criteria at inception and never again unless contract modified\nIf all criteria met, contract can follow variable fee approach (VFA)","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Key differences between IFRS 17 GMM and VFA?","a":"\u2022 Changes in FCF arising from TVM and financial risks\n  \u25e6 GMM: Recognize immediately in insurance finance income/expense\n  \u25e6 VFA: Recognize in CSM (provided CSM \u0105 0)\n  \u25e6 Insurer\u2019s share regarded as part of variable fee\n\u2022 Interest rate accreted to CSM\n  \u25e6 GMM: Interest rate at initial recognition\n  \u25e6 VFA: None since CSM remeasured for changes in financial risks","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Meaning of \u201dcontractual terms\u201d in definition of insurance contract with direct\nparticipation features?","a":"Link to underlying items must be enforceable by law\n\u2022 Sometimes by regulator on behalf of PH\n\u2022 Agreement doesn\u2019t need to be written: can be oral, electronic, etc.\n\u2022 Practice can vary across legal jurisdiction and industry","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Meaning of \u201dclearly identified pool of underlying items\u201d in definition of insurance\ncontract with direct participation features?","a":"\u2022 \u201dPool\u201d can be anything as long as clearly identified in contract\n  \u25e6 Examples: portfolio of assets or net assets of entity\n\u2022 Entity not required to hold pool\n\u2022 Underlying items don\u2019t have to exist for contract duration\n\u2022 Clearly identified pool does NOT exist when:\n  \u25e6 Entity can retrospectively change underlying items\n  \u25e6 No underlying items identified\n\u2022 Suppose insurer issues 2 types of contracts with discretionary credited rates:\n  \u25e6 Contract X: Credited rate = 3% currently\n  \u25e6 Does not create link with any clearly identified underlying items\n  \u25e6 Contract Y: Credited rate = return on defined portfolio minus 0.5% margin\n  \u25e6 Does create link","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Meaning of \u201dsubstantial\u201d in definition of insurance contract with direct participation\nfeatures?","a":"Meaning of \u201dsubstantial\u201d in \u201dsubstantial share\u201d and \u201dsubstantial proportion\u201d\n\u2022 \u201dSubstantial\u201d based on how much discretion entity expects to exercise\n\u2022 Use probability-weighted average across scenarios\n  \u25e6 In some scenarios, FV returns will exceed guaranteed minimums","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Treatment of reinsurance under IFRS 17?","a":"IFRS 17 defines two broad types of reinsurance contracts\n1. Reinsurance contracts issued (reinsurance assumed)\n  \u25e6 Follow GMM\n2. Reinsurance contracts held (ceded reinsurance)\n  \u25e6 Apply GMM with modifications\n  \u25e6 Account for reins held separately from underlying contracts\n  \u25e6 Obligations for underlying contracts remain after reins","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"What is the modified GMM for reinsurance contracts held?","a":"Modified GMM for reinsurance contracts held reflects that:\n\u2022 Ceded reins usually asset, not liability\n\u2022 Reins contracts separate from underlying contracts\n\u2022 Ceding company pays reinsurer premium; reinsurer reimburses ceding company\n\u2022 Ceding companies usually don\u2019t profit from reins contracts held\n\u2022 CSM for reins contracts held can be positive or negative\n  \u25e6 Reflects net gain or cost at inception\n  \u25e6 Negative CSM reflects ceded deferred profit","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Other considerations for reinsurance contracts held (review back).","a":"\u2022 Reins contracts can never be direct participating contracts\n  \u25e6 I.e. VFA never allowed for any reins contract (held or issued)\n\u2022 Reins can follow PAA if eligible\n  \u25e6 Assessment separate from underlying contracts\n  \u25e6 Reins coverage may be \u0105 1 year even if underlying contracts \u0103 1 year\n\u2022 Reins contracts follow same aggregation requirements as underlying contracts\n  \u25e6 May result in group with only one reins contract","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"Differences in earliest recognition date for proportionate vs. non-proportionate\nreinsurance under IFRS 17?","a":"Proportionate reinsurance: begin recognizing at same date as underlying contracts\n\u2022 I.e. at least one underlying contract must be recognized first\nNon-proportionate reinsurance: begin recognizing at earlier of:\n\u2022 Beginning of reins group\u2019s coverage period\n\u2022 Date entity recognizes onerous underlying group","source":"ILA101-111: Insurance Contracts First Impressions","reading":"ILA101-111: Insurance Contracts First Impressions","chapter":null,"section":"C"},{"q":"TVM accumulation function and properties?","a":"Value of money changes over time\naptq = accumulation function\nap0q \u201c 1\napt ` sq \u201c aptqapsq\nt, s \u011b 0\nAbove equality must be satisfied at all times\n\u2022 If apt ` sq \u0103 aptqapsq, investor better off withdrawing at t and immediately\nreinvesting\n\u2022 If apt ` sq \u0105 aptqapsq, investor better off waiting until t ` s maturity","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"How does Law of Large Numbers apply to traditional insurance risks?","a":"LLN: average of many i.i.d. random variables approaches expected value\nX n :\u201c 1\nnpX1 ` \u00a8 \u00a8 \u00a8 ` Xnq \u00d1 \u00b5,\nn \u00d1 8.\nX1, X2, etc. can be insurance claims (life, auto, fire, etc.)\nMortality and longevity are diversifiable risks\n\u2022 At policy level, outcomes uncertain\n\u2022 Uncertainty \u2193as number of homogeneous policies inforce \u2191\nKey point: variability of average claim size \u2193as insurer sells more policies","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"What is the Central Limit Theorem?","a":"Lindeberg-L\u00b4evy CLT: average of large number of i.i.d. random variables is\napproximately normally distributed\nZn \u201c\nsXn \u00b4 EpsXnq\na\nVpsXnq\n\u00d1 Z,\nn \u00d1 8\nZ = standard normal random variable","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"What is the Equivalence Premium Principle?","a":"Under equivalence premium principle, P = PV expected benefits only\nP \u201c PVFB \u201c\n$\n\u2019\n&\n\u2019\n%\nBe\u00b4rT Tpx\npure endowment\nB \u00a8 sAx \u201c B \u00a8 Epe\u00b4rTxq\nwhole life\nCe\u00b4rnnpxsax`n\ndeferred immediate annuity\nB and C = benefits and annuity payments, respectively\nThis net single premium \u2192expected loss of 0 for each policy:\nEpLiq \u201c PVFB \u00b4 P \u201c 0","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"What is the Portfolio Percentile Premium Principle?","a":"More commonly used than EPP: essentially EPP + margin\nP \u201c EpXq `\na\nVpXq\u03a6\u00b41p\u03b1q\n?\nn\n\u201c Net Single Premium ` Margin\n\u03a6\u00b41p\u03b1q = inverse standard normal CDF at \u03b1th percentile\n\u2022 Margin = SD of losses \u02c6 number of SDs desired\n\u2022 P will be sufficient to cover claims \u03b1% of time\n\u2022 By CLT, margin \u21920 as policy count (n) \u21928\nVariance of pure endowment (Tqx \u201c 1 \u00b4 Tpx):\nVpXq \u201c Be\u00b4rT\nTpx Tqx \u201c EpXq \u00a8 Tqx","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Fundamental principles of Equity-Linked Insurance?","a":"\u2022 Traditional Insurance: LLN diversifies mortality/longevity risk\n\u2022 ELI: Investment risk is non-diversifiable (systematic)\n  \u25e6 Market dips impact all contracts simultaneously: \u2191maxpG \u00b4 F, 0q\n  \u25e6 Investment risk remains regardless of qx certainty\n  \u25e6 Selling more contracts \u2191exposure to investment risk\n\u2022 ELI Violates LLN Assumptions:\n  \u25e6 Not Independent: Contracts correlated via market (F vs G)\n  \u25e6 Not Identical Mean: Liabilities vary (e.g., by contract size)\n  \u25e6 Wealthy PHs buy larger policies","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Sources of investment, revenue, and expenses for deferred VAs?","a":"\u2022 Sources of investment \u2013 qualified vs. non-qualified\n  \u25e6 Qualified \u2013 tax advantaged funds meeting tax code requirements for retirement plans\n  \u25e6 Non-qualified \u2013 after-tax money (e.g. savings account, real estate sale, etc.)\n\u2022 Sources of revenue \u2013 fees and charges assessed to PHs\n  \u25e6 GMxB rider charges: % of guarantee base\n  \u25e6 GMDB insurance charges: % of FV\n  \u25e6 Admin expense charges: fixed rate or % of FV, often in M&E fee\n  \u25e6 Investment management fee: % of FV\n  \u25e6 Surrender charge\n\u2022 Sources of expenses\n  \u25e6 Acquisition costs: agent commissions, marketing costs, UW costs\n  \u25e6 Hedging costs: acquiring and managing GMxB hedging portfolios","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"VA accumulation phase formula using unit calculations?","a":"Subaccount value = number of units \u02c6 unit value\nInitial Units \u201c Initial Purchase Payment\nAccumulation Unit Value\nAdditional purchases add units; outflows reduce units\nInitial UV = arbitrary value, then updated for income, capital gains, M&E fees\nAt any time, FV = Units \u02c6 Unit Value","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"VA accumulation phase formula ignoring unit calculations?","a":"Subaccount value evolves from time 0 as:\nFk{n \u201c F0\nSk{n\nS0\n\u00b4\n1 \u00b4 m\nn\n\u00afk\n,\nk \u201c 1, 2, . . . , nT\n(discrete time)\nFt \u201c F0\nSt\nS0\ne\u00b4mt\n(continuous time)\nPV of insurer\u2019s fee income (\u201dmargin offset\u201d):\nMk{n \u201c\nk\u00ff\nj\u201c1\ne\u00b4rpj\u00b41q{n \u00b4me\nn\n\u00af\nFpj\u00b41q{n\nwhere me = FV-based GMxB charge rate (margin offset)","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Possible definitions of guarantee base (G) for VAs?","a":"\u2022 Reset option \u2013 Ensures G \u011b F immediately after each renewal date (Tk)\nGTk \u201c maxrGTk\u00b41, FTks\n\u2022 Roll-up option \u2013 G accrues interest at constant rate \u03c1\nGpk`1q{n \u201c Gk{n\n\u00b4\n1 ` \u03c1\nn\n\u00af\nor\nGk{n \u201c G0\n\u00b4\n1 ` \u03c1\nn\n\u00afk\n\u2022 Step-up option (aka ratchet) \u2013 reset option that can happen any period\n  \u25e6 Lifetime high step-up: G = largest FV to date\nGpk`1q{n \u201c maxrGk{n, Fpk`1q{ns\n  \u25e6 Annual high step-up: if FV \u2191, G \u2191by same rate\nGpk`1q{n \u201c Gk{n\nFk{n\nmaxtFk{n, Fpk`1q{nu\nor\nGk{n \u201c G0\nk\u00b41\n\u017a\nj\u201c0\nmax\n\"\n1, Fpj`1q{n\nFj{n\n*\n\u2022 Other variations: combinations (max), continuous time, etc.","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Common guaranteed minimum benefits sold with VAs?","a":"\u2022 GMMB \u2013 Guarantees MB = maxrGT, FTs at maturity T\n\u2022 GMAB \u2013 Guarantees F \u201c G immediately after each reset date Tk\n  \u25e6 If F \u0105 G, G reset to F; else F reset to G\n  \u25e6 \u201dPayoff\u201d = maxrGTk \u00b4 FTk, 0s at each reset date Tk\n  \u25e6 Another variation only adjusts G if F \u0105 G\n\u2022 GMDB \u2013 Guarantees DB = maxrGt, Fts\n\u2022 GMWB \u2013 Guarantees withdrawal benefit, w, as % of G\n  \u25e6 Withdrawals paid until guarantee fully withdrawn\n  \u25e6 \u201dRuin time\u201d = point at which FV = 0\n  \u25e6 Takes T \u201c F0{w periods to deplete guarantee\n\u2022 GLWB \u2013 Lifetime version of GMWB\n  \u25e6 Guaranteed withdrawals continue for life even if FV = 0\n  \u25e6 Guarantee charge assessed on G, not F like others","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Net liability for common VA guaranteed minimum benefits?","a":"L = PV Expected Payments In Excess of FV \u00b4 PV Expected Margin Offset Income\nExpected Benefits in Excess of FV\nGMMB\nTpx maxrGT \u00b4 FT, 0s\nGMAB\nTk px maxrGTk \u00b4 FTk, 0s for each reset date Tk\nGMDB\nt\u00b41pxqx`t\u00b41 maxrGt \u00b4 Ft, 0s for t \u201c 1, 2, . . . , T\nGMWB\nwt for t \u0105 ruin time\nGLWB\ntpxwt for t \u0105 expected lifetime\nInterpretation:\n\u2022 If L \u0105 0, L = assets insurer must have to cover future benefits in excess of fees\n\u2022 If L \u0103 0, |L| = PV expected profits\n\u2022 Sign can change through time and by scenario","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Simplified/practical annual FV formulas (review back).","a":"For all GMxBs other than GLWB:\nFt \u201c\nSt\nSt\u00b41\nFt\u00b41p1 \u00b4 mq \u00b4 wt\nm \u201c FV-based charge including GMxB rider charge\nwt \u201c withdrawal or surrender amount\nFor GLWB only:\nFt \u201c\nSt\nSt\u00b41\nrFt\u00b41p1 \u00b4 mq \u00b4 mw \u02c6 Gt\u00b41s \u00b4 wt\nmw \u201c guarantee-based fee rate applied to G\nm \u201c FV-based charge not including mw","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"How to modify VA formulas for flexible premiums?","a":"Some VAs allow additional contributions, c\nFpk`1q{n \u201c\nSpk`1q{n\nSk{n\nFk{n\n\u00b4\n1 \u00b4 m\nn\n\u00af\n` c\nn\nG also \u2191with each contribution\u2014e.g. for roll-up:\nGk{n \u201c Gk{n\n\u00b4\n1 ` \u03c1\nn\n\u00af\n` c\nn","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Mechanics of immediate variable annuity?","a":"Initial calculations:\nP0 \u201c F0\n:an\nand\nUnits \u201c P0\nV0\nSubsequent calculations:\nPk \u201c Units \u02c6 Vk\nor\nPk\u00b41 \u02c6 Vk if ignoring units\nVk \u201c Vk\u00b41 \u02c6\nIk\n1 ` i\nIk \u201c Previous NAV ` InvInc & CapGains \u00b4 CapLosses & Charges (m)\nPrevious NAV\nNAV = PH\u2019s net asset value (FV); Ik = net investment factor (NIF)","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Formulas used to model immediate variable annuities?","a":"NIF expressed as:\nIk \u201c\nSk\nSk\u00b41\np1 \u00b4 mq\nAllows rewriting formulas for Pk and Fk:\nPk \u201c P0\nSk\nS0\n\u02c61 \u00b4 m\n1 ` i\n\u02d9k\nFk \u201c Sk\nS0\np1 \u00b4 mqkpF0 \u00b4 P0:ak q","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Key differences with life-contingent variable immediate annuities?","a":"Life-contingent version based on life annuity factor with AIR\nP0 \u201c F0\n:ax\nFk \u201c Sk\nS0\np1 \u00b4 mqkpF0 \u00b4 P0:ak q\n(Same as traditional)\nUnlike traditional immediate annuity, LC payments stop immediately on death\n\u2022 If PH dies before expected lifetime Kx, FV \u0105 0 at death\n  \u25e6 Insurer Profit = FV released on death (Fk)\n\u2022 If PH outlives Kx, FV = 0, but insurer pays Pk until death\nLiability \u201c\nKx\n\u00ff\nk\u201c1\nPkIp:ak \u0105 :axq\n\u2022 Interaction between investments and mortality = more uncertainty for insurer","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Compare Fixed-Indexed Annuities (aka EIAs) with VAs.","a":"Key difference with traditional fixed DAs: more upside through index participation\nDifferences with VAs:\n\u2022 Cash Flows:\n  \u25e6 FIAs: Assets held in GA; insurer bears equity risk\n  \u25e6 VAs: Assets held in SA; PHs bear equity risk (except GMxBs)\n\u2022 Risk and Reward:\n  \u25e6 FIAs: partial participation in equity returns with caps\n  \u25e6 VAs: full participation without caps\n\u2022 Fees:\n  \u25e6 FIAs: no fees; control costs via participation rates, caps, floors\n  \u25e6 VAs: charge fees for management and guarantees (like mutual funds)\n\u2022 Regulation:\n  \u25e6 FIAs: fixed annuities regulated as insurance products\n  \u25e6 VAs: securities regulated by SEC","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Common index crediting methods for fixed indexed annuities?","a":"1. Point-to-Point \u2013 compares index at beginning and end of term\n  \u25e6 Guaranteed min maturity value = G \u201c PegT\n2. Cliquet \u2013 compares index value at beginning and end of each year\n  \u25e6 Annual index return may be capped at c\n  \u25e6 Guaranteed min annual return = g where g \u0103 c \u0103 1\n3. High-Water Mark \u2013 based on highest index value on policy anniversary\n  \u25e6 Guaranteed min maturity value = G \u201c PegT\nEach design includes index participation rate, \u03b1\n\u2022 Can be applied in \u201dsimple\u201d or \u201dcompound\u201d way\n\u2022 Results similar for small index returns","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"Maturity value formulas (review back).","a":"PTP maturity value:\nmax\n\u02c6\nP\n\u02c6\n1 ` \u03b1ST \u00b4 S0\nS0\n\u02d9\n, PegT\n\u02d9\nor\nmax\n\u02c6\nP\n\u02c6ST\nS0\n\u02d9\u03b1\n, PegT\n\u02d9\nCliquet maturity value:\nP\nT\u017a\nk\u201c1\nmax\n\u02c6\nmin\n\u02c6\n1 ` \u03b1Sk \u00b4 Sk\u00b41\nSk\u00b41\n, ec\n\u02d9\n, eg\n\u02d9\nor\nP\nT\u017a\nk\u201c1\nmax\n\u02c6\nmin\n\u02c6\u02c6 Sk\nSk\u00b41\n\u02d9\u03b1\n, ec\n\u02d9\n, eg\n\u02d9\nHWM maturity value:\nmax\n\u02c6\nP\n\u02c6\n1 ` \u03b1\n\u02c6maxrSks\nS0\n\u00b4 1\n\u02d9\u02d9\n, PegT\n\u02d9\nor\nmax\n\u02c6\nP\n\u02c6maxrSks\nS0\n\u02d9\u03b1\n, PegT\n\u02d9","source":"ICRMELI Ch. 1: Modeling of ELI","reading":"ICRMELI","chapter":"Ch. 1 \u2013 Modeling of ELI","section":"C"},{"q":"How do forwards and futures work?","a":"Agreement to buy/sell asset at set price (forward price) on future date\n\u2022 No cost to enter (simply an agreement)\n\u2022 Forwards typically
